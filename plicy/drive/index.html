<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>黄金の金色ドライバー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <h1 class="game-title">黄金の金色ドライバー</h1>

    <!-- Title Screen -->
    <div id="title-screen">
      <img id="title-yoshinori" src="yoshinori.png" alt="ヨシノリ">
      <div id="title-highscore"></div>
      <button id="start-btn">スタート</button>
      <p id="title-hint">← → キーか画面タップで操作 / スペースか画面中央タップでアイテム</p>
    </div>

    <!-- Yoshinori Introduction Screen -->
    <div id="intro-screen" class="hidden">
      <img id="intro-yoshinori" src="yoshinori.png" alt="ヨシノリ">
      <div id="intro-text"></div>
      <button id="intro-next-btn">つぎへ</button>
    </div>

    <!-- Slot Machine Screen -->
    <div id="slot-screen" class="hidden">
      <div id="slot-title">博士「マシンを組み立ててやろう！」</div>
      <div id="hakase-speech"></div>

      <div id="slot-container">
        <div class="slot-reel" id="reel1">
          <div class="slot-label">ボディ</div>
          <div class="slot-window"><div class="slot-strip"></div></div>
        </div>
        <div class="slot-reel" id="reel2">
          <div class="slot-label">エンジン</div>
          <div class="slot-window"><div class="slot-strip"></div></div>
        </div>
        <div class="slot-reel" id="reel3">
          <div class="slot-label">タイヤ</div>
          <div class="slot-window"><div class="slot-strip"></div></div>
        </div>
      </div>

      <button id="slot-btn">ストップ！</button>
      <div id="slot-result" class="hidden"></div>
      <button id="race-btn" class="hidden">レースへ出発！</button>
    </div>

    <!-- Conversation Scene -->
    <div id="conversation-screen" class="hidden">
      <img id="conv-image" src="yoshinori-conv.png" alt="博士とヨシノリ">
      <div id="conv-dialogue"></div>
      <button id="conv-next-btn">つぎへ</button>
    </div>

    <!-- Yoshinori Close-up Scene -->
    <div id="yoshinori-screen" class="hidden">
      <img id="yoshinori-closeup" src="yoshinori.png" alt="ヨシノリ">
      <div id="yoshinori-line"></div>
    </div>

    <!-- Mounting Professor Scene -->
    <div id="mount-screen" class="hidden">
      <img id="mount-hakase" src="hakase-mount.png" alt="四つん這いの博士">
      <div id="mount-instruction">タップして博士に乗ろう！</div>
      <div id="mount-overlay" class="hidden">
        <div id="mount-flash"></div>
        <div id="mount-sparks"></div>
        <div id="mount-text">乗車完了</div>
        <div id="mount-subtext">BOARDING COMPLETE</div>
      </div>
    </div>

    <!-- Race Screen -->
    <div id="race-screen" class="hidden">
      <div id="race-hud">
        <div id="hud-position">順位: 1st</div>
        <div id="hud-lap">LAP: 1/3</div>
        <div id="hud-item"></div>
      </div>
      <canvas id="race-canvas" width="400" height="500"></canvas>
      <div id="race-message" class="hidden"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <div id="result-title"></div>
      <div id="result-comment"></div>
      <div id="result-time"></div>
      <div id="result-highscore"></div>
      <button id="retry-btn">もう一回遊ぶ</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
