  <style>
    /* 実績ページ固有スタイル */
    .achieve-hero {
      position: relative;
      min-height: 35vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #2d1b69 100%);
      padding: 4rem 1.5rem 2rem;
    }

    .achieve-hero-content {
      position: relative;
      z-index: 2;
    }

    .achieve-hero-content h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 6vw, 3.5rem);
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .achieve-hero-content p {
      color: var(--text-muted);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
    }

    /* 統計サマリー */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .stat-item {
      text-align: center;
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      min-width: 120px;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--accent-yellow);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* プログレスバー */
    .progress-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .progress-track {
      width: min(500px, 90%);
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin: 0.8rem auto 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
      border-radius: 8px;
      transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .progress-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-text strong {
      color: var(--accent-pink);
    }

    /* 実績グリッド */
    .achieve-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .achieve-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .achieve-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .achieve-card--locked {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    .achieve-card--locked:hover {
      transform: none;
      box-shadow: none;
    }

    .achieve-card--unlocked {
      border-color: rgba(255, 110, 199, 0.3);
      animation: achieveUnlockAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      overflow: hidden;
    }

    .achieve-card--unlocked::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 40%,
        rgba(255, 255, 255, 0.05) 45%,
        rgba(255, 255, 255, 0.1) 50%,
        rgba(255, 255, 255, 0.05) 55%,
        transparent 60%
      );
      animation: achieveShimmer 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes achieveShimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(0deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(0deg); }
    }

    @keyframes achieveUnlockAppear {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .achieve-card--unlocked:hover {
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.3),
        0 0 20px rgba(255, 110, 199, 0.15);
    }

    /* 全解除コンプリート演出 */
    .progress-section.complete .progress-fill {
      background: linear-gradient(90deg, #f5af19, #f12711, #ff6ec7, #00fff7);
      background-size: 300% 100%;
      animation: progressRainbow 3s linear infinite;
    }

    .progress-section.complete .progress-text {
      color: var(--accent-yellow);
    }

    @keyframes progressRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .achieve-icon {
      font-size: 2.5rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .achieve-card--locked .achieve-icon {
      filter: grayscale(1);
    }

    .achieve-info {
      flex: 1;
      min-width: 0;
    }

    .achieve-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      color: var(--accent-yellow);
      margin-bottom: 0.3rem;
    }

    .achieve-card--locked .achieve-title {
      color: var(--text-muted);
    }

    .achieve-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .achieve-date {
      font-size: 0.7rem;
      color: var(--accent-green);
      margin-top: 0.4rem;
      opacity: 0.8;
    }

    /* 実績なしメッセージ */
    .achieve-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 2;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      .achieve-grid {
        grid-template-columns: 1fr;
      }

      .stats-bar {
        gap: 1rem;
      }

      .stat-item {
        min-width: 90px;
        padding: 0.8rem 1rem;
      }

      .stat-value {
        font-size: 1.5rem;
      }

      .achieve-hero {
        min-height: 25vh;
        padding: 3.5rem 1rem 1.5rem;
      }
    }

    /* 固定ナビ（このページ用） */
    .page-fixed-nav {
      position: fixed;

  <!-- ヒーロー -->

  <main>
    <section id="achievements">
      <div class="progress-section fade-in">
        <p class="progress-text" id="progress-text">読み込み中...</p>

        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-games">0</div>

          <div class="stat-value" id="stat-highscores">0</div>

  <!-- 共通モジュールを読み込んで実績データにアクセス -->
  <script src="games/common/game-common.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const SG = window.SurrealGames;
      if (!SG) return;

      // 統計を取得
      const stats = SG.Stats.getSummary();
      document.getElementById('stat-plays').textContent = stats.totalPlays;
      document.getElementById('stat-games').textContent = stats.uniqueGames;
      document.getElementById('stat-highscores').textContent = stats.highScoreUpdates;

      // お気に入りゲーム
      if (stats.favoriteGameId) {
        var favGame = SG.GAME_CATALOG.find(function(g) { return g.id === stats.favoriteGameId; });
        if (favGame) {
          document.getElementById('stat-favorite').textContent = favGame.emoji;
          document.getElementById('stat-favorite').title = favGame.title + '（' + stats.favoriteGamePlays + '回）';
        }
      }

      // 全実績を取得
      const achievements = SG.Achievements.getAll();
      const unlocked = achievements.filter(a => a.unlocked).length;
      const total = achievements.length;

      // プログレス
      const pct = total > 0 ? Math.round((unlocked / total) * 100) : 0;
      document.getElementById('progress-text').innerHTML =
        `<strong>${unlocked}</strong> / ${total} 解除済み（${pct}%）`;
      document.getElementById('progress-fill').style.width = pct + '%';

      // 実績カード生成
      const grid = document.getElementById('achieve-grid');

      // 解除済みを先に、未解除を後に表示
      const sorted = [...achievements].sort((a, b) => {
        if (a.unlocked && !b.unlocked) return -1;
        if (!a.unlocked && b.unlocked) return 1;
        return 0;
      });

      grid.innerHTML = sorted.map(a => {
        const cls = a.unlocked ? 'achieve-card--unlocked' : 'achieve-card--locked';
        const dateStr = a.date
          ? new Date(a.date).toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' })
          : '';
        return `
          <div class="achieve-card ${cls} fade-in">
            <div class="achieve-icon">${a.unlocked ? a.emoji : '🔒'}</div>
            <div class="achieve-info">
              <div class="achieve-title">${a.unlocked ? a.displayTitle : '???'}</div>
              <div class="achieve-desc">${a.unlocked ? a.displayDesc : 'ゲームをプレイして解除しよう'}</div>
              ${dateStr ? `<div class="achieve-date">${dateStr} に解除</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      // 新しく追加された .fade-in 要素を observer に登録
      document.querySelectorAll('.achieve-card.fade-in:not(.visible)').forEach(el => {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            }
          });
        }, { threshold: 0.1 });
        obs.observe(el);
      });

      // 全解除コンプリート演出
      if (unlocked === total && total > 0) {
        document.querySelector('.progress-section').classList.add('complete');
      }

      // 実績シェアボタン
      var shareBtn = document.getElementById('share-achievements');
      if (shareBtn) {
        shareBtn.addEventListener('click', function () {
          var text = '【シュールゲームス 実績】\n' +
            unlocked + ' / ' + total + ' 解除済み（' + pct + '%）\n' +
            '総プレイ回数: ' + stats.totalPlays + '\n' +
            '#シュールゲームス';
          var url = window.location.href;
          window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank');
        });
        shareBtn.addEventListener('mouseenter', function () { this.style.transform = 'scale(1.05)'; });
        shareBtn.addEventListener('mouseleave', function () { this.style.transform = 'scale(1)'; });
      }

      // 実績がゼロの場合
      if (stats.totalPlays === 0) {
        grid.insertAdjacentHTML('beforebegin',
          '<div class="achieve-empty fade-in">まだゲームをプレイしていないよ。<br>ゲームを遊ぶと実績が解除されるよ！<br><a href="index.html#games" class="nav-link" style="margin-top:1rem;display:inline-block;">ゲームを遊ぶ</a></div>'
        );
      }
    })();
  </script>
