<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #f5f0eb;
  font-family: 'Zen Maru Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: #fff;
  border-bottom: 1px solid #ddd;
  width: 100%;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 5;
}
.toolbar .title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #e85d75;
  margin-right: 8px;
}
.color-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.color-btn.active { border-color: #333; transform: scale(1.2); }
.tool-btn {
  font-family: inherit;
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  color: #555;
}
.tool-btn.active { background: #e85d75; color: #fff; border-color: #e85d75; }
.tool-btn:hover { border-color: #e85d75; }
.size-slider {
  width: 60px;
  accent-color: #e85d75;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
canvas {
  flex: 1;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.bottom-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: #fff;
  border-top: 1px solid #ddd;
  width: 100%;
  justify-content: center;
}
.bottom-bar button {
  font-family: inherit;
  font-size: 0.75rem;
  padding: 5px 14px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 20px;
  cursor: pointer;
  color: #555;
  transition: all 0.2s;
}
.bottom-bar button:hover { border-color: #e85d75; color: #e85d75; }
.back-to-top-link {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(12px + env(safe-area-inset-left, 0px));
  color: #666;
  font-size: 0.74rem;
  text-decoration: none;
  z-index: 100;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.86);
  border: 1px solid rgba(232,93,117,0.14);
}
@media (max-width: 480px) {
  .toolbar {
    padding: 48px 10px 8px 10px;
    justify-content: flex-start;
  }

  .toolbar .title {
    display: none;
  }

  .tool-btn {
    padding: 4px 8px;

  .size-slider {
    width: 52px;

  .bottom-bar {
    gap: 6px;
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  }

  .bottom-bar button {
    padding: 5px 11px;
    font-size: 0.72rem;
  }
}

<body>
<div class="toolbar">
  <span class="title" data-i18n="title">🎨 お絵かきボード</span>
  <button class="color-btn active" data-color="#333" style="background:#333" aria-label="黒" aria-pressed="true" title="黒"></button>
  <button class="color-btn" data-color="#e85d75" style="background:#e85d75" aria-label="ピンク" aria-pressed="false" title="ピンク"></button>
  <button class="color-btn" data-color="#f0a030" style="background:#f0a030" aria-label="オレンジ" aria-pressed="false" title="オレンジ"></button>
  <button class="color-btn" data-color="#4caf50" style="background:#4caf50" aria-label="みどり" aria-pressed="false" title="みどり"></button>
  <button class="color-btn" data-color="#2196f3" style="background:#2196f3" aria-label="あお" aria-pressed="false" title="あお"></button>
  <button class="color-btn" data-color="#9c27b0" style="background:#9c27b0" aria-label="むらさき" aria-pressed="false" title="むらさき"></button>
  <button class="color-btn" data-color="#fff" style="background:#fff; border-color:#ccc" aria-label="しろ" aria-pressed="false" title="しろ"></button>
  <label class="visually-hidden" for="size-slider">線の太さ</label>
  <input type="range" class="size-slider" id="size-slider" min="1" max="30" value="4" aria-label="線の太さ">
  <button class="tool-btn active" id="pen-btn" data-i18n="pen" aria-pressed="true">ペン</button>
  <button class="tool-btn" id="eraser-btn" data-i18n="eraser" aria-pressed="false">消しゴム</button>
</div>
<canvas id="draw-canvas"></canvas>
<div class="bottom-bar">
  <button id="undo-btn" data-i18n="undo">↩ 元に戻す</button>
  <button id="clear-btn" data-i18n="clear">🗑 全消し</button>
  <button id="save-btn" data-i18n="save">💾 保存</button>
</div>
<a href="../../index.html" class="back-to-top-link" data-i18n="backToTop">← トップに戻る</a>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let currentColor = '#333';
  let brushSize = 4;
  let isEraser = false;
  let history = [];
  let lastX, lastY;

  function resize() {
    const toolbar = document.querySelector('.toolbar');
    const bottomBar = document.querySelector('.bottom-bar');
    const w = window.innerWidth;
    const h = window.innerHeight - toolbar.offsetHeight - bottomBar.offsetHeight;
    // Save current drawing
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    canvas.width = w;
    canvas.height = h;
    // Fill white background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    // Restore drawing
    ctx.putImageData(imageData, 0, 0);
  }

  function initCanvas() {
    const toolbar = document.querySelector('.toolbar');
    const bottomBar = document.querySelector('.bottom-bar');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - toolbar.offsetHeight - bottomBar.offsetHeight;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState();
  }

  function saveState() {
    if (history.length > 30) history.shift();
    history.push(canvas.toDataURL());
  }

  function undo() {
    if (history.length <= 1) return;
    history.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = history[history.length - 1];
  }

  function clearCanvas() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState();
  }

  function saveImage() {
    const link = document.createElement('a');
    link.download = 'surreal-drawing.png';
    link.href = canvas.toDataURL();
    link.click();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const p = getPos(e);
    lastX = p.x;
    lastY = p.y;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.strokeStyle = isEraser ? '#fff' : currentColor;
    ctx.lineWidth = isEraser ? brushSize * 3 : brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x;
    lastY = p.y;
  }

  function endDraw() {
    if (drawing) {
      drawing = false;
      saveState();
    }
  }

  function setActiveColorButton(activeButton) {
    document.querySelectorAll('.color-btn').forEach((button) => {
      const isActive = button === activeButton;
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
    });
  }

  function setToolMode(useEraser) {
    isEraser = useEraser;
    const penBtn = document.getElementById('pen-btn');
    const eraserBtn = document.getElementById('eraser-btn');
    penBtn.classList.toggle('active', !useEraser);
    eraserBtn.classList.toggle('active', useEraser);
    penBtn.setAttribute('aria-pressed', String(!useEraser));
    eraserBtn.setAttribute('aria-pressed', String(useEraser));
  }

  canvas.addEventListener('pointerdown', startDraw);
  canvas.addEventListener('pointermove', draw);
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointerleave', endDraw);

  // Color buttons
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setActiveColorButton(btn);
      currentColor = btn.dataset.color;
      setToolMode(false);
    });
  });

  // Size slider
  document.getElementById('size-slider').addEventListener('input', (e) => {
    brushSize = parseInt(e.target.value);
  });

  // Pen / Eraser
  document.getElementById('pen-btn').addEventListener('click', () => {
    setToolMode(false);
  });
  document.getElementById('eraser-btn').addEventListener('click', () => {
    setToolMode(true);
  });

  // Bottom buttons
  document.getElementById('undo-btn').addEventListener('click', undo);
  document.getElementById('clear-btn').addEventListener('click', clearCanvas);
  document.getElementById('save-btn').addEventListener('click', saveImage);

  window.addEventListener('resize', () => { resize(); });
  setActiveColorButton(document.querySelector('.color-btn.active'));
  setToolMode(false);
  initCanvas();
})();
</script>
