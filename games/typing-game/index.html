<html lang="ja">

<link rel="stylesheet" href="../common/game-common.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  font-family: 'Zen Maru Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.screen.active { display: flex; }

#title-screen h1 {
  font-size: clamp(1.8rem, 7vw, 2.8rem);
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  margin-bottom: 0.3em;
}
#title-screen .subtitle {
  font-size: clamp(0.85rem, 3vw, 1.1rem);
  opacity: 0.85;
  margin-bottom: 2em;
}
.start-btn {
  font-family: inherit;
  font-size: 1.2rem;
  padding: 0.8em 2.5em;
  border: 2px solid #fff;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 50px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
.start-btn:hover, .start-btn:active { background: #fff; color: #764ba2; }

/* Game screen */
#game-screen { width: 100%; max-width: 600px; }
.timer-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  margin-bottom: 20px;
  overflow: hidden;
}
.timer-bar-inner {
  height: 100%;
  background: #ffdd57;
  border-radius: 3px;
  transition: width 0.1s linear;
}
.stats-row {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 15px;
  font-size: 0.9rem;
  opacity: 0.9;
}
.word-japanese {
  font-size: clamp(1.1rem, 4.5vw, 1.7rem);
  font-weight: 700;
  min-height: 1.4em;
  margin-bottom: 12px;
  word-break: break-word;
  line-height: 1.45;
  text-shadow: 0 2px 10px rgba(0,0,0,0.25);
  max-width: 100%;
}
.word-romaji {
  font-family: 'Courier New', monospace;
  font-size: clamp(1.05rem, 4vw, 1.55rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 18px;
  min-height: 1.5em;
  word-break: break-all;
  line-height: 1.5;
  max-width: 100%;
}
.word-romaji .correct { color: #a5ffa5; }
.word-romaji .current { color: #ffdd57; text-decoration: underline; }
.word-romaji .remaining { color: rgba(255,255,255,0.6); }
.input-area {
  font-family: 'Courier New', monospace;
  font-size: clamp(1rem, 3.5vw, 1.3rem);
  padding: 10px 18px;
  width: 90%;
  max-width: 400px;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.1);
  color: #fff;
  border-radius: 12px;
  text-align: right;
  outline: none;
  backdrop-filter: blur(8px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.input-area:focus { border-color: #ffdd57; }
.combo-display {
  font-size: 1rem;
  color: #ffdd57;
  margin-top: 10px;
  min-height: 1.5em;
  transition: transform 0.15s;
}

/* Result screen */
#result-screen h2 {
  font-size: clamp(1.4rem, 5vw, 2rem);
  margin-bottom: 0.5em;
}
.result-score {
  font-size: clamp(3rem, 10vw, 4.5rem);
  font-weight: 900;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.result-label { opacity: 0.8; margin-bottom: 0.5em; }
.result-stats {
  display: flex;
  gap: 20px;
  margin: 1em 0 1.5em;
  font-size: 0.9rem;
  opacity: 0.85;
}
.result-stats div { text-align: center; }
.result-stats .num {
  display: block;
  font-size: 1.5rem;
  font-weight: 700;
}
#result-screen button {
  font-family: inherit;
  font-size: 1rem;
  padding: 0.7em 2em;
  border: 2px solid #fff;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 50px;
  cursor: pointer;
  margin: 0.3em;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
#result-screen button:hover, #result-screen button:active { background: #fff; color: #764ba2; }
.back-to-top-link {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 0.75rem;
  text-decoration: none;
  z-index: 100;
}
</style>
</head>
<body>

<div id="title-screen" class="screen active">
  <h1>⌨️ シュールタイピング</h1>
  <p class="subtitle" data-i18n="subtitle">シュールなお題をタイピングしまくれ！</p>
  <button class="start-btn" id="start-btn" data-i18n="startBtn">スタート</button>
</div>

<div id="game-screen" class="screen">
  <div class="timer-bar"><div class="timer-bar-inner" id="timer-bar"></div></div>
  <div class="stats-row">
    <span id="hud-score" data-i18n="score">スコア: 0</span>
    <span id="hud-time" data-i18n="time">残り: 60s</span>
  </div>
  <div class="word-japanese" id="word-japanese"></div>
  <div class="word-romaji" id="word-romaji"></div>
  <input type="text" class="input-area" id="input-area" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="combo-display" id="combo-display"></div>
</div>

<div id="result-screen" class="screen">
  <h2 data-i18n="resultTitle">タイムアップ！</h2>
  <div class="result-score" id="final-score">0</div>
  <p class="result-label" data-i18n="resultLabel">ポイント</p>
  <div class="result-stats">
    <div><span class="num" id="stat-words">0</span><span data-i18n="wordsCleared">クリア語数</span></div>
    <div><span class="num" id="stat-combo">0</span><span data-i18n="maxCombo">最大コンボ</span></div>
  </div>
  <button id="retry-btn" data-i18n="retryBtn">もう一度</button>
  <button id="share-btn">𝕏 でシェア</button>
</div>

<a href="../../index.html" class="back-to-top-link" data-i18n="backToTop">← トップに戻る</a>

<script>
(function(){
  'use strict';

  // ゲーム一覧の8タイトルから連想されるお題プール（後半ほど長文）
  // ローマ字はヘボン式（shi/chi/tsu/ji/sha/cho/fu）でユーザーが自然に打ちやすい形
  const WORD_POOLS = [
    // Tier 0: 超ショート（ウォームアップ）
    [
      { ja: 'うんこ', romaji: 'unko' },
      { ja: 'うんち', romaji: 'unchi' },
      { ja: 'かに', romaji: 'kani' },
      { ja: 'おばけ', romaji: 'obake' },
      { ja: '地雷', romaji: 'jirai' },
      { ja: '進化', romaji: 'shinka' },
      { ja: '数字', romaji: 'suuji' },
      { ja: '漆黒', romaji: 'shikkoku' },
      { ja: '天才', romaji: 'tensai' },
      { ja: '黄金', romaji: 'ougon' },
      { ja: '腹筋', romaji: 'fukkin' },
    ],
    // Tier 1: ショート（ゲームのキーワード）
    [
      { ja: 'シュール', romaji: 'shu-ru' },
      { ja: 'ヤクザ', romaji: 'yakuza' },
      { ja: 'リバーシ', romaji: 'riba-shi' },
      { ja: 'ヨシノリ', romaji: 'yoshinori' },
      { ja: 'かにみそ', romaji: 'kanimiso' },
      { ja: '田舎者', romaji: 'inakamono' },
      { ja: '不法侵入', romaji: 'fuhoushinnyuu' },
      { ja: '経営分析', romaji: 'keieibunseki' },
      { ja: '永久に', romaji: 'eikyuuni' },
      { ja: '成仏', romaji: 'joubutsu' },
      { ja: '戯れ', romaji: 'tawamure' },
      { ja: '夢の中', romaji: 'yumenonaka' },
    ],
    // Tier 2: ミディアム（タイトル＋名台詞フレーズ）
    [
      { ja: 'シュール進化論', romaji: 'shu-rushinkaron' },
      { ja: 'かにかにパニック', romaji: 'kanikanipanikku' },
      { ja: '漆黒のリバーシ', romaji: 'shikkokunoriba-shi' },
      { ja: '30秒の激闘', romaji: 'sanjuubyounogekitou' },
      { ja: '吾輩の番だが', romaji: 'wagahainobandaga' },
      { ja: '勝つべくして勝つ', romaji: 'katsubekushitekatsu' },
      { ja: '黄金の金色ドライバー', romaji: 'ougonnokinnirodoraiba-' },
      { ja: 'かいだんマインスイーパー', romaji: 'kaidanmainsui-pa-' },
      { ja: 'シュールゲームス', romaji: 'shu-ruge-musu' },
      { ja: '数字に愛されるオレ', romaji: 'suujiniaisareruore' },
      { ja: '永久に吾輩の番だ', romaji: 'eikyuuniwagahainobanda' },
    ],
    // Tier 3: 長文（ゲーム説明文・名台詞）
    [
      { ja: '本当の恐怖はここにある', romaji: 'hontounokyoufuhakokoniaru' },
      { ja: '地雷を探して霊を成仏させろ', romaji: 'jiraiwosagashitereiwojoubutsusasero' },
      { ja: '腹筋は毎日換気するよ', romaji: 'fukkinhamainichikankisuruyo' },
      { ja: 'はさみがないと何もできない', romaji: 'hasamiganaitonanimodekinai' },
      { ja: 'ものごとは二つに分けられる', romaji: 'monogotohafutatsuniwakerareru' },
      { ja: '分析できるかできないかだ', romaji: 'bunsekidekirukadekinaikada' },
      { ja: '一般的には不法侵入だ', romaji: 'ippantekinihafuhoushinnyuuda' },
      { ja: 'シュールでキュートなキャラクター', romaji: 'shu-rudekyu-tonakyarakuta-' },
      { ja: '気が付いたらかわいい部屋にいた', romaji: 'kigatsuitarakawaiiheyaniita' },
      { ja: '空から落ちてくるソフトクリーム', romaji: 'sorakaraochitekurusofutokuri-mu' },
    ],
    // Tier 4: 超長文（後半のラスボスゾーン）
    [
      { ja: 'はさみがないと何もできない愚かな動物', romaji: 'hasamiganaitonanimodekinaiorokanadoubutsu' },
      { ja: 'シュールでキュートなキャラクターたちを合体して進化させろ', romaji: 'shu-rudekyu-tonakyarakuta-tachiwogattaishiteshinkasasero' },
      { ja: '誰もが憧れるドライバー界の頂点にして最下層', romaji: 'daremogaakogarerudoraiba-kainochoutennishitesaikasou' },
      { ja: 'ものごとは二つに分けられる分析できるかできないかだ', romaji: 'monogotohafutatsuniwakerarerubunsekidekirukadekinaikada' },
      { ja: '気が付いたらかわいい部屋にいた一般的には不法侵入だ', romaji: 'kigatsuitarakawaiiheyaniitaippantekinihafuhoushinnyuuda' },
      { ja: '本当の恐怖はここにある地雷を探して霊を成仏させろ', romaji: 'hontounokyoufuhakokoniarujiraiwosagashitereiwojoubutsusasero' },
      { ja: '永久に吾輩の番だ吾輩の番だ吾輩の番だ', romaji: 'eikyuuniwagahainobandawagahainobandawagahainobanda' },
      { ja: '田舎者のヨシノリが黄金の金色ドライバーに挑む', romaji: 'inakamononoyoshinorigaougonnokinnirodoraiba-niidomu' },
      { ja: '夢の中のヤクザかにかにを叩いて腹筋を換気しろ', romaji: 'yumenonakanoyakuzakanikaniwotataitefukkinwokankishiro' },
    ],
  ];

  const GAME_TIME = 60;
  let score, combo, maxCombo, wordsCleared, timeLeft, timerInterval, currentWord, typedIndex;
  let gameRunning = false;
  let recentJa = [];

  const titleScreen = document.getElementById('title-screen');
  const gameScreen = document.getElementById('game-screen');
  const resultScreen = document.getElementById('result-screen');
  const wordJapanese = document.getElementById('word-japanese');
  const wordRomaji = document.getElementById('word-romaji');
  const inputArea = document.getElementById('input-area');
  const comboDisplay = document.getElementById('combo-display');
  const timerBar = document.getElementById('timer-bar');

  function pickTier() {
    if (wordsCleared < 3) return 0;
    if (wordsCleared < 6) return 1;
    if (wordsCleared < 10) return 2;
    if (wordsCleared < 15) return 3;
    return 4;
  }

  function pickWord() {
    const pool = WORD_POOLS[pickTier()];
    let pick;
    for (let i = 0; i < 6; i++) {
      pick = pool[Math.floor(Math.random() * pool.length)];
      if (!recentJa.includes(pick.ja)) break;
    }
    recentJa.push(pick.ja);
    if (recentJa.length > 4) recentJa.shift();
    return pick;
  }

  function nextWord() {
    currentWord = pickWord();
    typedIndex = 0;
    wordJapanese.textContent = currentWord.ja;
    renderWord();
    inputArea.value = '';
  }

  function renderWord() {
    const chars = currentWord.romaji.split('');
    let html = '';
    chars.forEach((c, i) => {
      if (i < typedIndex) html += '<span class="correct">' + c + '</span>';
      else if (i === typedIndex) html += '<span class="current">' + c + '</span>';
      else html += '<span class="remaining">' + c + '</span>';
    });
    wordRomaji.innerHTML = html;
  }

  function updateHUD() {
    const prefix = typeof SurrealI18n !== 'undefined' ? (SurrealI18n.t('scorePrefix') || 'スコア') : 'スコア';
    const timePrefix = typeof SurrealI18n !== 'undefined' ? (SurrealI18n.t('timePrefix') || '残り') : '残り';
    document.getElementById('hud-score').textContent = prefix + ': ' + score;
    document.getElementById('hud-time').textContent = timePrefix + ': ' + timeLeft + 's';
    timerBar.style.width = (timeLeft / GAME_TIME * 100) + '%';
    if (combo >= 2) {
      comboDisplay.textContent = '🔥 ' + combo + ' COMBO!';
      comboDisplay.style.transform = 'scale(1.15)';
      setTimeout(() => comboDisplay.style.transform = 'scale(1)', 100);
    } else {
      comboDisplay.textContent = '';
    }
  }

  function startGame() {
    score = 0; combo = 0; maxCombo = 0; wordsCleared = 0;
    timeLeft = GAME_TIME;
    gameRunning = true;
    recentJa = [];
    titleScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    gameScreen.classList.add('active');
    nextWord();
    updateHUD();
    inputArea.value = '';
    inputArea.focus();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    gameScreen.classList.remove('active');
    resultScreen.classList.add('active');
    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-words').textContent = wordsCleared;
    document.getElementById('stat-combo').textContent = maxCombo;
    if (typeof SurrealGames !== 'undefined') SurrealGames.reportScore(score);
  }

  inputArea.addEventListener('input', () => {
    if (!gameRunning) return;
    const val = inputArea.value.toLowerCase();
    const target = currentWord.romaji;

    if (target.startsWith(val)) {
      typedIndex = val.length;
      renderWord();
      if (val === target) {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        const comboBonus = Math.floor(combo / 3) * 5;
        const lengthBonus = Math.floor(target.length / 2);
        score += 5 + lengthBonus + comboBonus;
        wordsCleared++;
        updateHUD();
        nextWord();
      }
    } else {
      combo = 0;
      inputArea.value = target.substring(0, typedIndex);
      updateHUD();
    }
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);
})();
</script>
<script src="../common/i18n.js"></script>
<script src="../common/game-common.js"></script>
<script>
SurrealI18n.init({
  ja: { subtitle:'シュールなお題をタイピングしまくれ！', startBtn:'スタート', resultTitle:'タイムアップ！', resultLabel:'ポイント', wordsCleared:'クリア語数', maxCombo:'最大コンボ', retryBtn:'もう一度', scorePrefix:'スコア', timePrefix:'残り', backToTop:'← トップに戻る' },
  en: { subtitle:'Type surreal words as fast as you can!', startBtn:'START', resultTitle:'Time\'s Up!', resultLabel:'Points', wordsCleared:'Words', maxCombo:'Max Combo', retryBtn:'Retry', scorePrefix:'Score', timePrefix:'Time', backToTop:'← Back to Top' }
});
SurrealGames.init('typing-game');
</script>
