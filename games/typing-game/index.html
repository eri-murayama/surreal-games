  // 繧ｫ繧ｿ繧ｫ繝岩・縺ｲ繧峨′縺ｪ・医き繧ｿ繧ｫ繝翫〒繧ょ女縺台ｻ倥￠繧九ｈ縺・↓・・  function kataToHira(s) {
    return s.replace(/[\u30a1-\u30f6]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0x60)
    );
  }

  // 1繝ｦ繝九ャ繝亥・隱ｭ縺ｿ・域ｶ郁ｲｻ縺励↑縺・ｼ・  function getUnitAt(kana, pos) {
    if (pos >= kana.length) return null;
    const c = kana[pos];
    const next = kana[pos + 1];
    const digraph = c + (next || '');
    if (DIGRAPH_ROMAJI[digraph]) {
      return { alternates: DIGRAPH_ROMAJI[digraph].slice(), length: 2 };
    }
    if (BASE_ROMAJI[c]) {
      return { alternates: BASE_ROMAJI[c].slice(), length: 1 };
    }
    return null;
  }

  function getLastVowel(s) {
    const m = s.match(/[aiueo](?!.*[aiueo])/);
    return m ? m[0] : null;
  }

  // 縺九↑譁・ｭ怜・繧偵Θ繝九ャ繝磯・蛻励↓繝代・繧ｹ
  function parseKana(input) {
    const kana = kataToHira(input);
    const units = [];
    let i = 0;
    while (i < kana.length) {
      const c = kana[i];

      // 菫・浹 縺｣
      if (c === '縺｣') {
        const nxt = getUnitAt(kana, i + 1);
        if (nxt) {
          const doubled = nxt.alternates
            .filter(a => a.length > 0 && !/^[aiueo]/.test(a))
            .map(a => a[0] + a);
          if (doubled.length > 0) {
            units.push({ alternates: doubled, primary: doubled[0] });
            i += 1 + nxt.length;
            continue;
          }
        }
        units.push({ alternates: ['ltu','xtu','ltsu','xtsu'], primary: 'ltu' });
        i++;
        continue;
      }

      // 謦･髻ｳ 繧・      if (c === '繧・) {
        const nxt = kana[i + 1];
        const forceNN = !nxt || /[縺ゅ＞縺・∴縺翫ｄ繧・ｈ縺ｪ縺ｫ縺ｬ縺ｭ縺ｮ繧転/.test(nxt);
        const alts = forceNN ? ['nn',"n'",'xn'] : ['n','nn','xn'];
        units.push({ alternates: alts, primary: alts[0] });
        i++;
        continue;
      }

      // 髟ｷ髻ｳ 繝ｼ
      if (c === '繝ｼ') {
        const prev = units[units.length - 1];
        const v = prev ? getLastVowel(prev.primary) : null;
        const alts = v ? ['-', v] : ['-'];
        units.push({ alternates: alts, primary: '-' });
        i++;
        continue;
      }

      // 諡鈴浹・・譁・ｭ怜粋謌撰ｼ・      const next = kana[i + 1];
      const digraph = c + (next || '');
      if (DIGRAPH_ROMAJI[digraph]) {
        units.push({ alternates: DIGRAPH_ROMAJI[digraph].slice(), primary: DIGRAPH_ROMAJI[digraph][0] });
        i += 2;
        continue;
      }

      // 蜊倡峡縺九↑
      if (BASE_ROMAJI[c]) {
        units.push({ alternates: BASE_ROMAJI[c].slice(), primary: BASE_ROMAJI[c][0] });
        i++;
        continue;
      }

      units.push({ alternates: [c], primary: c });
      i++;
    }
    return units;
  }

  function pickTier() {
    if (wordsCleared < 3) return 0;
    if (wordsCleared < 6) return 1;
    if (wordsCleared < 10) return 2;
    if (wordsCleared < 15) return 3;
    return 4;
  }

  function pickWord() {
    const pool = WORD_POOLS[pickTier()];
    let pick;
    for (let i = 0; i < 6; i++) {
      pick = pool[Math.floor(Math.random() * pool.length)];
      if (!recentJa.includes(pick.ja)) break;
    }
    recentJa.push(pick.ja);
    if (recentJa.length > 4) recentJa.shift();
    return pick;
  }

  function nextWord() {
    currentWord = pickWord();
    units = parseKana(currentWord.kana);
    unitIdx = 0;
    typedInUnit = '';
    wordJapanese.textContent = currentWord.ja;
    wordJapanese.classList.remove('pulse');
    void wordJapanese.offsetWidth;
    wordJapanese.classList.add('pulse');
    renderWord();
    inputArea.value = '';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function renderWord() {
    let html = '';
    units.forEach((u, i) => {
      const p = u.primary;
      if (i < unitIdx) {
        html += '<span class="correct">' + escapeHtml(p) + '</span>';
      } else if (i === unitIdx) {
        const done = p.substring(0, typedInUnit.length);
        const rest = p.substring(typedInUnit.length);
        if (done) html += '<span class="correct">' + escapeHtml(done) + '</span>';
        if (rest.length > 0) {
          html += '<span class="current">' + escapeHtml(rest.charAt(0)) + '</span>';
          if (rest.length > 1) html += '<span class="remaining">' + escapeHtml(rest.substring(1)) + '</span>';
        }
      } else {
        html += '<span class="remaining">' + escapeHtml(p) + '</span>';
      }
    });
    wordRomaji.innerHTML = html;
  }

  // ===== 繧ｨ繝輔ぉ繧ｯ繝・=====
  function spawnParticles(x, y, emojis, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fx-particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const dist = 60 + Math.random() * 40;
      el.style.setProperty('--fx-dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--fx-dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }

    el.style.top = (rect.top + rect.height / 2) + 'px';

  function wordClearEffect() {
    const rect = wordRomaji.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['笨ｨ','猪','箝・,'検','笙｡'], 8);
    gameKani.classList.remove('happy');
    void gameKani.offsetWidth;
    gameKani.classList.add('happy');
  }

  function keyHitEffect() {
    gameKani.classList.remove('bounce');
    void gameKani.offsetWidth;
    gameKani.classList.add('bounce');
  }

  function missEffect() {
    document.body.classList.remove('screen-shake');
    void document.body.offsetWidth;
    document.body.classList.add('screen-shake');
  }

  // ===== 繧ｭ繝ｼ蜈･蜉帛・逅・=====
  function processKey(ch) {
    if (!gameRunning || !units || unitIdx >= units.length) return;
    const u = units[unitIdx];
    const candidate = typedInUnit + ch;
    const matching = u.alternates.filter(a => a.startsWith(candidate));

    if (matching.length === 0) {
      combo = 0;
      if (sg) sg.sound.play('wrong');
      missEffect();
      updateHUD();
      return;
    }

    typedInUnit = candidate;
    u.primary = matching[0];

    const exact = matching.find(a => a === candidate);
    if (exact) {
      u.primary = exact;
      unitIdx++;
      typedInUnit = '';
    }

    if (sg) sg.sound.play('tap');
    spawnTypedFx(ch);
    keyHitEffect();
    renderWord();

    if (unitIdx >= units.length) {
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const lenTotal = units.reduce((s,u)=>s+u.primary.length,0);
      const lengthBonus = Math.floor(lenTotal / 2);
      const comboBonus = Math.floor(combo / 3) * 5;
      score += 10 + lengthBonus + comboBonus;
      wordsCleared++;
      if (sg) sg.sound.play(combo >= 3 ? 'combo' : 'correct');
      wordClearEffect();
      updateHUD();
      nextWord();
    } else {
      updateHUD();
    }
  }

  inputArea.addEventListener('input', () => {
    if (!gameRunning) { inputArea.value = ''; return; }
    const val = inputArea.value.toLowerCase();
    inputArea.value = '';
    for (const ch of val) {
      processKey(ch);
    }
  });

  // ===== 繧ｲ繝ｼ繝髢句ｧ・邨ゆｺ・=====
  function startGame() {
    score = 0; combo = 0; maxCombo = 0; wordsCleared = 0;
    timeLeft = GAME_TIME;
    gameRunning = true;
    recentJa = [];
    titleScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    gameScreen.classList.add('active');
    nextWord();
    updateHUD();
    inputArea.value = '';
    setTimeout(() => inputArea.focus(), 50);
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);
    if (sg) sg.onGameStart();
  }

  function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    gameScreen.classList.remove('active');
    resultScreen.classList.add('active');
    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-words').textContent = wordsCleared;
    document.getElementById('stat-combo').textContent = maxCombo;
    if (sg) sg.onGameEnd(score, { maxCombo });
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);

  document.getElementById('share-btn').addEventListener('click', () => {
    const url = window.location.href;
    const text = '竚ｨ・・繧ｷ繝･繝ｼ繝ｫ繧ｿ繧､繝斐Φ繧ｰ\n繧ｹ繧ｳ繧｢: ' + score + '繝昴う繝ｳ繝茨ｼ医け繝ｪ繧｢隱樊焚: ' + wordsCleared + '・噂n\n#繧ｷ繝･繝ｼ繝ｫ繧ｲ繝ｼ繝繧ｹ\n' + url;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  });

  window.__setSg = (instance) => { sg = instance; };
})();
</script>
