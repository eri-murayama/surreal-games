<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(circle at 15% 20%, #fff4fa 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #fef6e4 0%, transparent 45%),
    linear-gradient(160deg, #ffd6e7 0%, #ffe6f3 40%, #e6f4ff 100%);
  color: #5a3a4a;
  font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  position: relative;
}

/* ぷかぷか浮かぶ背景装飾 */
.bg-deco {
  position: fixed;
  pointer-events: none;
  font-size: 1.8rem;
  opacity: 0.55;
  animation: float-deco 6s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(255, 150, 200, 0.3));
}
.bg-deco.d1 { top: 8%; left: 8%; animation-delay: 0s; }
.bg-deco.d2 { top: 14%; right: 10%; animation-delay: 1.2s; font-size: 1.4rem; }
.bg-deco.d3 { bottom: 18%; left: 6%; animation-delay: 2.4s; font-size: 1.6rem; }
.bg-deco.d4 { bottom: 10%; right: 8%; animation-delay: 3.6s; }
.bg-deco.d5 { top: 45%; left: 4%; animation-delay: 4.8s; font-size: 1.3rem; }
.bg-deco.d6 { top: 50%; right: 5%; animation-delay: 0.6s; font-size: 1.3rem; }
@keyframes float-deco {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-14px) rotate(5deg); }
}

.screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; position: relative; z-index: 2; }
.screen.active { display: flex; }

/* タイトル画面 */
#title-screen h1 {
  font-size: clamp(1.9rem, 7.5vw, 3rem);
  font-weight: 900;
  color: #ff5c9c;
  text-shadow:
    2px 2px 0 #fff,
    4px 4px 0 #ffc0d8,
    6px 6px 18px rgba(255, 100, 160, 0.35);
  margin-bottom: 0.2em;
  letter-spacing: 0.02em;
  animation: title-bounce 2.4s ease-in-out infinite;
}
@keyframes title-bounce {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-6px) rotate(1deg); }
}
#title-screen .subtitle {
  font-size: clamp(0.9rem, 3.2vw, 1.15rem);
  color: #a06080;
  margin-bottom: 1.2em;
  font-weight: 700;
}

/* かにかにキャラクター（タイトル画面で大きく表示） */
.kanikani-character {
  width: clamp(140px, 36vw, 200px);
  height: clamp(140px, 36vw, 200px);
  margin: 0 auto 0.6em;
  background-image: url('kanikani-typing.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  position: relative;
  animation: kani-bounce 1.6s ease-in-out infinite;
}
/* 画像がまだ無い場合のフォールバック絵文字 */
.kanikani-character::after {
  content: '🦀⌨️';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(3rem, 10vw, 4.8rem);
  line-height: 1;
  filter: drop-shadow(0 4px 8px rgba(255, 120, 170, 0.35));
}
/* 画像が読み込まれたらフォールバックを隠す */
.kanikani-character.loaded::after { display: none; }

@keyframes kani-bounce {
  0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); }
  50% { transform: translateY(-8px) rotate(3deg) scale(1.03); }
}

.start-btn {
  font-family: inherit;
  font-size: 1.25rem;
  font-weight: 900;
  padding: 0.85em 2.6em;
  border: none;
  background: linear-gradient(180deg, #ff7cb0 0%, #ff4e90 100%);
  color: #fff;
  border-radius: 999px;
  cursor: pointer;
  box-shadow:
    0 6px 0 #c92d6a,
    0 10px 20px rgba(255, 100, 160, 0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 0.06em;
  text-shadow: 0 2px 4px rgba(170, 40, 90, 0.35);
}
.start-btn:hover { transform: translateY(-2px); }
.start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c92d6a, 0 4px 10px rgba(255, 100, 160, 0.3); }

/* ゲーム画面 */
#game-screen { width: 100%; max-width: 620px; }

/* 小さなかにかに（ゲーム画面用） */
.kanikani-mini {
  width: clamp(70px, 18vw, 96px);
  height: clamp(70px, 18vw, 96px);
  background-image: url('kanikani-typing.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  position: relative;
  margin: 0 auto 4px;
  animation: kani-type 0.5s ease-in-out infinite;
}
.kanikani-mini::after {
  content: '🦀⌨️';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.8rem, 5vw, 2.4rem);
  line-height: 1;
}
.kanikani-mini.loaded::after { display: none; }
.kanikani-mini.cheer { animation: kani-cheer 0.5s ease-out; }
@keyframes kani-type {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-3px) rotate(2deg); }
}
@keyframes kani-cheer {
  0% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.2) rotate(-8deg); }
  60% { transform: scale(1.15) rotate(8deg); }
  100% { transform: scale(1) rotate(0); }
}

.timer-bar {
  width: 100%;
  height: 12px;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  margin-bottom: 12px;
  overflow: hidden;
  border: 2px solid #ffb6d1;
  box-shadow: inset 0 2px 4px rgba(255, 150, 190, 0.25);
}
.timer-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, #ffd86b, #ff7cb0, #b47cff);
  border-radius: 999px;
  transition: width 0.1s linear;
  box-shadow: 0 0 10px rgba(255, 180, 210, 0.7);
}

.stats-row {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 10px;
  font-size: 1rem;
  font-weight: 900;
  color: #7a2a52;
}
.stats-row span {
  background: rgba(255, 255, 255, 0.85);
  padding: 4px 14px;
  border-radius: 999px;
  border: 2px solid #ffb6d1;
  box-shadow: 0 2px 0 #ffb6d1;
}

.word-card {
  background: rgba(255, 255, 255, 0.92);
  border: 3px solid #ffb6d1;
  border-radius: 24px;
  padding: 18px 16px 14px;
  box-shadow:
    0 8px 0 #ffb6d1,
    0 14px 32px rgba(255, 140, 180, 0.35);
  width: 100%;
  margin-bottom: 14px;
  position: relative;
}
.word-card::before {
  content: '♡';
  position: absolute;
  top: -14px;
  left: 16px;
  background: #ff7cb0;
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  box-shadow: 0 2px 6px rgba(255, 100, 160, 0.4);
}
.word-card::after {
  content: '♡';
  position: absolute;
  top: -14px;
  right: 16px;
  background: #b47cff;
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  box-shadow: 0 2px 6px rgba(180, 120, 255, 0.4);
}

.word-japanese {
  font-size: clamp(1.2rem, 4.8vw, 1.8rem);
  font-weight: 900;
  min-height: 1.4em;
  margin-bottom: 10px;
  word-break: break-word;
  line-height: 1.4;
  color: #7a2a52;
  text-shadow: 1px 1px 0 #fff;
}
.word-romaji {
  font-family: 'Courier New', 'M PLUS Rounded 1c', monospace;
  font-size: clamp(1.05rem, 4.2vw, 1.6rem);
  font-weight: 900;
  letter-spacing: 0.04em;
  min-height: 1.5em;
  word-break: break-all;
  line-height: 1.5;
}
.word-romaji .correct { color: #ff4e90; }
.word-romaji .current { color: #ff7a00; text-decoration: underline wavy #ffb84d; }
.word-romaji .remaining { color: #b898ac; }

.input-area {
  font-family: 'Courier New', monospace;
  font-size: clamp(1rem, 3.5vw, 1.3rem);
  padding: 10px 18px;
  width: 90%;
  max-width: 400px;
  border: 3px solid #ffb6d1;
  background: rgba(255, 255, 255, 0.92);
  color: #7a2a52;
  border-radius: 16px;
  text-align: right;
  outline: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
  box-shadow: 0 4px 0 #ffb6d1;
}
.input-area:focus { border-color: #ff7cb0; box-shadow: 0 4px 0 #ff7cb0, 0 0 0 4px rgba(255, 124, 176, 0.2); }

.combo-display {
  font-size: 1.15rem;
  font-weight: 900;
  color: #ff4e90;
  margin-top: 10px;
  min-height: 1.6em;
  text-shadow: 1px 1px 0 #fff, 2px 2px 0 #ffc0d8;
  transition: transform 0.15s;
}

/* リザルト画面 */
#result-screen h2 {
  font-size: clamp(1.5rem, 5vw, 2.2rem);
  color: #ff4e90;
  font-weight: 900;
  margin-bottom: 0.3em;
  text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffc0d8;
}
.result-score {
  font-size: clamp(3rem, 11vw, 5rem);
  font-weight: 900;
  color: #ff4e90;
  text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffc0d8, 6px 6px 18px rgba(255, 100, 160, 0.4);
  line-height: 1;
}
.result-label { color: #a06080; margin-bottom: 0.5em; font-weight: 700; }
.result-stats {
  display: flex;
  gap: 16px;
  margin: 1em 0 1.2em;
  font-size: 0.9rem;
  color: #7a2a52;
  font-weight: 700;
}
.result-stats div {
  text-align: center;
  background: rgba(255, 255, 255, 0.85);
  border: 2px solid #ffb6d1;
  border-radius: 16px;
  padding: 8px 14px;
  box-shadow: 0 3px 0 #ffb6d1;
}
.result-stats .num {
  display: block;
  font-size: 1.6rem;
  font-weight: 900;
  color: #ff4e90;
}
#result-screen button {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  padding: 0.7em 2em;
  border: none;
  background: linear-gradient(180deg, #ff7cb0 0%, #ff4e90 100%);
  color: #fff;
  border-radius: 999px;
  cursor: pointer;
  margin: 0.3em;
  box-shadow: 0 4px 0 #c92d6a, 0 6px 14px rgba(255, 100, 160, 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 0.04em;
}
#result-screen button:hover { transform: translateY(-2px); }
#result-screen button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c92d6a, 0 3px 8px rgba(255, 100, 160, 0.3); }

.back-to-top-link {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #a06080;
  font-size: 0.8rem;
  text-decoration: none;
  z-index: 100;
  font-weight: 700;
}

/* 浮かぶハート・星エフェクト */
.float-pop {
  position: fixed;
  pointer-events: none;
  font-size: 1.4rem;
  z-index: 999;
  animation: float-pop 1s ease-out forwards;
  filter: drop-shadow(0 2px 4px rgba(255, 150, 200, 0.5));
}
@keyframes float-pop {
  0% { transform: translate(-50%, 0) scale(0.5) rotate(0deg); opacity: 0; }
  20% { opacity: 1; transform: translate(-50%, -10px) scale(1.2) rotate(-10deg); }
  100% { transform: translate(-50%, -80px) scale(0.9) rotate(20deg); opacity: 0; }
}

/* キラキラバースト */
.sparkle-burst {
  position: fixed;
  pointer-events: none;
  font-size: 1.6rem;
  z-index: 999;
  animation: sparkle-burst 0.9s ease-out forwards;
}
@keyframes sparkle-burst {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  30% { opacity: 1; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); }
  100% { transform: translate(calc(-50% + var(--dx) * 1.6), calc(-50% + var(--dy) * 1.6)) scale(0.6); opacity: 0; }
}

/* ワードカードをワンテンポ跳ねさせる */
.word-card.clear-burst { animation: card-burst 0.45s ease-out; }
@keyframes card-burst {
  0% { transform: scale(1); }
  40% { transform: scale(1.06) rotate(-1deg); box-shadow: 0 10px 0 #ff7cb0, 0 20px 40px rgba(255, 100, 160, 0.5); }
  100% { transform: scale(1); }
}

.word-card.wrong-shake { animation: card-shake 0.3s ease-in-out; }
@keyframes card-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
</style>
</head>

      { ja: '気が付いたらかわいい部屋にいた一般的には不法侵入だ', romaji: 'kigatsuitarakawaiiheyaniitaippantekinihafuhoushinnyuuda' },
      { ja: '本当の恐怖はここにある地雷を探して霊を成仏させろ', romaji: 'hontounokyoufuhakokoniarujiraiwosagashitereiwojoubutsusasero' },
      { ja: '永久に吾輩の番だ吾輩の番だ吾輩の番だ', romaji: 'eikyuuniwagahainobandawagahainobandawagahainobanda' },
      { ja: '田舎者のヨシノリが黄金の金色ドライバーに挑む', romaji: 'inakamononoyoshinorigaougonnokinnirodoraiba-niidomu' },
      { ja: '夢の中のヤクザかにかにを叩いて腹筋を換気しろ', romaji: 'yumenonakanoyakuzakanikaniwotataitefukkinwokankishiro' },
    ],
  ];

  // ===== ローマ字トークナイザ =====
  // 既存のヘボン式ローマ字文字列を「ユニット列」に変換する。
  // 各ユニットは入力可能な綴りの配列（例: shi → ['shi','si']）。
  // これで shi/si, chi/ti, tsu/tu, fu/hu, ja/zya, など複数の打ち方に対応できる。
  const DIGRAPH3 = {
    shi: ['shi','si'], chi: ['chi','ti'], tsu: ['tsu','tu'],
    sha: ['sha','sya'], shu: ['shu','syu'], sho: ['sho','syo'],
    cha: ['cha','tya','cya'], chu: ['chu','tyu','cyu'], cho: ['cho','tyo','cyo'],
    kya: ['kya'], kyu: ['kyu'], kyo: ['kyo'],
    gya: ['gya'], gyu: ['gyu'], gyo: ['gyo'],
    nya: ['nya'], nyu: ['nyu'], nyo: ['nyo'],
    hya: ['hya'], hyu: ['hyu'], hyo: ['hyo'],
    bya: ['bya'], byu: ['byu'], byo: ['byo'],
    pya: ['pya'], pyu: ['pyu'], pyo: ['pyo'],
    mya: ['mya'], myu: ['myu'], myo: ['myo'],
    rya: ['rya'], ryu: ['ryu'], ryo: ['ryo'],
  };
  const DIGRAPH2 = {
    ja: ['ja','zya','jya'], ji: ['ji','zi'], ju: ['ju','zyu','jyu'], jo: ['jo','zyo','jyo'],
    fu: ['fu','hu'],
  };
  const VOWELS = 'aiueo';
  const CONSONANTS = 'kstnhmyrwgzdbpcfjv';

  function tokenize(romaji) {
    const s = romaji.toLowerCase();
    const units = [];
    let i = 0;
    while (i < s.length) {
      const c1 = s[i];
      const c2 = s[i+1] || '';
      const c3 = s[i+2] || '';
      const three = c1 + c2 + c3;
      const two = c1 + c2;

      // 3文字デジラフ
      if (DIGRAPH3[three]) { units.push(DIGRAPH3[three].slice()); i += 3; continue; }
      // nn（ん） → n または nn で入力可
      if (c1 === 'n' && c2 === 'n') { units.push(['n','nn']); i += 2; continue; }
      // 2文字デジラフ
      if (DIGRAPH2[two]) { units.push(DIGRAPH2[two].slice()); i += 2; continue; }
      // 小さい「っ」: 子音が2つ連続 → 最初の子音だけを独立ユニットとして分離
      if (c1 === c2 && CONSONANTS.includes(c1) && c1 !== 'n') {
        units.push([c1]);
        i += 1;
        continue;
      }
      // ん: 子音の前 or 語末
      if (c1 === 'n' && (c2 === '' || (CONSONANTS.includes(c2) && c2 !== 'y'))) {
        units.push(['n','nn']);
        i += 1;
        continue;
      }
      // 子音＋母音（標準2文字）
      if (CONSONANTS.includes(c1) && VOWELS.includes(c2)) {
        units.push([two]);
        i += 2;
        continue;
      }
      // 単独母音・長音記号・その他1文字
      units.push([c1]);
      i += 1;
    }
    return units;
  }

  // 任意のユニット配列に対する「代表形（主な綴り）」を連結した文字列を返す
  function primaryFull(units) {
    return units.map(u => u[0]).join('');
  }

  const GAME_TIME = 60;
  let score, combo, maxCombo, wordsCleared, timeLeft, timerInterval, currentWord;
  let currentUnits, currentUnitIdx, currentUnitTyped, committedText;
  let gameRunning = false;
  let recentJa = [];

  const titleScreen = document.getElementById('title-screen');
  const gameScreen = document.getElementById('game-screen');
  const resultScreen = document.getElementById('result-screen');
  const wordCard = document.getElementById('word-card');
  const wordJapanese = document.getElementById('word-japanese');
  const wordRomaji = document.getElementById('word-romaji');
  const inputArea = document.getElementById('input-area');
  const comboDisplay = document.getElementById('combo-display');
  const timerBar = document.getElementById('timer-bar');
  const kaniGame = document.getElementById('kanikani-game');

  function pickTier() {
    if (wordsCleared < 3) return 0;
    if (wordsCleared < 6) return 1;
    if (wordsCleared < 10) return 2;
    if (wordsCleared < 15) return 3;
    return 4;
  }

  function pickWord() {
    const pool = WORD_POOLS[pickTier()];
    let pick;
    for (let i = 0; i < 6; i++) {
      pick = pool[Math.floor(Math.random() * pool.length)];
      if (!recentJa.includes(pick.ja)) break;
    }
    recentJa.push(pick.ja);
    if (recentJa.length > 4) recentJa.shift();
    return pick;
  }

  function nextWord() {
    currentWord = pickWord();
    currentUnits = tokenize(currentWord.romaji);
    currentUnitIdx = 0;
    currentUnitTyped = '';
    committedText = '';
    wordJapanese.textContent = currentWord.ja;
    renderWord();
    inputArea.value = '';
  }

  function renderWord() {
    // 表示文字列:
    //   - committedText: 既に確定した綴り
    //   - currentUnitTyped: 現在ユニットの入力途中
    //   - 残りユニット: 代表形の連結
    const remaining = currentUnits.slice(currentUnitIdx + (currentUnitTyped === '' ? 0 : 1));
    // currentUnitTyped を含む場合、currentUnitIdx のユニットは「今打ってる途中」なので rest から除外
    let html = '';
    if (committedText) html += '<span class="correct">' + escapeHtml(committedText) + '</span>';
    if (currentUnitIdx < currentUnits.length) {
      const currentUnit = currentUnits[currentUnitIdx];
      // 現在ユニットのうち、既に打った部分を緑、残りを代表形から取って remaining 色で
      const candidate = currentUnit.find(alt => alt.startsWith(currentUnitTyped)) || currentUnit[0];
      if (currentUnitTyped) {
        html += '<span class="correct">' + escapeHtml(currentUnitTyped) + '</span>';
      }
      const rest = candidate.slice(currentUnitTyped.length);
      if (rest) {
        html += '<span class="current">' + escapeHtml(rest[0]) + '</span>';
        if (rest.length > 1) html += '<span class="remaining">' + escapeHtml(rest.slice(1)) + '</span>';
      }
      // さらに先のユニット
      const laterUnits = currentUnits.slice(currentUnitIdx + 1);
      if (laterUnits.length) {
        html += '<span class="remaining">' + escapeHtml(primaryFull(laterUnits)) + '</span>';
      }
    }
    wordRomaji.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function updateHUD() {
    const prefix = typeof SurrealI18n !== 'undefined' ? (SurrealI18n.t('scorePrefix') || 'スコア') : 'スコア';
    const timePrefix = typeof SurrealI18n !== 'undefined' ? (SurrealI18n.t('timePrefix') || '残り') : '残り';
    document.getElementById('hud-score').textContent = prefix + ': ' + score;
    document.getElementById('hud-time').textContent = timePrefix + ': ' + timeLeft + 's';
    timerBar.style.width = (timeLeft / GAME_TIME * 100) + '%';
    if (combo >= 2) {
      comboDisplay.textContent = '🔥 ' + combo + ' コンボ!';
      comboDisplay.style.transform = 'scale(1.15)';
      setTimeout(() => comboDisplay.style.transform = 'scale(1)', 100);
    } else {
      comboDisplay.textContent = '';
    }
  }

  // ===== エフェクト =====
  function spawnFloatPop(emoji) {
    const el = document.createElement('div');
    el.className = 'float-pop';
    el.textContent = emoji;
    const rect = wordCard.getBoundingClientRect();
    const x = rect.left + rect.width / 2 + (Math.random() - 0.5) * rect.width * 0.6;
    const y = rect.top + rect.height / 2;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function spawnSparkleBurst() {
    const rect = wordCard.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const emojis = ['✨', '♡', '★', '✿', '💖', '⭐'];
    for (let i = 0; i < 10; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle-burst';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
      const dist = 60 + Math.random() * 40;
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }

  // ===== SE =====
  function playSE(type) {
    if (typeof SurrealGames === 'undefined' || !SurrealGames.SoundSystem) return;
    SurrealGames.SoundSystem.play(type);
  }

  function startGame() {
    score = 0; combo = 0; maxCombo = 0; wordsCleared = 0;
    timeLeft = GAME_TIME;
    gameRunning = true;
    recentJa = [];
    titleScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    gameScreen.classList.add('active');
    nextWord();
    updateHUD();
    inputArea.value = '';
    inputArea.focus();
    // BGM開始（かにかにパニックと同じ pop プリセット）
    if (typeof SurrealGames !== 'undefined' && SurrealGames.SoundSystem) {
      SurrealGames.SoundSystem.play('start');
      SurrealGames.SoundSystem.playBgm('pop');
    }
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    gameScreen.classList.remove('active');
    resultScreen.classList.add('active');
    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-words').textContent = wordsCleared;
    document.getElementById('stat-combo').textContent = maxCombo;
    // BGM停止 & リザルトSE
    if (typeof SurrealGames !== 'undefined' && SurrealGames.SoundSystem) {
      SurrealGames.SoundSystem.stopBgm();
      SurrealGames.SoundSystem.play('result');
    }
    // ハイスコア記録
    if (typeof SurrealGames !== 'undefined' && SurrealGames.HighScore) {
      SurrealGames.HighScore.set('typing-game', score, { maxCombo: maxCombo });
    }
  }

  // ===== 入力処理 =====
  // 現在のユニットを「committedText に追加して次へ」と処理
  function advanceUnit(committed) {
    committedText += committed;
    currentUnitIdx++;
    currentUnitTyped = '';
  }

  inputArea.addEventListener('input', () => {
    if (!gameRunning) return;
    const raw = inputArea.value.toLowerCase();
    // 新しく追加された文字数を計算
    const expectedSoFar = committedText + currentUnitTyped;
    if (!raw.startsWith(expectedSoFar)) {
      // バックスペース等：state を巻き戻して入力欄を正規化
      inputArea.value = expectedSoFar;
      return;
    }
    const addedChars = raw.slice(expectedSoFar.length);
    let anyCorrect = false;
    let anyWrong = false;

    for (const ch of addedChars) {
      if (currentUnitIdx >= currentUnits.length) break;
      const tryTyped = currentUnitTyped + ch;
      const unit = currentUnits[currentUnitIdx];
      // 完全一致するか？
      const exact = unit.find(alt => alt === tryTyped);
      // プレフィックスとして有効か？
      const hasPrefix = unit.some(alt => alt.startsWith(tryTyped));
      if (exact) {
        advanceUnit(tryTyped);
        anyCorrect = true;
      } else if (hasPrefix) {
        currentUnitTyped = tryTyped;
        anyCorrect = true;
      } else {
        anyWrong = true;
        break;
      }
    }

    if (anyWrong) {
      combo = 0;
      inputArea.value = committedText + currentUnitTyped;
      playSE('wrong');
      wordCard.classList.remove('wrong-shake');
      void wordCard.offsetWidth;
      wordCard.classList.add('wrong-shake');
      updateHUD();
      return;
    }

    if (anyCorrect) {
      playSE('tap');
      inputArea.value = committedText + currentUnitTyped;
      renderWord();
      // ランダムにハート/星を浮かせる（派手すぎない程度に）
      if (Math.random() < 0.5) spawnFloatPop(['♡', '✿', '✨', '★'][Math.floor(Math.random() * 4)]);
    }

    // 単語クリア？
    if (currentUnitIdx >= currentUnits.length) {
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const romajiLen = primaryFull(currentUnits).length;
      const comboBonus = Math.floor(combo / 3) * 5;
      const lengthBonus = Math.floor(romajiLen / 2);
      score += 5 + lengthBonus + comboBonus;
      wordsCleared++;
      playSE(combo >= 3 ? 'combo' : 'correct');
      spawnSparkleBurst();
      wordCard.classList.remove('clear-burst');
      void wordCard.offsetWidth;
      wordCard.classList.add('clear-burst');
      kaniGame.classList.remove('cheer');
      void kaniGame.offsetWidth;
      kaniGame.classList.add('cheer');
      updateHUD();
      nextWord();
    }
  });

  // 物理キーボードからのフォールバック（input イベントが拾えない場合に備えて focus 維持）
  gameScreen.addEventListener('click', () => { if (gameRunning) inputArea.focus(); });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);
})();
</script>
<script src="../common/i18n.js"></script>
<script src="../common/game-common.js"></script>
<script>
SurrealI18n.init({
  ja: { subtitle:'かにかにと一緒にタイピング！', startBtn:'スタート', resultTitle:'タイムアップ！', resultLabel:'ポイント', wordsCleared:'クリア語数', maxCombo:'最大コンボ', retryBtn:'もう一度', scorePrefix:'スコア', timePrefix:'残り', backToTop:'← トップに戻る' },
  en: { subtitle:'Type along with Kani-Kani!', startBtn:'START', resultTitle:'Time\'s Up!', resultLabel:'Points', wordsCleared:'Words', maxCombo:'Max Combo', retryBtn:'Retry', scorePrefix:'Score', timePrefix:'Time', backToTop:'← Back to Top' }
});
SurrealGames.init('typing-game');
</script>
