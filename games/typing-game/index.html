<script>
(function(){
  'use strict';

  const WORD_POOLS = [
    [
      { ja: 'かに', romaji: 'kani' },
      { ja: 'かにかに', romaji: 'kanikani' },
      { ja: 'さくらんぼ', romaji: 'sakuranbo' },
      { ja: 'よしのり', romaji: 'yoshinori' },
      { ja: 'はかせ', romaji: 'hakase' },
      { ja: 'おじさん', romaji: 'ojisan' },
      { ja: 'ぺっと', romaji: 'petto' },
      { ja: 'そふと', romaji: 'sofuto' }
    ],
    [
      { ja: 'しゅーるげーむ', romaji: 'shuurugeemu' },
      { ja: 'かわいいへや', romaji: 'kawaiiheya' },
      { ja: 'りばーし', romaji: 'ribaashi' },
      { ja: 'ぱずる', romaji: 'pazuru' },
      { ja: 'ねこかふぇ', romaji: 'nekokafe' },
      { ja: 'おぼえてますか', romaji: 'oboetemasuka' },
      { ja: 'だっしゅげーむ', romaji: 'dasshugeemu' },
      { ja: 'ほろめもりー', romaji: 'horomemorii' }
    ],
    [
      { ja: 'かにみそぱにっく', romaji: 'kanimisopanikku' },
      { ja: 'しゅーるしゅーてぃんぐ', romaji: 'shuurushuutingu' },
      { ja: 'しゅーるしんかろん', romaji: 'shuurushinkaron' },
      { ja: 'えりーといんぐりっしゅ', romaji: 'eriitoingurisshu' },
      { ja: 'びじんめーかー', romaji: 'bijinmeekaa' },
      { ja: 'すいすいぱずる', romaji: 'suisuipazuru' },
      { ja: 'しゅーるのとう', romaji: 'shuurunotou' },
      { ja: 'こずみっくちぇいん', romaji: 'kozumikkuchiein' }
    ],
    [
      { ja: 'やんでれがくえん', romaji: 'yanderegakuen' },
      { ja: 'けいえいぶんせきげーむ', romaji: 'keieibunsekigeemu' },
      { ja: 'かおすはいしんしみゅれーたー', romaji: 'kaosuhaishinshimyureetaa' },
      { ja: 'きょうりょくしゃ', romaji: 'kyouryokusha' },
      { ja: 'しゅーるぺっとそだいにっき', romaji: 'shuurupettosodainikki' },
      { ja: 'ほろめんけいえいぶんせき', romaji: 'horomenkeieibunseki' },
      { ja: 'しゅーるだっしゅ', romaji: 'shuurudasshu' },
      { ja: 'はしもとさんどっち', romaji: 'hashimotosandocchi' }
    ],
    [
      { ja: 'ちーぎゅうてんせいあーるぴーじー', romaji: 'chiigyuutenseiaarupiijii' },
      { ja: 'ぶきようなおじさんばとる', romaji: 'bukiyouonaojisanbatoru' },
      { ja: 'あいるらんどをみつけだせ', romaji: 'airurandowomitsukedase' },
      { ja: 'かわいいへやからのだっしゅつ', romaji: 'kawaiiheyakaranodasshutsu' },
      { ja: 'しゅーるげーむず', romaji: 'shuurugeemuzu' },
      { ja: 'きらきらすいーつきっちん', romaji: 'kirakirasuiitsukicchin' }
    ]
  ];

  const GAME_TIME = 60;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let wordsCleared = 0;
  let timeLeft = GAME_TIME;
  let timerInterval = null;
  let currentWord = null;
  let typedIndex = 0;
  let gameRunning = false;
  let recentWords = [];
  let sg = null;

  const titleScreen = document.getElementById('title-screen');
  const gameScreen = document.getElementById('game-screen');
  const resultScreen = document.getElementById('result-screen');
  const wordJapanese = document.getElementById('word-japanese');
  const wordRomaji = document.getElementById('word-romaji');
  const inputArea = document.getElementById('input-area');
  const comboDisplay = document.getElementById('combo-display');
  const timerBar = document.getElementById('timer-bar');
  const gameKani = document.getElementById('game-kani');
  const hudScore = document.getElementById('hud-score');
  const hudTime = document.getElementById('hud-time');

  (function initHearts() {
    const container = document.getElementById('bg-hearts');
    const emojis = ['♡', '♥', '✦', '🦀', '☆'];
    for (let i = 0; i < 14; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = (Math.random() * 100) + '%';
      heart.style.animationDuration = (8 + Math.random() * 8) + 's';
      heart.style.animationDelay = (-Math.random() * 12) + 's';
      heart.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
      container.appendChild(heart);
    }
  })();

  function pickTier() {
    if (wordsCleared < 4) return 0;
    if (wordsCleared < 8) return 1;
    if (wordsCleared < 12) return 2;
    if (wordsCleared < 16) return 3;
    return 4;
  }

  function pickWord() {
    const pool = WORD_POOLS[pickTier()];
    let choice = pool[0];
    for (let i = 0; i < 6; i++) {
      choice = pool[Math.floor(Math.random() * pool.length)];
      if (!recentWords.includes(choice.ja)) break;
    }
    recentWords.push(choice.ja);
    if (recentWords.length > 4) recentWords.shift();
    return choice;
  }

  function renderWord() {
    const romaji = currentWord.romaji;
    const correct = romaji.slice(0, typedIndex);
    const current = romaji.charAt(typedIndex);
    const remaining = romaji.slice(typedIndex + 1);

    let html = '';
    if (correct) html += '<span class="correct">' + escapeHtml(correct) + '</span>';
    if (current) html += '<span class="current">' + escapeHtml(current) + '</span>';
    if (remaining) html += '<span class="remaining">' + escapeHtml(remaining) + '</span>';
    wordRomaji.innerHTML = html;
  }

  function nextWord() {
    currentWord = pickWord();
    typedIndex = 0;
    wordJapanese.textContent = currentWord.ja;
    renderWord();
    inputArea.value = '';
  }

  function escapeHtml(text) {
    return text.replace(/[&<>]/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch];
    });
  }

  function updateHUD() {
    const scorePrefix = SurrealI18n.t('scorePrefix') || 'スコア';
    const timePrefix = SurrealI18n.t('timePrefix') || '時間';
    hudScore.textContent = scorePrefix + ': ' + score;
    hudTime.textContent = timePrefix + ': ' + timeLeft + 's';
    timerBar.style.width = ((timeLeft / GAME_TIME) * 100) + '%';

    if (combo >= 2) {
      comboDisplay.textContent = '🦀 ' + combo + ' COMBO!';
      comboDisplay.style.transform = 'scale(1.12)';
      setTimeout(function(){ comboDisplay.style.transform = 'scale(1)'; }, 90);
    } else {
      comboDisplay.textContent = '';
    }
  }

  function spawnParticles(x, y, emojis, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fx-particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const dist = 56 + Math.random() * 36;
      el.style.setProperty('--fx-dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--fx-dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 900);
    }
  }

  function spawnTypedFx(ch) {
    const rect = wordRomaji.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'fx-typed';
    el.textContent = ch;
    el.style.left = (rect.left + rect.width / 2) + 'px';
    el.style.top = (rect.top + rect.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 500);
  }

  function keyHitEffect() {
    gameKani.classList.remove('bounce');
    void gameKani.offsetWidth;
    gameKani.classList.add('bounce');
  }

  function wordClearEffect() {
    const rect = wordRomaji.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['♡', '✦', '🦀', '☆'], 8);
    gameKani.classList.remove('happy');
    void gameKani.offsetWidth;
    gameKani.classList.add('happy');
  }

  function missEffect() {
    document.body.classList.remove('screen-shake');
    void document.body.offsetWidth;
    document.body.classList.add('screen-shake');
  }

  function processKey(ch) {
    if (!gameRunning || !currentWord) return;
    const nextChar = currentWord.romaji.charAt(typedIndex);
    if (!nextChar) return;

    if (ch !== nextChar) {
      combo = 0;
      if (sg) sg.sound.play('wrong');
      missEffect();
      updateHUD();
      return;
    }

    typedIndex += 1;
    if (sg) sg.sound.play('tap');
    spawnTypedFx(ch);
    keyHitEffect();
    renderWord();

    if (typedIndex >= currentWord.romaji.length) {
      combo += 1;
      wordsCleared += 1;
      if (combo > maxCombo) maxCombo = combo;
      score += 10 + Math.floor(currentWord.romaji.length / 2) + Math.floor(combo / 3) * 5;
      if (sg) sg.sound.play(combo >= 3 ? 'combo' : 'correct');
      wordClearEffect();
      updateHUD();
      nextWord();
      return;
    }

    updateHUD();
  }

  inputArea.addEventListener('input', function() {
    if (!gameRunning) {
      inputArea.value = '';
      return;
    }
    const value = inputArea.value.toLowerCase();
    inputArea.value = '';
    for (const ch of value) {
      if (/^[a-z]$/.test(ch)) processKey(ch);
    }
  });

  function startGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    wordsCleared = 0;
    timeLeft = GAME_TIME;
    gameRunning = true;
    recentWords = [];

    titleScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    gameScreen.classList.add('active');

    nextWord();
    updateHUD();
    inputArea.value = '';
    setTimeout(function(){ inputArea.focus(); }, 60);

    clearInterval(timerInterval);
    timerInterval = setInterval(function() {
      timeLeft -= 1;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);

    if (sg) sg.onGameStart();
  }

  function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    gameScreen.classList.remove('active');
    resultScreen.classList.add('active');
    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-words').textContent = wordsCleared;
    document.getElementById('stat-combo').textContent = maxCombo;
    if (sg) sg.onGameEnd(score, { maxCombo: maxCombo });
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);
  document.getElementById('share-btn').addEventListener('click', function() {
    const url = window.location.href;
    const text = 'かにかにタイピング\nスコア: ' + score + 'ポイント\nクリア語数: ' + wordsCleared + '語\n#シュールゲームス\n' + url;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  });

  window.addEventListener('keydown', function(e) {
    if (!gameRunning) return;
    if (e.key === 'Tab') {
      e.preventDefault();
      inputArea.focus();
    }
  });

  window.__setSg = function(instance) {
    sg = instance;
  };
})();
</script>
