* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a12;
  color: #c8c8d8;
  font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;

/* 背景の不気味なフォグ */

  content: '';

  background:

}
@keyframes fogDrift {

  100% { opacity: 1; transform: scale(1.05); }
}

.back-link {

}

  gap: 6px;
  margin-bottom: 3px;
  position: relative;
  z-index: 1;
}
.difficulty-bar button {
  background: #1a1a2a;
  border: 1px solid #333;
  color: #888;
  padding: 2px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.2s;
}
.difficulty-bar button:hover {
  background: #2a2a3a;
  color: #aaa;
}
.difficulty-bar button.active {
  background: #2a1a3a;
  border-color: #6644aa;
  color: #c8a0e8;
  box-shadow: 0 0 10px rgba(100, 50, 180, 0.3);
}

/* ハイスコア表示 */
.highscore-bar {
  font-family: 'Orbitron', 'Noto Serif JP', monospace;
  font-size: clamp(10px, 2.6vw, 12px);
  color: #8866bb;
  margin-bottom: 3px;

  z-index: 1;
  letter-spacing: 1px;
}

  margin-right: 4px;
}

}
@keyframes scoreFlash {

}

  background: #0d0d18;
  border: 2px solid #2a2a3a;
  border-radius: 6px;
  padding: 4px 10px;
  margin-bottom: 4px;
  position: relative;
  z-index: 1;
}
.status-left {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-self: start;
}
.status-right {
  justify-self: end;
}
.lcd {
  font-family: 'Orbitron', monospace;
  font-size: clamp(18px, 5vw, 28px);
  color: #cc4444;
  background: #1a0808;
  padding: 4px 10px;
  border-radius: 4px;

.face-btn {

  </div>

<!-- 怪談音声（録音ファイルをaudio/kaidan.mp3に置く） -->

  <source src="audio/kaidan.mp3" type="audio/mpeg">
  <source src="audio/kaidan.ogg" type="audio/ogg">
</audio>

  <button class="audio-btn" id="bgmBtn" onclick="toggleBGM()" title="BGM ON/OFF">
    <span class="icon">🔇</span>BGM
  </button>

    <span class="icon">👻</span>怪談
  </button>

<script>
// ===== 怖いBGM（Web Audio API）+ 怪談音声 =====
let audioCtx = null;
let bgmPlaying = false;
let bgmMaster = null;
let bgmStarted = false;

function startBGM() {
  if (bgmStarted) {
    // 既にある場合はresume
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    bgmMaster.gain.value = 0.5;
    bgmPlaying = true;
    updateBGMBtn();
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // マスターゲイン（音量上げた）
  bgmMaster = audioCtx.createGain();
  bgmMaster.gain.value = 0.5;
  bgmMaster.connect(audioCtx.destination);

  // 低いドローン音（不穏な持続音）
  const drone = audioCtx.createOscillator();
  drone.type = 'sawtooth';
  drone.frequency.value = 55;
  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.15;
  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 200;
  drone.connect(droneFilter);
  droneFilter.connect(droneGain);
  droneGain.connect(bgmMaster);

  // ゆっくり揺らぐLFO（不安感）
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.15;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 10;
  lfo.connect(lfoGain);
  lfoGain.connect(drone.frequency);

  // 高いキーン音（耳鳴り的な恐怖感）
  const highTone = audioCtx.createOscillator();
  highTone.type = 'sine';
  highTone.frequency.value = 3800;
  const highGain = audioCtx.createGain();
  highGain.gain.value = 0.02;
  const highLfo = audioCtx.createOscillator();
  highLfo.type = 'sine';
  highLfo.frequency.value = 0.08;
  const highLfoGain = audioCtx.createGain();
  highLfoGain.gain.value = 0.015;
  highLfo.connect(highLfoGain);
  highLfoGain.connect(highGain.gain);
  highTone.connect(highGain);
  highGain.connect(bgmMaster);

  // 風の音（ホワイトノイズ + フィルタ）
  const bufferSize = audioCtx.sampleRate * 4;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }
  const wind = audioCtx.createBufferSource();
  wind.buffer = noiseBuffer;
  wind.loop = true;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 400;
  windFilter.Q.value = 0.5;
  const windGain = audioCtx.createGain();
  windGain.gain.value = 0.07;
  const windLfo = audioCtx.createOscillator();
  windLfo.type = 'sine';
  windLfo.frequency.value = 0.1;
  const windLfoGain = audioCtx.createGain();
  windLfoGain.gain.value = 200;
  windLfo.connect(windLfoGain);
  windLfoGain.connect(windFilter.frequency);
  wind.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(bgmMaster);

  // 不定期のきしみ音
  function playCreak() {
    if (!bgmPlaying || !audioCtx) return;
    try {
      const creakOsc = audioCtx.createOscillator();
      creakOsc.type = 'sine';
      const startFreq = 200 + Math.random() * 400;
      const now = audioCtx.currentTime;
      creakOsc.frequency.setValueAtTime(startFreq, now);
      creakOsc.frequency.exponentialRampToValueAtTime(startFreq * 0.7, now + 1.5);
      const creakGain = audioCtx.createGain();
      creakGain.gain.setValueAtTime(0, now);
      creakGain.gain.linearRampToValueAtTime(0.05, now + 0.3);
      creakGain.gain.linearRampToValueAtTime(0, now + 1.5);
      const creakFilter = audioCtx.createBiquadFilter();
      creakFilter.type = 'bandpass';
      creakFilter.frequency.value = startFreq;
      creakFilter.Q.value = 10;
      creakOsc.connect(creakFilter);
      creakFilter.connect(creakGain);
      creakGain.connect(bgmMaster);
      creakOsc.start();
      creakOsc.stop(now + 1.5);
    } catch(e) {}
    setTimeout(playCreak, 4000 + Math.random() * 8000);
  }
  setTimeout(playCreak, 2000);

  // 全部スタート
  drone.start();
  lfo.start();
  highTone.start();
  highLfo.start();
  wind.start();
  windLfo.start();

  bgmStarted = true;
  bgmPlaying = true;

  // suspended対策
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  updateBGMBtn();
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmMaster) {
    bgmMaster.gain.value = 0;
  }
  updateBGMBtn();
}

function toggleBGM() {
  if (!bgmPlaying) {
    startBGM();
  } else {
    stopBGM();
  }
}

function updateBGMBtn() {
  const btn = document.getElementById('bgmBtn');
  if (bgmPlaying) {
    btn.classList.add('playing');
    btn.innerHTML = '<span class="icon">🔊</span>BGM';
  } else {

    btn.innerHTML = '<span class="icon">🔇</span>BGM';

}

document.addEventListener('click', function autoStartAudio() {

// ===== ゲーム本体 =====
const DIFFICULTIES = [
  { name: 'easy', rows: 9, cols: 9, mines: 10 },
  { name: 'medium', rows: 16, cols: 16, mines: 40 },
  { name: 'hard', rows: 16, cols: 30, mines: 99 }
];

let currentDiff = 0;
let board = [];
let revealed = [];
let flagged = [];
let mineMap = [];
let gameState = 'idle';
let timerInterval = null;
let elapsedTime = 0;
let firstClick = true;
let rows, cols, mineCount;
let flagMode = false;
let longPressTimer = null;
let longPressTriggered = false;

// ===== ハイスコア =====
function getHighscore(diffName) {
  const v = localStorage.getItem('kaidanMS_hi_' + diffName);
  return v ? parseInt(v, 10) : null;
}
function setHighscore(diffName, time) {
  localStorage.setItem('kaidanMS_hi_' + diffName, String(time));
}
function updateHighscoreDisplay() {
  const diffName = DIFFICULTIES[currentDiff].name;
  const hi = getHighscore(diffName);
  const el = document.getElementById('highscoreVal');
  const bar = document.getElementById('highscoreBar');
  bar.classList.remove('new-record');
  el.textContent = hi !== null ? String(hi).padStart(3, '0') : '--';
}

function setDifficulty(idx) {
  currentDiff = idx;
  document.querySelectorAll('.difficulty-bar button').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
  initGame();
}

function initGame() {
  clearInterval(timerInterval);
  timerInterval = null;
  elapsedTime = 0;
  gameState = 'idle';
  firstClick = true;
  flagMode = false;
  document.getElementById('flagToggle').classList.remove('active');

  const diff = DIFFICULTIES[currentDiff];
  rows = diff.rows;
  cols = diff.cols;
  mineCount = diff.mines;

  board = Array.from({length: rows}, () => Array(cols).fill(0));
  revealed = Array.from({length: rows}, () => Array(cols).fill(false));
  flagged = Array.from({length: rows}, () => Array(cols).fill(false));
  mineMap = Array.from({length: rows}, () => Array(cols).fill(false));

  updateMineCounter();
  document.getElementById('timer').textContent = '000';
  document.getElementById('faceBtn').textContent = '👻';
  updateHighscoreDisplay();

  document.querySelectorAll('.victory-overlay, .gameover-overlay, .confetti, .jobutsu-ghost, .jobutsu-text').forEach(e => e.remove());

  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  const vh = window.innerHeight;
  const vw = window.innerWidth;
  // 実際のDOM要素の高さを計測して、ボードに使える高さを算出
  const h1H = document.querySelector('h1').offsetHeight;
  const diffH = document.querySelector('.difficulty-bar').offsetHeight;
  const hiH = document.querySelector('.highscore-bar').offsetHeight;
  const statusBarH = document.getElementById('statusBar').offsetHeight;
  const bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
  const audioControlsH = document.querySelector('.audio-controls')?.offsetHeight || 0;
  // h1のmargin-top(4px) + 各要素のmargin-bottom(3+3+4) + 下の余白(12px)
  const headerH = h1H + diffH + hiH + statusBarH + 4 + 3 + 3 + 4 + 12 + bodyPadTop;
  const footerReserve = audioControlsH + (vw >= 700 ? 28 : 18);
  const availH = vh - headerH - footerReserve;
  const wideLayout = vw >= 700;
  const availW = wideLayout ? Math.min(vw * 0.9, 560) : vw * 0.96;

  const cellFromH = Math.floor((availH - 12) / rows);
  const cellFromW = Math.floor((availW - 10) / cols);
  let cellSize = Math.min(cellFromH, cellFromW);
  cellSize = Math.max(cellSize, 12);
  cellSize = Math.min(cellSize, wideLayout ? 46 : 40);

  boardEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;

  const fontSize = Math.max(Math.floor(cellSize * 0.55), 10);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell closed';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = fontSize + 'px';
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener('mousedown', onMouseDown);
      cell.addEventListener('contextmenu', e => e.preventDefault());
      cell.addEventListener('touchstart', onTouchStart, {passive: false});
      cell.addEventListener('touchend', onTouchEnd, {passive: false});
      cell.addEventListener('touchmove', onTouchMove, {passive: false});

      boardEl.appendChild(cell);
    }
  }

  const totalW = cols * (cellSize + 1) + 6;
  document.getElementById('statusBar').style.width = Math.min(totalW, availW) + 'px';
}

function onMouseDown(e) {
  e.preventDefault();
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (e.button === 2 || (e.button === 0 && flagMode)) {
    toggleFlag(r, c);
  } else if (e.button === 0) {
    revealCell(r, c);
  }
}

function onTouchStart(e) {
  e.preventDefault();
  const cell = e.currentTarget;
  longPressTriggered = false;
  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    const r = +cell.dataset.r;
    const c = +cell.dataset.c;
    toggleFlag(r, c);
  }, 400);
}

function onTouchEnd(e) {
  e.preventDefault();
  clearTimeout(longPressTimer);
  if (!longPressTriggered) {
    const cell = e.currentTarget;
    const r = +cell.dataset.r;
    const c = +cell.dataset.c;
    if (flagMode) {
      toggleFlag(r, c);
    } else {
      revealCell(r, c);
    }
  }
}

function onTouchMove(e) {
  clearTimeout(longPressTimer);
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (mineMap[r][c]) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    mineMap[r][c] = true;
    placed++;
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (mineMap[r][c]) { board[r][c] = -1; continue; }
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && mineMap[nr][nc]) count++;
        }
      }
      board[r][c] = count;
    }
  }
}

function revealCell(r, c) {
  if (gameState === 'won' || gameState === 'lost') return;
  if (revealed[r][c] || flagged[r][c]) return;

  if (firstClick) {
    firstClick = false;
    gameState = 'playing';
    placeMines(r, c);
    startTimer();
  }

  if (mineMap[r][c]) {
    gameOver(r, c);
    return;
  }

  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    if (cr < 0 || cr >= rows || cc < 0 || cc >= cols) continue;
    if (revealed[cr][cc] || flagged[cr][cc]) continue;
    revealed[cr][cc] = true;
    updateCellDOM(cr, cc);
    if (board[cr][cc] === 0) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          stack.push([cr + dr, cc + dc]);
        }
      }
    }
  }

  document.getElementById('faceBtn').textContent = '👻';
  checkWin();
}

function toggleFlag(r, c) {
  if (gameState === 'won' || gameState === 'lost') return;
  if (revealed[r][c]) return;

  flagged[r][c] = !flagged[r][c];
  const cell = getCellDOM(r, c);
  cell.classList.toggle('flagged', flagged[r][c]);
  updateMineCounter();
}

function toggleFlagMode() {
  flagMode = !flagMode;
  const btn = document.getElementById('flagToggle');
  btn.classList.toggle('active', flagMode);
}

function updateMineCounter() {
  const flags = flagged.flat().filter(Boolean).length;
  const remaining = mineCount - flags;
  document.getElementById('mineCount').textContent = String(Math.max(remaining, 0)).padStart(3, '0');
}

function startTimer() {
  elapsedTime = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedTime++;
    if (elapsedTime > 999) elapsedTime = 999;
    document.getElementById('timer').textContent = String(elapsedTime).padStart(3, '0');
  }, 1000);
}

function getCellDOM(r, c) {
  return document.getElementById('board').children[r * cols + c];
}

function updateCellDOM(r, c) {
  const cell = getCellDOM(r, c);
  cell.className = 'cell opened';
  cell.style.fontSize = cell.style.fontSize;
  const val = board[r][c];
  if (val > 0) {
    cell.textContent = val;
    cell.classList.add('n' + val);
  } else {
    cell.textContent = '';
  }
}

function gameOver(hitR, hitC) {
  gameState = 'lost';
  clearInterval(timerInterval);
  document.getElementById('faceBtn').textContent = '💀';

  const hitCell = getCellDOM(hitR, hitC);
  hitCell.className = 'cell mine-hit';
  hitCell.innerHTML = '<div class="mine-dot"></div>';

  let delay = 20;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (r === hitR && c === hitC) continue;
      if (mineMap[r][c]) {
        setTimeout(() => {
          const cell = getCellDOM(r, c);
          cell.className = 'cell mine-reveal';
          cell.classList.remove('flagged');
          cell.innerHTML = '<div class="mine-dot"></div>';
        }, delay);
        delay += 8;
      }
    }
  }

  setTimeout(() => {
    const overlay = document.createElement('div');
    overlay.className = 'gameover-overlay';
    overlay.innerHTML = `
      <div class="gameover-text">${SurrealI18n.t('curseMsg')}</div>
      <div class="result-actions">
        <button class="overlay-btn" onclick="closeOverlay(this); initGame();">${SurrealI18n.t('playAgain')}</button>
        <button class="overlay-btn result-btn-share" onclick="shareToX()">𝕏 ${SurrealI18n.t('shareOnX')}</button>
        <a class="overlay-btn result-btn-home" href="../../index.html">${SurrealI18n.t('backToHome')}</a>
      </div>
      ${buildRecommendHTML()}
    `;
    document.body.appendChild(overlay);
  }, delay + 150);
}

function checkWin() {
  let openedCount = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (revealed[r][c]) openedCount++;
    }
  }
  if (openedCount === rows * cols - mineCount) {
    gameState = 'won';
    clearInterval(timerInterval);
    document.getElementById('faceBtn').textContent = '🙏';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (mineMap[r][c] && !flagged[r][c]) {
          flagged[r][c] = true;
          getCellDOM(r, c).classList.add('flagged');
        }
      }
    }
    updateMineCounter();

    // ハイスコア更新判定
    const diffName = DIFFICULTIES[currentDiff].name;
    const prevHi = getHighscore(diffName);
    const isNewRecord = prevHi === null || elapsedTime < prevHi;
    if (isNewRecord) {
      setHighscore(diffName, elapsedTime);
    }

    setTimeout(() => {
      playJobutsu(isNewRecord);
    }, 300);
  }
}

function playJobutsu(isNewRecord) {
  // 成仏キャラ（おばけ画像が上に昇っていく）
  const ghost = document.createElement('img');
  ghost.src = '../../assets/images/kaidan-ghost.png';
  ghost.alt = 'おばけ';
  ghost.className = 'jobutsu-ghost';
  document.body.appendChild(ghost);

  // 「成仏...」テキスト
  const text = document.createElement('div');
  text.className = 'jobutsu-text';
  text.textContent = SurrealI18n.t('jobutsuMsg');
  document.body.appendChild(text);

  spawnSpirits();

  // 成仏演出後にクリア画面を表示
  setTimeout(() => {
    ghost.remove();
    text.remove();
    showVictory(isNewRecord);
  }, 3500);
}

function showVictory(isNewRecord) {
  const recordHtml = isNewRecord
    ? `<div class="victory-record">${SurrealI18n.t('newRecordMsg')}</div>`
    : '';
  const overlay = document.createElement('div');
  overlay.className = 'victory-overlay';
  overlay.innerHTML = `
    <div class="victory-text">${SurrealI18n.t('victoryMsg')}</div>
    <div class="victory-time">${String(elapsedTime).padStart(3, '0')} ${SurrealI18n.t('secUnit')}</div>
    ${recordHtml}
    <div class="result-actions">
      <button class="overlay-btn" onclick="closeOverlay(this); initGame();">${SurrealI18n.t('playAgain')}</button>
      <button class="overlay-btn result-btn-share" onclick="shareToX()">𝕏 ${SurrealI18n.t('shareOnX')}</button>
      <a class="overlay-btn result-btn-home" href="../../index.html">${SurrealI18n.t('backToHome')}</a>
    </div>
    ${buildRecommendHTML()}
  `;
  document.body.appendChild(overlay);

  updateHighscoreDisplay();
  if (isNewRecord) {
    document.getElementById('highscoreBar').classList.add('new-record');
  }
}

// 紙吹雪→霊魂パーティクル
function spawnSpirits() {
  const colors = ['#9966ff','#7744cc','#6633aa','#aa88ee','#5522aa','#bb99ff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.bottom = '-10px';
    c.style.color = colors[Math.floor(Math.random() * colors.length)];
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (3 + Math.random() * 5) + 'px';
    c.style.height = (3 + Math.random() * 5) + 'px';
    c.style.animationDuration = (3 + Math.random() * 4) + 's';
    c.style.animationDelay = (Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 8000);
  }
}

// ===== リザルト画面ヘルパー =====
function closeOverlay(btn) {
  const overlay = btn.closest('.victory-overlay, .gameover-overlay');
  if (overlay) overlay.remove();
  document.querySelectorAll('.confetti,.jobutsu-ghost,.jobutsu-text').forEach(e => e.remove());
}

function shareToX() {
  const diffNames = { ja: ['初級','中級','上級'], en: ['Easy','Medium','Hard'] };
  const lang = SurrealI18n ? SurrealI18n.currentLang : 'ja';
  const diffLabel = (diffNames[lang] || diffNames.ja)[currentDiff];
  let text;
  if (gameState === 'won') {
    text = SurrealI18n.t('shareResult', diffLabel, elapsedTime);
  } else {
    text = lang === 'en'
      ? '【Kaidan Minesweeper】I got cursed... 💀\n#SurrealGames'
      : '【かいだんマインスイーパー】呪われてしまった...💀\n#シュールゲームス';
  }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(window.location.href), '_blank');
}

function buildRecommendHTML() {
  // GAME_CATALOGはgame-common.jsからの読み込み前なので、直接定義
  const picks = [
    { id: 'whack-kanikani', emoji: '🦀', title: 'かにかにパニック！', titleEn: 'Kanikani Panic!' },
    { id: 'unko-cone', emoji: '🦄', title: 'うんコーンキャッチャー', titleEn: 'Unko Cone Catcher' },
    { id: 'escape-room', emoji: '🔑', title: 'かわいい部屋からの脱出', titleEn: 'Escape Room' },
  ];
  const isEn = SurrealI18n && SurrealI18n.currentLang === 'en';
  const title = isEn ? '🎮 Play Other Games' : '🎮 他のゲームも遊ぶ';
  const cards = picks.map(g => `
    <a href="../${g.id}/index.html" class="result-recommend-card">
      <span class="result-recommend-emoji">${g.emoji}</span>
      <span class="result-recommend-name">${isEn ? g.titleEn : g.title}</span>
    </a>
  `).join('');
  return `
    <div class="result-recommend">
      <div class="result-recommend-title">${title}</div>
      <div class="result-recommend-cards">${cards}</div>
    </div>
  `;
}

window.addEventListener('resize', () => {
  if (gameState === 'idle') renderBoard();
});

initGame();

    shareOnX: 'Share',
    secUnit: 'sec',
    shareResult: (diff, time) => `【Kaidan Minesweeper】Cleared ${diff} in ${time}s! The spirit rests in peace...👻\n#SurrealGames`,
  }
}, {
  onLangChange: function() { applyI18n(); }
});

function applyI18n() {
  document.querySelector('h1').textContent = SurrealI18n.t('title');
  document.getElementById('diff-easy').textContent = SurrealI18n.t('easy');
  document.getElementById('diff-medium').textContent = SurrealI18n.t('medium');
  document.getElementById('diff-hard').textContent = SurrealI18n.t('hard');
  document.querySelector('.back-link').textContent = SurrealI18n.t('backToTop');

  // ハイスコアバー
  const hiBar = document.getElementById('highscoreBar');
  const hiVal = document.getElementById('highscoreVal');
  const val = hiVal.textContent;
  hiBar.innerHTML = '<span class="crown">👑</span>' + SurrealI18n.t('highscoreLabel') + '：<span id="highscoreVal">' + val + '</span> ' + SurrealI18n.t('secUnit');

  // BGM/怪談ボタン
  const bgmBtn = document.getElementById('bgmBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  if (bgmPlaying) {
    bgmBtn.innerHTML = '<span class="icon">🔊</span>' + SurrealI18n.t('bgmLabel');
  } else {
    bgmBtn.innerHTML = '<span class="icon">🔇</span>' + SurrealI18n.t('bgmLabel');
  }
  if (voicePlaying) {
    voiceBtn.innerHTML = '<span class="icon">👻</span>' + SurrealI18n.t('kaidanOn');
  } else {
    voiceBtn.innerHTML = '<span class="icon">👻</span>' + SurrealI18n.t('kaidanLabel');
  }
}
applyI18n();

// Xシェアボタンのクリックイベントを上書き（得点付き）
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.sg-share-btn');
  if (!btn) return;
  e.preventDefault();
  const diffNames = { ja: ['初級','中級','上級'], en: ['Easy','Medium','Hard'] };
  const lang = SurrealI18n.currentLang;
  const diffLabel = (diffNames[lang] || diffNames.ja)[currentDiff];
  let text;
  if (gameState === 'won') {
    text = SurrealI18n.t('shareResult', diffLabel, elapsedTime);
  } else {
    text = lang === 'en'
      ? '【Kaidan Minesweeper】Playing now! 👻\n#SurrealGames'
      : '【かいだんマインスイーパー】プレイ中！👻\n#シュールゲームス';
  }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(window.location.href), '_blank');
});

SurrealGames.init('minesweeper');
</script>
</body>
</html>
