<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シュールビート | シュールゲームス</title>
  <meta name="description" content="落ちてくるシュールなノーツをリズムに合わせてタップ！5ステージ制リズムゲーム">
  <meta property="og:title" content="シュールビート | シュールゲームス">
  <meta property="og:description" content="落ちてくるシュールなノーツをリズムに合わせてタップ！5ステージ制リズムゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/surreal-beat/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/assets/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/surreal-games/games/surreal-beat/">
  <meta name="twitter:site" content="@tadanosyuhuda">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>

  <!-- タイトル画面 -->
  <div id="title-screen" class="screen active">
    <div class="title-content">
      <h1 class="game-title" data-i18n="gameTitle">シュールビート</h1>
      <p class="game-subtitle" data-i18n="gameSubtitle">9ゲームのBGMでリズムをタップ！</p>
      <div class="title-emojis">🚪🦀📊🚗💩👻🐣⚫🤖</div>
      <button id="start-btn" class="neon-btn" data-i18n="startBtn">スタート</button>
      <p class="key-hint" data-i18n="keyHint">PC: D F J K キー / スマホ: タップ</p>
    </div>
  </div>

  <!-- ステージ選択画面 -->
  <div id="stage-select-screen" class="screen">
    <div class="stage-select-content">
      <h2 class="stage-select-title" data-i18n="stageSelectTitle">ステージ選択</h2>
      <div id="stage-list" class="stage-list"></div>
      <button id="back-to-title-btn" class="neon-btn neon-btn-small" data-i18n="backToTitle">タイトルに戻る</button>
    </div>
    <!-- 初回ステージ選択時のイントロ画像 -->
    <div id="stage-select-intro" class="sb-overlay hidden" aria-hidden="true">
      <div class="sb-overlay-inner">
        <img src="assets/stage-select-intro.png" alt="好きな曲を選ぶドン" class="sb-overlay-img">
        <button id="stage-select-intro-close" class="neon-btn" data-i18n="introOk">好きな曲を選ぶ！</button>
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="hud-item">
        <span class="hud-label" data-i18n="score">スコア</span>
        <span id="score-display" class="hud-value">0</span>
      </div>
      <div class="hud-item hud-stage-name">
        <span id="stage-name-display" class="hud-stage-text"></span>
      </div>
      <div class="hud-item">
        <span class="hud-label" data-i18n="combo">コンボ</span>
        <span id="combo-display" class="hud-value">0</span>
      </div>
    </div>
    <div id="play-area">
      <div id="stage-bg-decor" aria-hidden="true"></div>
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
      <div class="lane" data-lane="3"></div>
      <div id="judge-line"></div>
      <div id="judge-effect"></div>
      <canvas id="particle-canvas"></canvas>
      <div id="stage-banner" aria-hidden="true"></div>
      <div id="countdown-overlay" aria-hidden="true"></div>
    </div>
    <div id="tap-zones">
      <button class="tap-btn" data-lane="0">D</button>
      <button class="tap-btn" data-lane="1">F</button>
      <button class="tap-btn" data-lane="2">J</button>
      <button class="tap-btn" data-lane="3">K</button>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <!-- ステージクリア画面 -->
  <div id="clear-screen" class="screen">
    <div class="clear-content">
      <h2 class="clear-title" data-i18n="stageClear">ステージクリア！</h2>
      <div id="clear-stage-name" class="clear-stage-name"></div>
      <div class="result-score">
        <span class="result-label" data-i18n="score">スコア</span>
        <span id="clear-score" class="result-value">0</span>
      </div>
      <div id="clear-rank" class="rank-display"></div>
      <div class="result-details">
        <div class="result-detail perfect">
          <span class="detail-label">Perfect</span>
          <span id="clear-perfect" class="detail-value">0</span>
        </div>
        <div class="result-detail great">
          <span class="detail-label">Great</span>
          <span id="clear-great" class="detail-value">0</span>
        </div>
        <div class="result-detail miss">
          <span class="detail-label">Miss</span>
          <span id="clear-miss" class="detail-value">0</span>
        </div>
        <div class="result-detail combo-max">
          <span class="detail-label" data-i18n="maxCombo">最大コンボ</span>
          <span id="clear-max-combo" class="detail-value">0</span>
        </div>
      </div>
      <div id="clear-fullcombo" class="fullcombo-banner hidden"></div>
      <div class="clear-buttons">
        <button id="next-stage-btn" class="neon-btn" data-i18n="nextStage">次のステージへ</button>
        <button id="retry-stage-btn" class="neon-btn neon-btn-small" data-i18n="retry">もう一回</button>
        <button id="back-to-select-btn" class="neon-btn neon-btn-small" data-i18n="backToSelect">ステージ選択</button>
      </div>
    </div>
    <!-- 全ステージクリア時のお祝いオーバーレイ -->
    <div id="all-clear-overlay" class="sb-overlay hidden" aria-hidden="true">
      <div class="sb-overlay-inner sb-overlay-celebrate">
        <h2 class="sb-clear-title" data-i18n="allClear">全ステージクリア！</h2>
        <img src="assets/all-clear-pianist.png" alt="天才！ピアニスト現る！！" class="sb-overlay-img">
        <button id="all-clear-close" class="neon-btn" data-i18n="allClearOk">ありがとう！</button>
      </div>
    </div>
  </div>

  <!-- リザルト画面（失敗時） -->
  <div id="result-screen" class="screen">
    <div class="result-content">
      <h2 class="result-title" data-i18n="resultFailed">ステージ失敗…</h2>
      <div id="result-stage-name" class="clear-stage-name"></div>
      <div class="result-score">
        <span class="result-label" data-i18n="score">スコア</span>
        <span id="final-score" class="result-value">0</span>
      </div>
      <div id="highscore-area"></div>
      <div class="result-details">
        <div class="result-detail perfect">
          <span class="detail-label">Perfect</span>
          <span id="perfect-count" class="detail-value">0</span>
        </div>
        <div class="result-detail great">
          <span class="detail-label">Great</span>
          <span id="great-count" class="detail-value">0</span>
        </div>
        <div class="result-detail miss">
          <span class="detail-label">Miss</span>
          <span id="miss-count" class="detail-value">0</span>
        </div>
        <div class="result-detail combo-max">
          <span class="detail-label" data-i18n="maxCombo">最大コンボ</span>
          <span id="max-combo" class="detail-value">0</span>
        </div>
      </div>
      <div id="result-rank" class="rank-display"></div>
      <p class="fail-hint" data-i18n="failHint">Missを全ノーツの20%以下に抑えよう！</p>
      <div class="clear-buttons">
        <button id="retry-btn" class="neon-btn" data-i18n="retry">もう一回</button>
        <button id="fail-back-btn" class="neon-btn neon-btn-small" data-i18n="backToSelect">ステージ選択</button>
      </div>
    </div>
  </div>

  <!-- Stage 6 専用: かいだんマインスイーパーの怪談音声（BGMと併走） -->
  <audio id="kaidan-voice" preload="auto" loop>
    <source src="../minesweeper/audio/kaidan.mp3" type="audio/mpeg">
  </audio>

  <script src="../common/i18n.js"></script>
  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
</body>
</html>
