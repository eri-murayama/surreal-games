<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>カオス配信シミュレーター | シュールゲームス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <meta property="og:title" content="カオス配信シミュレーター | シュールゲームス">
  <meta property="og:description" content="推しの配信者を育てて人気者にしよう！かにかに・さくらんぼちゃん・ソフトクリームから選んで応援！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/chaos-stream/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/assets/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/surreal-games/games/chaos-stream/">
  <meta name="twitter:site" content="@tadanosyuhuda">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>

  <div id="game-wrapper">

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active">
      <div class="scanline-overlay"></div>
      <div class="glitch-container">
        <h1 class="glitch-text" data-text="カオス配信シミュレーター">カオス配信シミュレーター</h1>
      </div>
      <p class="subtitle">推しを育てて人気者にしよう！</p>
      <p class="studio-name">シュールゲームス</p>
      <button id="start-btn" class="cyber-btn">配信スタート</button>
      <div id="sg-high-score-display" class="sg-high-score" style="display:none;"></div>
    </div>

    <!-- キャラ選択画面 -->
    <div id="select-screen" class="screen">
      <div class="scanline-overlay"></div>
      <h2 class="select-title">応援する配信者を選ぼう！</h2>
      <div class="char-select-grid">
        <button class="char-card" data-char="kanikani">
          <div class="char-img-wrap"><img src="kanikani.png" alt="かにかに"></div>
          <h3 class="char-name">かにかに</h3>
          <p class="char-desc">シルバニアファミリー開封配信</p>
          <span class="char-difficulty">難易度: ★★☆☆☆</span>
        </button>
        <button class="char-card" data-char="sakuranbo">
          <div class="char-img-wrap"><img src="sakuranbo.jpg" alt="さくらんぼちゃん"></div>
          <h3 class="char-name">さくらんぼちゃん</h3>
          <p class="char-desc">コスメ・美容系配信</p>
          <span class="char-difficulty">難易度: ★★★☆☆</span>
        </button>
        <button class="char-card" data-char="softcream">
          <div class="char-img-wrap"><img src="softcream.png" alt="ソフトクリーム"></div>
          <h3 class="char-name">ソフトクリーム</h3>
          <p class="char-desc">マルチ商法の配信</p>
          <span class="char-difficulty difficulty-hard">難易度: ★★★★★</span>
        </button>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
      <div class="stream-layout">
        <!-- 配信メイン画面 -->
        <div class="stream-main">
          <div class="stream-header">
            <span class="day-badge" id="day-badge">DAY 1</span>
            <span class="live-badge" id="live-badge">● LIVE</span>
            <span class="stream-title" id="stream-title">配信中…</span>
            <span class="viewer-count" id="viewer-count">👁 0人</span>
          </div>
          <div class="stream-content" id="stream-content">
            <div class="character-area" id="character-area">
              <img class="character-img" id="character-img" src="" alt="">
            </div>
            <div class="narration-area" id="narration-area">
              <p id="narration-text"></p>
            </div>
          </div>
          <div class="stats-bar">
            <div class="stat">
              <span class="stat-label">人気度</span>
              <div class="stat-gauge"><div class="stat-fill popularity-fill" id="popularity-bar"></div></div>
              <span class="stat-value" id="popularity-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">登録者</span>
              <div class="stat-gauge"><div class="stat-fill subscribers-fill" id="subscribers-bar"></div></div>
              <span class="stat-value" id="subscribers-value">0</span>
            </div>
          </div>
          <div class="choices-area" id="choices-area"></div>
        </div>
        <!-- チャット欄 -->
        <div class="chat-sidebar">
          <div class="chat-header">チャット</div>
          <div class="chat-messages" id="chat-messages"></div>
        </div>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen">
      <div class="scanline-overlay"></div>
      <h2 class="result-title">配信評価</h2>
      <div class="result-card" id="result-card">
        <div class="result-emoji" id="result-emoji"></div>
        <h3 class="result-rank" id="result-rank"></h3>
        <p class="result-description" id="result-description"></p>
        <div class="result-stats">
          <div class="result-stat">
            <span>人気度</span>
            <span id="final-popularity">0</span>
          </div>
          <div class="result-stat">
            <span>登録者数</span>
            <span id="final-subscribers">0</span>
          </div>
          <div class="result-stat">
            <span>最終視聴者数</span>
            <span id="final-viewers">0人</span>
          </div>
        </div>
      </div>
      <button id="retry-btn" class="cyber-btn">もう一回配信する</button>
    </div>

  </div>

  <script src="../common/i18n.js"></script>
  <script src="../common/game-common.js"></script>
  <script src="scenarios-kanikani.js"></script>
  <script src="scenarios-sakuranbo.js"></script>
  <script src="scenarios-softcream.js"></script>
  <script src="game.js"></script>
</body>
</html>
