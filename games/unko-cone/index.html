<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うんコーンキャッチャー | シュールゲームス</title>
  <meta name="description" content="西田がソフトクリームのコーンで落ちてくるうんこをキャッチ！何段積めるかな？※シュールゲームスの全キャラクターには鼻毛が生えています。">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <meta property="og:title" content="うんコーンキャッチャー | シュールゲームス">
  <meta property="og:description" content="うんコーンを積み上げろ！キャッチアクションゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/unko-cone/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/assets/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>

  <!-- Floating poop decoration -->
  <div class="bg-poops" aria-hidden="true">
    <span class="float-poop" style="--x:8%;--y:15%;--delay:0s;--dur:5s">💩</span>
    <span class="float-poop" style="--x:22%;--y:60%;--delay:1.5s;--dur:6s">💩</span>
    <span class="float-poop" style="--x:75%;--y:20%;--delay:0.8s;--dur:4.5s">💩</span>
    <span class="float-poop" style="--x:88%;--y:70%;--delay:2.2s;--dur:5.5s">💩</span>
    <span class="float-poop" style="--x:45%;--y:80%;--delay:3s;--dur:7s">💩</span>
    <span class="float-poop" style="--x:60%;--y:10%;--delay:1s;--dur:4s">🍦</span>
  </div>

  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <div class="title-container">
      <div class="title-icon">💩🍦</div>
      <h1 class="game-title">うんコーン<br>キャッチャー</h1>
      <p class="game-subtitle">～西田、それ乗せるとこちゃうで～</p>
      <div class="nishida-preview" aria-hidden="true">
        <div class="nishida-face">
          <div class="nishida-hair"></div>
          <div class="nishida-head">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose-hair left"></div>
            <div class="nose-hair right"></div>
            <div class="mouth"></div>
          </div>
        </div>
      </div>
      <div id="highscore-display" class="highscore-display"></div>
      <button id="start-btn" class="btn-primary">💩 ゲームスタート 💩</button>
      <div class="controls-help">
        <p class="help-title">操作方法</p>
        <p>← → ：西田を移動</p>
        <p>スマホ：画面をタッチで左右移動</p>
      </div>
      <p class="disclaimer">※本作はファンメイドの非公式パロディゲームです。<br>※シュールゲームスの全キャラクターには鼻毛が生えています。</p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="hud-item">
        <span class="hud-label">スコア</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">段数</span>
        <span id="stack-count" class="hud-value">0</span>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="combo-text" class="combo-text" aria-hidden="true"></div>
    <div id="nishida-comment" class="nishida-comment" aria-hidden="true"></div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="result-container">
      <div class="result-icon">💩</div>
      <h2 class="result-title">ゲームオーバー</h2>
      <div class="result-stats">
        <div class="result-row">
          <span class="result-label">スコア</span>
          <span id="final-score" class="result-value">0</span>
        </div>
        <div class="result-row">
          <span class="result-label">最高段数</span>
          <span id="final-stack" class="result-value">0</span>
        </div>
      </div>
      <div class="result-rank" id="result-rank"></div>
      <!-- さーやのヒス構文コーナー -->
      <div class="saaya-comment-box">
        <div class="saaya-face">
          <div class="saaya-head">
            <div class="saaya-hair"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="saaya-mouth"></div>
          </div>
        </div>
        <div class="saaya-speech">
          <p class="saaya-name">さーや</p>
          <p id="saaya-text" class="saaya-text"></p>
        </div>
      </div>
      <button id="retry-btn" class="btn-primary">💩 もう一度プレイ 💩</button>
      <button id="title-btn" class="btn-secondary">タイトルに戻る</button>
      <p class="disclaimer">※本作はファンメイドの非公式パロディゲームです。<br>※シュールゲームスの全キャラクターには鼻毛が生えています。</p>
    </div>
  </div>

  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
</body>
</html>
