<link rel="stylesheet" href="../common/game-common.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1e0a3c;
  color: #fff;
  font-family: 'Zen Maru Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ===== 共通レイアウト ===== */
.screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 12px 16px;
  max-width: 500px;
  margin: 0 auto;
}
.screen.active { display: flex; }

/* ===== タイトル画面 ===== */
#title-screen {
  background: radial-gradient(ellipse at center, #2e1660 0%, #1e0a3c 70%);
}
#title-screen h1 {
  font-size: clamp(1.2rem, 5vw, 1.8rem);
  color: #ffd700;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  margin-bottom: 0.2em;
  text-align: center;
}
#title-screen .title-character {
  width: clamp(120px, 35vw, 200px);
  margin: 0.5em 0;
  filter: drop-shadow(0 0 15px rgba(255,215,0,0.3));
  animation: titleBounce 2s ease-in-out infinite;
}
@keyframes titleBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-10px) rotate(2deg); }
}
#title-screen .subtitle {
  font-size: clamp(0.75rem, 2.5vw, 0.95rem);
  color: #c9a0dc;
  margin-bottom: 1.5em;
  text-align: center;
}
.game-btn {
  font-family: inherit;
  font-size: clamp(1rem, 3.5vw, 1.2rem);
  padding: 0.7em 2.2em;
  border: 2px solid #ffd700;
  background: transparent;
  color: #ffd700;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s;
}
.game-btn:hover, .game-btn:active {
  background: #ffd700;
  color: #0d0221;
}

/* ===== 選択画面 ===== */
#select-screen {
  background: radial-gradient(ellipse at center, #2e1660 0%, #1e0a3c 70%);
  justify-content: space-evenly;
  padding-top: 28px;
  padding-bottom: 28px;
}
.select-header {
  font-size: clamp(0.7rem, 2.5vw, 0.85rem);
  color: #888;
  margin-bottom: 0;
  flex-shrink: 0;
}
.select-category {
  font-size: clamp(1rem, 4vw, 1.4rem);
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.4);
  margin-bottom: 0;
  text-align: center;
  flex-shrink: 0;
}
.select-character-wrap {
  position: relative;
  width: clamp(90px, 22vh, 180px);
  flex-shrink: 1;
  min-height: 0;
}
.select-character-wrap img {
  width: 100%;
  filter: drop-shadow(0 0 10px rgba(255,215,0,0.2));
}
.equipped-layer {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  max-width: 320px;
  flex-shrink: 0;
}
.choice-btn {
  font-family: inherit;
  font-size: clamp(0.75rem, 2.8vw, 0.95rem);
  padding: 0.5em 0.4em;
  border: 2px solid #c9a0dc;
  background: rgba(201,160,220,0.08);
  color: #e0d0f0;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.choice-btn:hover, .choice-btn:active {
  background: rgba(201,160,220,0.25);
  border-color: #ffd700;
  color: #ffd700;
  transform: scale(1.04);
}
.choice-emoji {
  font-size: clamp(1.3rem, 5vw, 2rem);
}
.choice-label {
  font-size: clamp(0.65rem, 2.2vw, 0.85rem);
}

/* ===== 結果画面 ===== */
#result-screen {
  background: radial-gradient(ellipse at center, #2e1660 0%, #1e0a3c 70%);
  justify-content: flex-start;
  padding-top: 24px;
  overflow-y: auto;
}
.result-title {
  font-size: clamp(1rem, 4vw, 1.4rem);
  color: #ffd700;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
  margin-bottom: 0.3em;
  text-align: center;
}
.result-subtitle {
  font-size: clamp(0.75rem, 2.5vw, 0.9rem);
  color: #c9a0dc;
  margin-bottom: 0.6em;
  text-align: center;
}
.result-character-wrap {
  position: relative;
  width: clamp(130px, 35vw, 220px);
  margin-bottom: 0.6em;
  animation: resultGlow 2s ease-in-out infinite;
}
@keyframes resultGlow {
  0%, 100% { filter: drop-shadow(0 0 15px rgba(255,215,0,0.3)); }
  50% { filter: drop-shadow(0 0 30px rgba(255,215,0,0.6)); }
}
.result-character-wrap img {
  width: 100%;
}
.result-equipped {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.result-item-label {
  font-size: clamp(1.5rem, 6vw, 2.5rem);
}
.result-choices {
  width: 100%;
  max-width: 340px;
  margin-bottom: 0.8em;
}
.result-choice-row {
  display: flex;
  justify-content: space-between;
  padding: 0.3em 0.8em;
  font-size: clamp(0.7rem, 2.5vw, 0.85rem);
  border-bottom: 1px solid rgba(201,160,220,0.15);
}
.result-choice-row .cat { color: #888; }
.result-choice-row .val { color: #e0d0f0; }
.result-comment {
  font-size: clamp(0.75rem, 2.8vw, 0.95rem);
  color: #ffd700;
  text-align: center;
  margin-bottom: 0.8em;
  line-height: 1.6;
  text-shadow: 0 0 8px rgba(255,215,0,0.3);
}
.result-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 24px;
}
.result-buttons button {
  font-family: inherit;
  font-size: clamp(0.8rem, 2.8vw, 0.95rem);
  padding: 0.6em 1.5em;
  border: 2px solid #ffd700;
  background: transparent;
  color: #ffd700;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s;
}
.result-buttons button:hover, .result-buttons button:active {
  background: #ffd700;
  color: #0d0221;
}

/* ===== トランジション ===== */
.fade-enter {
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 背景パーティクル ===== */
#bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

.back-to-top-link {
  position: fixed;
  top: 12px;
  left: 12px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  text-decoration: none;
  z-index: 100;
  transition: color 0.2s;
}
.back-to-top-link:hover {
  color: #fff;
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<!-- ===== タイトル画面 ===== -->
<div id="title-screen" class="screen active">
  <h1 data-i18n="title">カブトムシ様の<br>お着換えあそばせ</h1>
  <img src="kabutomushi.png" alt="カブトムシ様" class="title-character">
  <p class="subtitle" data-i18n="subtitle">カブトムシ様を世界で一人だけの<br>お人へ変身してさしあげろ！</p>
  <button class="game-btn" id="start-btn" data-i18n="startBtn">お着換え開始</button>
</div>

<!-- ===== 選択画面 ===== -->
<div id="select-screen" class="screen">
  <p class="select-header" id="step-label"></p>
  <h2 class="select-category" id="category-label"></h2>
  <div class="select-character-wrap">
    <img src="kabutomushi.png" alt="カブトムシ様" id="select-char">
    <div class="equipped-layer" id="equipped-layer"></div>
  </div>
  <div class="choice-grid" id="choice-grid"></div>
</div>

<!-- ===== 結果画面 ===== -->
<div id="result-screen" class="screen">
  <h2 class="result-title" data-i18n="resultTitle">世界に一人だけの<br>あなただけのカブトムシ様</h2>
  <p class="result-subtitle" id="result-subtitle"></p>
  <div class="result-character-wrap">
    <img src="kabutomushi.png" alt="カブトムシ様" id="result-char">
    <div class="result-equipped" id="result-equipped"></div>
  </div>
  <div class="result-choices" id="result-choices"></div>
  <p class="result-comment" id="result-comment"></p>
  <div class="result-buttons">
    <button id="retry-btn" data-i18n="retryBtn">もう一度着せる</button>
    <button id="share-btn">𝕏 でシェア</button>
  </div>
</div>

<a href="../../index.html" class="back-to-top-link" data-i18n="backToTop">← トップに戻る</a>

<script>
(function(){
  'use strict';

  // ===== カテゴリ定義 =====
  // img: 透過PNGファイル名（あれば画像で重ねる、なければ絵文字で表示）
  var CATEGORIES = [
    {
      id: 'underwear',
      name: '着るもの',
      emoji: '👙',
      choices: [
        { label: 'ブリーフ', emoji: '🩲', img: 'ブリーフ.png' },
        { label: 'ボクサーパンツ', emoji: '🩳', img: 'ボクサーパンツ.png' },
        { label: 'トランクス', emoji: '🩱' },
        { label: '解き放つ', emoji: '🌀', img: 'はかない.png' }
      ]
    },
    {
      id: 'hair',
      name: '髪型',
      emoji: '💇',
      choices: [
        { label: 'リーゼント', emoji: '🦁', img: 'リーゼント.png' },
        { label: '襟足', emoji: '🦊', img: '襟足.png' },
        { label: '耳毛', emoji: '🐑', img: '耳毛.png' },
        { label: 'カイワレ大根', emoji: '🌱', img: 'カイワレ大根.png' }
      ]
    },
    {
      id: 'bag',
      name: 'バッグ',
      emoji: '👜',
      choices: [
        { label: 'L○uis Vuitt○n', emoji: '👜' },
        { label: 'MIU○MIU', emoji: '👛' },
        { label: 'Di○r', emoji: '💼' },
        { label: 'しま○ら', emoji: '🛍️' }
      ]
    },
    {
      id: 'bug',
      name: '虫',
      emoji: '🐛',
      choices: [
        { label: 'クワガタ', emoji: '🪲' },
        { label: 'チョウバエ', emoji: '🪰' },
        { label: 'セミ', emoji: '🦗' },
        { label: '殺虫剤', emoji: '🧴' }
      ]
    },
    {
      id: 'action',
      name: '行動',
      emoji: '⚡',
      choices: [
        { label: '整形', emoji: '💉' },
        { label: '生誕', emoji: '🎂' },
        { label: '請求', emoji: '💸' },
        { label: '整体', emoji: '💆' }
      ]
    }
  ];

  // ===== ゲーム状態 =====
  var currentStep = 0;
  var selections = [];

  // ===== DOM =====
  var titleScreen = document.getElementById('title-screen');
  var selectScreen = document.getElementById('select-screen');
  var resultScreen = document.getElementById('result-screen');
  var stepLabel = document.getElementById('step-label');
  var categoryLabel = document.getElementById('category-label');
  var equippedLayer = document.getElementById('equipped-layer');
  var choiceGrid = document.getElementById('choice-grid');

  function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.remove('active');
    });
    screen.classList.add('active');
    screen.classList.add('fade-enter');
    setTimeout(function() { screen.classList.remove('fade-enter'); }, 400);
  }

  // ===== 選択画面の表示 =====
  function showStep(step) {
    currentStep = step;
    var cat = CATEGORIES[step];
    stepLabel.textContent = (step + 1) + ' / ' + CATEGORIES.length;
    categoryLabel.textContent = cat.emoji + ' ' + cat.name + 'を選べ';

    // 装備済みアイテム表示
    updateEquipped(equippedLayer, selections);

    // 選択肢ボタン
    choiceGrid.innerHTML = '';
    cat.choices.forEach(function(choice, idx) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = '<span class="choice-emoji">' + choice.emoji + '</span>' +
                      '<span class="choice-label">' + choice.label + '</span>';
      btn.addEventListener('click', function() {
        if (typeof SurrealGames !== 'undefined') SurrealGames.SoundSystem.play('tap');
        selections[step] = { category: cat, choice: choice };
        if (step + 1 < CATEGORIES.length) {
          showStep(step + 1);
          selectScreen.classList.add('fade-enter');
          setTimeout(function() { selectScreen.classList.remove('fade-enter'); }, 400);
        } else {
          showResult();
        }
      });
      choiceGrid.appendChild(btn);
    });

    showScreen(selectScreen);
  }

  // ===== 装備表示更新 =====
  function updateEquipped(container, sels) {
    container.innerHTML = '';
    sels.forEach(function(sel) {
      if (!sel) return;
      var choice = sel.choice;

      if (choice.img) {
        // 透過PNG画像をそのまま重ねる（キャラと同サイズなので位置が合う）
        var img = document.createElement('img');
        img.src = choice.img;
        img.alt = choice.label;
        img.style.position = 'absolute';
        img.style.top = '0';
        img.style.left = '0';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';
        img.style.pointerEvents = 'none';
        container.appendChild(img);
      } else {
        // 画像がない場合は絵文字で表示
        var span = document.createElement('span');
        span.textContent = choice.emoji;
        span.style.position = 'absolute';
        span.style.fontSize = 'clamp(1.5rem, 6vw, 2.5rem)';
        span.style.filter = 'drop-shadow(0 0 4px rgba(255,255,255,0.5))';
        span.style.top = '45%';
        span.style.left = '50%';
        span.style.transform = 'translate(-50%, -50%)';
        container.appendChild(span);
      }
    });
  }

  // ===== 結果画面 =====
  function showResult() {
    var resultEquipped = document.getElementById('result-equipped');
    updateEquipped(resultEquipped, selections);

    // 選択一覧
    var choicesDiv = document.getElementById('result-choices');
    choicesDiv.innerHTML = '';
    selections.forEach(function(sel) {
      var row = document.createElement('div');
      row.className = 'result-choice-row';
      row.innerHTML = '<span class="cat">' + sel.category.emoji + ' ' + sel.category.name + '</span>' +
                      '<span class="val">' + sel.choice.emoji + ' ' + sel.choice.label + '</span>';
      choicesDiv.appendChild(row);
    });

    // サブタイトル
    var subtitles = [
      '唯一無二の存在が誕生した…',
      'これが…カブトムシ様の真の姿…！',
      '神々しい…圧倒的オーラ…！',
      'ファッション界に激震が走った',
      'パリコレが嫉妬するレベル'
    ];
    document.getElementById('result-subtitle').textContent =
      subtitles[Math.floor(Math.random() * subtitles.length)];

    // 最後のコメント
    document.getElementById('result-comment').textContent =
      'これが世界に一人だけの、あなただけのカブトムシ様です。どうか末永くお可愛がりくださいませ。';

    showScreen(resultScreen);

    if (typeof SurrealGames !== 'undefined') {
      SurrealGames.SoundSystem.play('result');
      SurrealGames.reportScore(1);
    }
  }

  // ===== 背景パーティクル =====
  var bgCanvas = document.getElementById('bg-canvas');
  var bgCtx = bgCanvas.getContext('2d');
  var sparkles = [];

  function resizeBg() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeBg);
  resizeBg();

  function initSparkles() {
    sparkles = [];
    for (var i = 0; i < 30; i++) {
      sparkles.push({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        size: 1 + Math.random() * 2,
        speed: 0.2 + Math.random() * 0.5,
        opacity: Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  initSparkles();

  function animBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    var t = Date.now() * 0.001;
    sparkles.forEach(function(s) {
      s.y -= s.speed;
      if (s.y < -5) { s.y = bgCanvas.height + 5; s.x = Math.random() * bgCanvas.width; }
      var alpha = 0.4 + 0.35 * Math.sin(t * 2 + s.phase);
      bgCtx.fillStyle = 'rgba(255, 215, 0, ' + alpha + ')';
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      bgCtx.fill();
    });
    requestAnimationFrame(animBg);
  }
  animBg();

  // ===== イベント =====
  document.getElementById('start-btn').addEventListener('click', function() {
    if (typeof SurrealGames !== 'undefined') SurrealGames.SoundSystem.play('start');
    selections = [];
    showStep(0);
  });

  document.getElementById('retry-btn').addEventListener('click', function() {
    if (typeof SurrealGames !== 'undefined') SurrealGames.SoundSystem.play('start');
    selections = [];
    showStep(0);
  });

  document.getElementById('share-btn').addEventListener('click', function() {
    var items = selections.map(function(s) { return s.choice.label; }).join('、');
    var text = 'カブトムシ様を着せ替えた！\n' + items + '\n#シュールゲームス #カブトムシ様のお着換えあそばせ';
    var url = 'https://eri-murayama.github.io/surreal-games/games/emoji-catcher/index.html';
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url));
  });
})();
</script>
