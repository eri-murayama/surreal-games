  <meta charset="UTF-8">

  <meta property="og:title" content="シュール伝説 | シュールゲームス">
  <meta property="og:description" content="うんこ勇者がシュールな魔王を倒す！剣を振って敵を倒し、宝箱を見つけて鍵を取り、扉の先のラスボスを討て。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/surreal-legend/">

  <link rel="canonical" href="https://eri-murayama.github.io/surreal-games/games/surreal-legend/">
  <link rel="stylesheet" href="../common/game-common.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #1a2e1a;
      font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 4px;
    }
    .hud {
      width: 100%; max-width: 480px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px;
      font-size: 14px;
    }
    .hearts { font-size: 18px; letter-spacing: 2px; }
    .stage-info { font-weight: 700; }
    #game-canvas {
      display: block;
      background: #4a8c2a;
      border: 3px solid #6b3a1a;
      border-radius: 6px;
      width: 100%;
      max-width: 480px;
      height: auto;
      aspect-ratio: 3 / 4;
      image-rendering: pixelated;
    }
    .controls {
      width: 100%; max-width: 480px;
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px;
      padding: 0 8px;
    }
    .dpad {
      display: grid;
      grid-template-columns: 50px 50px 50px;
      grid-template-rows: 50px 50px 50px;
      gap: 4px;
    }
    .dpad button {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
    .dpad button:active { background: rgba(255,255,255,0.35); }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }
    .attack-btn {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #c92a2a);
      border: 3px solid #fff;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #6b1a1a;
    }
    .attack-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #6b1a1a; }
    .overlay {
      position: absolute; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      text-align: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0 0 12px; font-size: 28px; }
    .overlay p { margin: 6px 0; font-size: 15px; line-height: 1.6; }
    .overlay button {
      margin-top: 14px;
      padding: 10px 24px;
      font-size: 16px; font-weight: 700;
      background: #ffd166; color: #333;
      border: none; border-radius: 8px;
      cursor: pointer;
    }
    .back-link {
      position: fixed; top: 6px; left: 6px;
      color: #fff; text-decoration: none;
      font-size: 12px;
      background: rgba(0,0,0,0.4);
      padding: 4px 8px; border-radius: 4px;
      z-index: 5;
    }
    @media (min-width: 700px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="back-link">← トップ</a>

  <div class="wrap">
    <div class="hud">
      <div class="hearts" id="hearts">❤️❤️❤️</div>
      <div class="stage-info" id="stage-info">ステージ 1 / 3</div>
      <div class="hud-key" id="key-info">🗝️ 0</div>
    </div>

    <canvas id="game-canvas" width="360" height="480"></canvas>

    <div class="controls">
      <div class="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
      <button class="attack-btn" id="attack-btn">剣</button>
    </div>
  </div>

  <div class="overlay" id="title-overlay">
    <h2>⚔️ シュール伝説 ⚔️</h2>
    <p>うんこ勇者よ、立ち上がるのだ。</p>
    <p>シュールな魔物を倒して鍵を集め、<br>奥のとびらの先にいる魔王を討て。</p>
    <p style="font-size:13px;opacity:0.85;">PC: 矢印キーで移動 / スペースで剣<br>スマホ: 十字キー + 「剣」ボタン</p>
    <button id="start-btn">冒険にでる</button>
  </div>

  <div class="overlay" id="end-overlay">
    <h2 id="end-title">クリア！</h2>
    <p id="end-text"></p>
    <button id="restart-btn">もういちど</button>
    <button id="share-btn" style="background:#1da1f2;color:#fff;">Xにシェア</button>
  </div>

  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
</body>
</html>
