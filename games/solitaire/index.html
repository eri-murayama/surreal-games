<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-1: #2c1845;
  --bg-2: #1a0e2e;
  --accent: #ffd166;
  --text: #fff;
  --muted: rgba(255,255,255,0.65);
}

html, body {
  height: 100%;
  font-family: 'Hiragino Sans', 'Meiryo', 'Segoe UI', sans-serif;
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

#stageSelectScreen, #gameScreen {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

#gameScreen { display: none; }

/* ======== ステージ選択画面 ======== */
.select-header {
  padding: 12px 16px 8px;
  text-align: center;
  flex-shrink: 0;
}
.select-header h1 {
  font-size: 22px;
  margin-bottom: 4px;
  color: var(--accent);
  letter-spacing: 0.04em;
}
.select-header p {
  font-size: 13px;
  color: var(--muted);
}

.select-back {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
  background: rgba(0,0,0,0.3);
  padding: 6px 12px;
  border-radius: 16px;
  z-index: 10;
}

#stageGrid {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
  gap: 10px;
  align-content: start;
}

.stage-btn {
  aspect-ratio: 1;
  border-radius: 12px;
  background: linear-gradient(135deg, #4a2570, #3a1c5a);
  color: #fff;
  font-weight: bold;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,0.1);
  transition: transform 0.1s;
}
.stage-btn:not(:disabled):active { transform: scale(0.95); }
.stage-btn.locked {
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.3);
  cursor: not-allowed;
}
.stage-btn.cleared {
  background: linear-gradient(135deg, #ffaa00, #ff6b00);
  border-color: var(--accent);
}
.stage-num { font-size: 18px; }
.stage-star, .stage-lock {
  position: absolute;
  bottom: 3px;
  right: 5px;
  font-size: 10px;
}
.stage-star { color: #fff; font-size: 12px; }

/* ======== ゲーム画面 ======== */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(0,0,0,0.3);
  flex-shrink: 0;
  font-size: 13px;
}
.game-header .left, .game-header .right {
  display: flex;
  gap: 8px;
  align-items: center;
}
.game-header button {
  background: rgba(255,255,255,0.1);
  padding: 5px 10px;
  border-radius: 14px;
  font-size: 12px;
  color: #fff;
}
.game-header button:active { background: rgba(255,255,255,0.2); }
.game-header .center {
  text-align: center;
  flex: 1;
}
.stage-info { font-size: 12px; color: var(--muted); }
.stage-info strong { color: var(--accent); margin-right: 4px; }
.stat-row { display: flex; gap: 12px; justify-content: center; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat-row span { color: #fff; font-weight: bold; }

/* ピラミッド領域 */
#pyramid {
  position: relative;
  width: 100%;
  flex: 1;
  margin: 12px 0;
  min-height: 0;
}

.pyramid-card {
  position: absolute;
  border-radius: 8px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px;
  text-align: center;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  border: 2px solid rgba(255,255,255,0.25);
  overflow: hidden;
}
.pyramid-card.takeable {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 4px 10px rgba(0,0,0,0.5);
  animation: pulse 1.4s ease-in-out infinite;
}
.pyramid-card.blocked { opacity: 0.55; cursor: not-allowed; }
.pyramid-card .card-icon { font-size: 22px; line-height: 1; }
.pyramid-card .card-word { font-size: 10px; line-height: 1.1; margin-top: 2px; word-break: keep-all; }

@keyframes pulse {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* 下部: 山札 + 手札 */
#bottomBar {
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 8px 16px 16px;
  flex-shrink: 0;
  gap: 12px;
}

.zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.zone-label { font-size: 11px; color: var(--muted); }

#stockArea {
  width: 76px;
  height: 100px;
  border-radius: 10px;
  background: linear-gradient(135deg, #5a3aa0, #3a1c5a);
  border: 2px solid rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
  position: relative;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  transition: transform 0.1s;
}
#stockArea:active { transform: scale(0.95); }
#stockArea.empty {
  opacity: 0.4;
  cursor: not-allowed;
  background: rgba(255,255,255,0.1);
}
#stockArea::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 6px;
  background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.08) 4px, rgba(255,255,255,0.08) 8px);
  pointer-events: none;
}
#stockCount { position: relative; z-index: 1; }

#handCard {
  width: 110px;
  height: 130px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px;
  font-weight: bold;
  color: #fff;
  text-align: center;
  border: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(255,209,102,0.4), 0 4px 10px rgba(0,0,0,0.5);
}
#handCard.empty {
  background: rgba(255,255,255,0.05) !important;
  border-color: rgba(255,255,255,0.2);
  box-shadow: none;
  font-size: 12px;
  color: var(--muted);
}
#handCard .card-icon { font-size: 36px; line-height: 1; }
#handCard .card-word { font-size: 14px; margin-top: 4px; line-height: 1.2; }
#handCard .card-cat { font-size: 11px; opacity: 0.85; margin-top: 2px; }

/* オーバーレイ */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.overlay-card {
  background: linear-gradient(160deg, #3a1c5a, #1a0e2e);
  padding: 24px 24px 20px;
  border-radius: 16px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  border: 2px solid var(--accent);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.overlay-emoji { font-size: 56px; margin-bottom: 6px; }
.overlay-card h2 { font-size: 20px; margin-bottom: 6px; color: var(--accent); }
.overlay-card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

.overlay-stats {
  display: flex;
  justify-content: space-around;
  margin: 14px 0;
  padding: 12px;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
}
.overlay-stats > div { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.overlay-stats span { color: var(--muted); }
.overlay-stats strong { font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }

.overlay-btns {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.overlay-btns button {
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: #fff;
}
.overlay-btns button.primary {
  background: linear-gradient(135deg, var(--accent), #ff9500);
  color: #1a0e2e;
}

/* Confetti */
.confetti {
  position: fixed;
  width: 9px;
  height: 9px;
  z-index: 1500;
  pointer-events: none;
  animation: cfall linear forwards;
}
@keyframes cfall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* lang switch */
#lang-switch { position: fixed; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; }
#lang-switch .lang-btn {
  padding: 5px 11px; border: 2px solid rgba(255,255,255,0.3);
  border-radius: 6px; background: rgba(0,0,0,0.3);
  color: rgba(255,255,255,0.7); font-size: 11px; font-weight: bold; cursor: pointer;
}
#lang-switch .lang-btn.active { background: var(--accent); color: #1a0e2e; border-color: var(--accent); }
</style>
<link rel="stylesheet" href="../common/game-common.css">
</head>
<body>

<div id="lang-switch">
  <button class="lang-btn active" data-lang="ja" onclick="if(window.SurrealI18n)SurrealI18n.setLang('ja')">JP</button>
  <button class="lang-btn" data-lang="en" onclick="if(window.SurrealI18n)SurrealI18n.setLang('en')">EN</button>
</div>

<!-- ステージ選択画面 -->
<div id="stageSelectScreen">
  <a class="select-back" href="../../prototypes.html">← 試作品に戻る</a>
  <div class="select-header">
    <h1>ワードソリティア</h1>
    <p>同じカテゴリのカードを連鎖で取って盤面を空にしよう</p>
  </div>
  <div id="stageGrid"></div>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen">
  <div class="game-header">
    <div class="left">
      <button onclick="showStageSelect()">← 一覧</button>
      <button onclick="undo()">↩</button>
    </div>
    <div class="center">
      <div class="stage-info"><strong id="stageLabel">ステージ 1</strong> <span id="stageTheme"></span></div>
      <div class="stat-row">
        <div>⏱<span id="timerVal">00:00</span></div>
        <div>🎯<span id="scoreVal">0</span></div>
        <div>👆<span id="movesVal">0</span></div>
      </div>
    </div>
    <div class="right">
      <button onclick="newGame(state.stageNum)">⟳</button>
    </div>
  </div>

  <div id="pyramid"></div>

  <div id="bottomBar">
    <div class="zone">
      <div class="zone-label">山札</div>
      <div id="stockArea" onclick="drawStock()">
        <span id="stockCount">0</span>
      </div>
    </div>
    <div class="zone">
      <div class="zone-label">手札（このカテゴリを取れる）</div>
      <div id="handCard" class="empty">
        <div class="empty-mst">山札をめくってね</div>
      </div>
    </div>
  </div>
</div>

<!-- オーバーレイ -->
<div id="overlay"></div>

<!-- データ・ロジック -->
<script src="data.js"></script>
<script src="stages.js"></script>
<script src="game.js"></script>

<!-- 共通 -->
<script src="../common/i18n.js"></script>
<script src="../common/game-common.js"></script>
<script>
  if (window.SurrealGames && SurrealGames.initShareAndFollow) {
    SurrealGames.initShareAndFollow('solitaire');
  }
</script>
</body>
</html>
