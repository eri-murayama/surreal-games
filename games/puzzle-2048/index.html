<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->

    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シュール進化論 - シュールゲームス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
  <meta property="og:title" content="シュール進化論 | シュールゲームス">
  <meta property="og:description" content="合体せよ、その先の未知へ。2048系パズルゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/puzzle-2048/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/assets/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="game-wrapper" data-sg-scale="480x750">
    <h1 class="game-title">シュール進化論</h1>
    <p class="game-subtitle">～合体せよ、その先の未知へ～</p>

    <!-- タイトル画面 -->
    <div id="title-screen">
      <div id="title-emoji"></div>
      <div id="title-catchphrase">「すべてはかにかにから始まる...」</div>
      <div id="highscore-display"></div>
      <button id="start-btn">進化を始める</button>
      <button id="continue-btn" class="hidden">続きから</button>
      <p id="title-hint">矢印キー / WASD / スワイプでスライド<br>同じ生物を合体させて進化させよう</p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden">
      <div id="game-hud">
        <div id="hud-score">スコア: 0</div>
        <div id="hud-best">ベスト: 0</div>
      </div>
      <div id="hud-evolution"><span id="hud-evo-label">最高進化</span>: <span id="hud-max-evo">🫧</span></div>
      <div id="board-container">
        <div id="board"></div>
      </div>
      <div id="game-comment"></div>
      <div id="game-buttons">
        <button id="undo-btn">↩ 戻す</button>
        <button id="restart-btn">🔄 やり直す</button>
      </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="hidden">
      <div id="gameover-title">進化の袋小路...</div>
      <div id="gameover-stats"></div>
      <div id="gameover-comment"></div>
      <button id="retry-btn">もう一度進化する</button>
    </div>

    <!-- カットイン演出 -->
    <div id="cutin-overlay" class="hidden">
      <div id="cutin-char"></div>
      <div id="cutin-name"></div>
    </div>

  </div>
  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>
  <script src="../common/i18n.js"></script>
  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
</body>
</html>
