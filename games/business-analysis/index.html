<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>経営分析ゲーム～天才たちの戯れ～ - シュールゲームス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">

    <!-- タイトル画面 -->
    <div id="title-screen">
      <div id="title-sparkle-container"></div>
      <div id="title-character">
        <div id="atsushi-title"></div>
      </div>
      <h1 id="game-title">
        経営分析ゲーム<br>
        ～天才たちの<ruby>戯れ<rp>(</rp><rt>シーソーゲーム</rt><rp>)</rp></ruby>～
      </h1>
      <button id="start-btn">始める</button>
    </div>

    <!-- オープニング画面 -->
    <div id="opening-screen" class="hidden">
      <div id="opening-bg"></div>
      <div id="atsushi-opening"></div>
      <div id="opening-text-box">
        <p id="opening-text"></p>
      </div>
      <button id="opening-next-btn" class="hidden">▼</button>
    </div>

    <!-- ラーメン屋シーン -->
    <div id="ramen-screen" class="hidden">
      <div id="ramen-shop">
        <div id="shop-bg"></div>
        <!-- クリッカブルオブジェクト -->
        <div class="clickable-obj" id="obj-oyaji" data-name="oyaji">
          <div class="obj-visual" id="visual-oyaji"></div>
          <div class="obj-label">店主</div>
        </div>
        <div class="clickable-obj" id="obj-ramen" data-name="ramen">
          <div class="obj-visual" id="visual-ramen"></div>
          <div class="obj-label">ラーメン</div>
        </div>
        <div class="clickable-obj" id="obj-register" data-name="register">
          <div class="obj-visual" id="visual-register"></div>
          <div class="obj-label">レジ</div>
        </div>
        <div class="clickable-obj" id="obj-sign" data-name="sign">
          <div class="obj-visual" id="visual-sign"></div>
          <div class="obj-label">看板</div>
        </div>
        <div class="clickable-obj" id="obj-table" data-name="table">
          <div class="obj-visual" id="visual-table"></div>
          <div class="obj-label">テーブル</div>
        </div>
      </div>

      <!-- 篤のキャラクター表示 -->
      <div id="atsushi-ramen"></div>

      <!-- セリフ欄 -->
      <div id="dialogue-box" class="hidden">
        <div id="dialogue-name">篤</div>
        <p id="dialogue-text"></p>
        <button id="dialogue-close-btn">▼</button>
      </div>

      <!-- ヒント -->
      <div id="ramen-hint">経営的にまずい箇所をクリックしろ</div>
    </div>

    <!-- レジ演出画面 -->
    <div id="register-scene" class="hidden">
      <div id="register-animation"></div>
      <div id="register-text-box">
        <p id="register-text"></p>
      </div>
      <button id="register-next-btn" class="hidden">▼</button>
    </div>

    <!-- エンディング画面 -->
    <div id="ending-screen" class="hidden">
      <div id="ending-sparkle-container"></div>
      <div id="atsushi-ending"></div>
      <div id="ending-text-box">
        <p id="ending-text"></p>
      </div>
      <div id="ending-buttons" class="hidden">
        <button id="replay-btn">もう一度プレイ</button>
        <a href="../../index.html" class="ending-home-btn">トップに戻る</a>
      </div>
    </div>

    <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>
  </div>
  <script src="game.js"></script>
</body>
</html>
