<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>チー牛な俺がチート商材で無敵なモテ男に転生！？RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <meta property="og:title" content="チー牛な俺がチート商材で無敵なモテ男に転生！？RPG | シュールゲームス">
  <meta property="og:description" content="恋愛経験値をためて本命に告白！シュールな恋愛RPG。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/rpg/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/games/rpg/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper" data-sg-scale="480x750" data-sg-scale-max="1.2" data-sg-scale-max-offset-y="56">
    <h1 class="game-title">チー牛な俺がチート商材で無敵なモテ男に転生！？RPG</h1>

    <!-- ゲーム画面 -->
    <div id="screen">
      <canvas id="canvas" width="256" height="192"></canvas>

      <!-- ステータスバー -->
      <div id="status-bar">
        <span id="stat-name">ゆうしゃ Lv.1</span>
        <span id="stat-hp">精神力 30/30</span>
        <span id="stat-gf">彼女 0人</span>
        <span id="stat-money">0ギュニー</span>
      </div>

      <!-- メッセージボックス -->
      <div id="msg-box" class="hidden">
        <div id="msg-text"></div>
        <div id="msg-indicator">▼</div>
      </div>

      <!-- バトル画面 -->
      <div id="battle-overlay" class="hidden">
        <div id="battle-enemy-area">
          <canvas id="enemy-canvas" width="64" height="64"></canvas>
          <div id="enemy-name"></div>
          <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
        </div>
        <div id="battle-log"></div>
        <div id="battle-player-status">
          <span id="battle-hp">精神力 30/30</span>
          <span id="battle-money">0ギュニー</span>
          <span id="battle-gf">彼女 0人</span>
        </div>
        <div id="battle-menu">
          <button class="battle-btn" data-action="confess">告白する</button>
          <button class="battle-btn" data-action="praise">褒める</button>
          <button class="battle-btn" data-action="gift">プレゼント</button>
          <button class="battle-btn" data-action="run">逃げる</button>
        </div>
      </div>

      <!-- ショップ画面 -->
      <div id="shop-overlay" class="hidden">
        <div id="shop-header">
          <span id="shop-title">プレゼント屋</span>
          <span id="shop-money">0ギュニー</span>
        </div>
        <div id="shop-list"></div>
        <div id="shop-log">なにを 買う？</div>
        <div id="shop-menu">
          <button class="shop-btn" data-idx="0"></button>
          <button class="shop-btn" data-idx="1"></button>
          <button class="shop-btn" data-idx="2"></button>
          <button class="shop-btn" data-idx="3"></button>
          <button class="shop-btn" data-idx="4"></button>
          <button class="shop-btn shop-close" data-idx="close">とじる</button>
        </div>
      </div>

      <!-- 武器屋画面 -->
      <div id="weapon-overlay" class="hidden">
        <div id="weapon-header">
          <span id="weapon-title">武器屋</span>
          <span id="weapon-money">0ギュニー</span>
        </div>
        <div id="weapon-list"></div>
        <div id="weapon-log">なにを 買う？</div>
        <div id="weapon-menu">
          <button class="weapon-btn" data-idx="0"></button>
          <button class="weapon-btn" data-idx="1"></button>
          <button class="weapon-btn" data-idx="2"></button>
          <button class="weapon-btn" data-idx="3"></button>
          <button class="weapon-btn" data-idx="4"></button>
          <button class="weapon-btn weapon-close" data-idx="close">とじる</button>
        </div>
      </div>

      <!-- タイトル画面 -->
      <div id="title-screen">
        <div id="title-logo">チー牛RPG</div>
        <button id="start-btn">恋の旅にでる</button>
        <button id="continue-btn" class="hidden">つづきから</button>
        <p id="title-hint">矢印キーで移動 / スペースで調べる</p>
      </div>

      <!-- 勝利画面 -->
      <div id="victory-screen" class="hidden">
        <div id="victory-title">じゅまんどぅと両想い！</div>
        <div id="victory-sub"></div>
        <button id="victory-btn">タイトルに戻る</button>
      </div>
    </div>
  </div>

  <!-- モバイル用操作パッド -->
  <div id="mobile-controls" class="hidden">
    <div id="dpad">
      <button class="dpad-btn" id="dpad-up" data-key="ArrowUp">↑</button>
      <button class="dpad-btn" id="dpad-left" data-key="ArrowLeft">←</button>
      <button class="dpad-btn" id="dpad-right" data-key="ArrowRight">→</button>
      <button class="dpad-btn" id="dpad-down" data-key="ArrowDown">↓</button>
    </div>
    <button id="action-btn" data-key=" ">A</button>
  </div>

  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>
  <script src="../common/i18n.js"></script>
  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
</body>
</html>
