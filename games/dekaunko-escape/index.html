  <title>でかうんこ脱出 - シュールゲームス</title>
  <!-- OGP -->
  <meta property="og:title" content="でかうんこ脱出 | シュールゲームス">
  <meta property="og:description" content="でかくなりすぎた主人公がトイレを目指して脱出！食べ物を避け、トイレに入って小さくなろう。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/dekaunko-escape/index.html">

  <!-- スタイル -->

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active">
      <div class="title-inner">
        <div class="title-poop">💩</div>
        <h1 class="game-title" data-i18n="title">でかうんこ脱出</h1>
        <p class="game-subtitle" data-i18n="subtitle">食べすぎた…トイレまで逃げろ！</p>
        <div id="highscore-display" class="highscore-display"></div>
        <button id="start-btn" class="btn-primary" data-i18n="startBtn">▶ スタート</button>
        <div class="controls-help">
          <p class="help-title" data-i18n="howTitle">あそびかた</p>
          <p data-i18n="how1">🍰 食べ物に触れるとデカくなる（だめ）</p>
          <p data-i18n="how2">🚽 トイレに入ると小さくなる（いい）</p>
          <p data-i18n="how3">⏱ 時間内にサイズ0で脱出成功！</p>
          <p class="help-ops" data-i18n="howOps">PC: 矢印キー / スマホ: 画面タッチで移動</p>
        </div>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
      <div class="game-hud">
        <div class="hud-item">
          <span class="hud-label" data-i18n="weight">たいじゅう</span>
          <span id="weight-val" class="hud-value">100</span><span class="hud-unit">kg</span>
        </div>
        <div class="hud-item">
          <span class="hud-label" data-i18n="timeLabel">のこり</span>
          <span id="time-val" class="hud-value">60</span><span class="hud-unit">s</span>
        </div>
      </div>
      <div class="weight-bar-wrap">
        <div id="weight-bar" class="weight-bar"></div>
        <div class="weight-bar-goal"></div>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="effect-text" class="effect-text" aria-hidden="true"></div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen">
      <div class="result-inner">
        <div id="result-icon" class="result-icon">💩</div>
        <h2 id="result-title" class="result-title" data-i18n="gameOver">ゲームオーバー</h2>
        <p id="result-msg" class="result-msg"></p>
        <div class="result-stats">
          <div class="result-row">
            <span class="result-label" data-i18n="finalWeight">さいしゅうたいじゅう</span>
            <span id="final-weight" class="result-value">100kg</span>
          </div>
          <div class="result-row">
            <span class="result-label" data-i18n="surviveTime">のがれた時間</span>
            <span id="final-time" class="result-value">0s</span>
          </div>
        </div>
        <button id="retry-btn" class="btn-primary" data-i18n="retry">もう一度</button>
        <button id="title-btn" class="btn-secondary" data-i18n="backTitle">タイトルへ</button>
      </div>
    </div>

  </div>

  <a href="../../index.html" class="back-to-top-link" data-i18n="backToTop">← トップに戻る</a>
