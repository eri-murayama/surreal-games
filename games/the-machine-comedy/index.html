<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE MACHINE (Comedy ver.) | ザ・マシーン コメディ版</title>
  <meta name="description" content="THE MACHINE のコメディ版。Gamedev.js Jam 2026 「Machines」参加作品。">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <meta property="og:title" content="THE MACHINE | ザ・マシーン">
  <meta property="og:description" content="あなたはマシンに乗り込み、敵と戦う…はずだった。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
  <script src="../common/i18n.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <a href="../../index.html" class="back-to-top-link">← トップに戻る</a>
  <button id="mute-btn" class="mute-btn" aria-label="mute">🔊</button>

  <!-- ===== タイトル画面 ===== -->
  <div id="title-screen" class="screen active">
    <canvas id="title-bg-canvas" width="500" height="700"></canvas>
    <div class="title-scanlines"></div>
    <div class="title-container">
      <h1 class="game-title">THE<br>MACHINE</h1>
      <p class="subtitle" data-i18n="subtitle">あなたはパイロットだ。</p>
      <button id="start-btn" class="btn-primary" data-i18n="start">▶ START</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
      <p class="proto-note" data-i18n="protoNote">Gamedev.js Jam 2026 / Theme: Machines</p>
    </div>
  </div>

  <!-- ===== オープニング: 3Dロボットバトル ===== -->
  <div id="opening-screen" class="screen">
    <div id="opening-3d"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="opening-hud">
      <div class="hp-bar hp-blue"><div class="hp-fill" id="hp-blue-fill"></div><span class="hp-name">UNIT-07</span></div>
      <div class="hp-bar hp-red"><div class="hp-fill" id="hp-red-fill"></div><span class="hp-name">GOLIATH</span></div>
    </div>
    <div class="hit-text-overlay" id="hit-text-overlay"></div>
    <div class="cinematic-overlay opening-overlay">
      <p class="cinematic-text" id="opening-text"></p>
      <p class="tap-hint" id="opening-hint">TAP</p>
    </div>
  </div>

  <!-- ===== 少年がテレビを観る ===== -->
  <div id="boy-screen" class="screen">
    <canvas id="boy-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay">
      <p class="cinematic-text" id="boy-text"></p>
      <p class="tap-hint" id="boy-hint">TAP</p>
    </div>
  </div>

  <!-- ===== 応募ポスター ===== -->
  <div id="poster-screen" class="screen">
    <canvas id="poster-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay poster-overlay">
      <button id="apply-btn" class="btn-primary" data-i18n="applyBtn">応募する！</button>
    </div>
  </div>

  <!-- ===== コクピット起動 ===== -->
  <div id="boot-screen" class="screen">
    <div class="boot-bg"></div>
    <div class="boot-container">
      <p class="boot-line" id="boot-line">SYSTEM BOOT...</p>
      <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
      <p class="boot-warning" id="boot-warning"></p>
    </div>
  </div>

  <!-- ===== Phase 2 遷移 (VR起動) ===== -->
  <div id="vr-transition-screen" class="screen">
    <canvas id="vr-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay">
      <p class="cinematic-text" id="vr-text"></p>
    </div>
  </div>

  <!-- ===== TEST COMPLETE 待機画面 ===== -->
  <div id="test-complete-screen" class="screen">
    <canvas id="tc-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay tc-overlay">
      <p class="cinematic-text" id="tc-text"></p>
    </div>
  </div>

  <!-- ===== 合格発表 ===== -->
  <div id="result-screen" class="screen">
    <canvas id="result-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay">
      <p class="cinematic-text" id="result-text"></p>
      <p class="tap-hint" id="result-hint">TAP</p>
    </div>
  </div>

  <!-- ===== 正体開示 ===== -->
  <div id="reveal-screen" class="screen">
    <canvas id="reveal-canvas" width="500" height="500"></canvas>
    <div class="cinematic-overlay">
      <p class="cinematic-text" id="reveal-text"></p>
      <p class="tap-hint" id="reveal-hint">TAP</p>
    </div>
  </div>

  <!-- ===== ミニゲーム画面 ===== -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="hud-act" id="hud-act">ACT 1</div>
      <div class="hud-task" id="hud-task">AIM AND SHOOT</div>
      <div class="hud-timer"><div class="hud-timer-fill" id="hud-timer-fill"></div></div>
    </div>
    <canvas id="game-canvas" width="500" height="500"></canvas>
    <div class="game-feedback" id="game-feedback"></div>
  </div>

  <!-- ===== 第3幕: 鏡 ===== -->
  <div id="mirror-screen" class="screen">
    <div class="mirror-container">
      <h2 class="mirror-title" data-i18n="mirrorTitle">記録</h2>
      <div class="mirror-canvases">
        <div class="mini-canvas-wrap">
          <p class="mini-canvas-label">HEATMAP</p>
          <canvas id="mirror-heatmap" width="140" height="140"></canvas>
        </div>
        <div class="mini-canvas-wrap">
          <p class="mini-canvas-label">GHOST</p>
          <canvas id="mirror-ghost" width="140" height="140"></canvas>
        </div>
      </div>
      <div class="mirror-stats" id="mirror-stats"></div>
      <p class="mirror-message" id="mirror-message"></p>
      <button id="mirror-next" class="btn-primary">▶</button>
    </div>
  </div>

  <!-- ===== 結末 ===== -->
  <div id="end-screen" class="screen">
    <div class="end-container">
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-line" id="end-line"></p>
      <button id="retry-btn" class="btn-primary" data-i18n="retry">もう一度</button>
      <button id="share-btn" class="btn-secondary" data-i18n="share">𝕏 シェア</button>
      <button id="other-btn" class="btn-secondary" data-i18n="otherGames">他のゲーム</button>
      <button id="title-btn" class="btn-secondary" data-i18n="backToTitle">タイトルへ</button>
    </div>
  </div>

  <!-- ===== BGM試聴パネル(プロトタイプ専用) ===== -->
  <div id="bgm-panel">
    <p class="bgm-panel-title">🎵 BGM試聴 (プロト用)</p>
    <button class="bgm-btn" data-bgm="act1">第1幕: メカバトル</button>
    <button class="bgm-btn" data-bgm="act2a">第2幕前半: ほのぼの</button>
    <button class="bgm-btn" data-bgm="act2b">第2幕後半: 機械化</button>
    <button class="bgm-btn" data-bgm="act3">第3幕: 鏡</button>
    <button class="bgm-btn bgm-stop" data-bgm="stop">⏹ 停止</button>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
