<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
}

body {
  background: linear-gradient(135deg, #f97316 0%, #e11d48 40%, #9333ea 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  color: #fff;
  position: relative;
}

.back-link {
  position: absolute;
  top: 8px;
  left: 12px;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-size: 14px;
  z-index: 100;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(255,255,255,0.12);
  transition: background 0.2s;
}
.back-link:hover { background: rgba(255,255,255,0.25); }

h1 {
  font-size: clamp(18px, 4.5vw, 28px);
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}

.controls {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.controls button, .size-btn {
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: clamp(12px, 2.5vw, 14px);
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 600;
  backdrop-filter: blur(4px);
}
.controls button:hover, .size-btn:hover {
  background: rgba(255,255,255,0.32);
  transform: translateY(-1px);
}
.size-btn.active {
  background: rgba(255,255,255,0.4);
  border-color: #fff;
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
}

.info-bar {
  display: flex;
  gap: 20px;
  margin-bottom: 8px;
  font-size: clamp(13px, 3vw, 16px);
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.board-wrapper {
  position: relative;
  touch-action: none;
}

.board {
  position: relative;
  background: rgba(0,0,0,0.15);
  border-radius: 12px;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.25), 0 4px 20px rgba(0,0,0,0.2);
  overflow: hidden;
}

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  transition: left 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              top 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow: 0 3px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  z-index: 1;
}
.tile:active {
  transform: scale(0.96);
}

.empty-slot {
  position: absolute;
  border-radius: 10px;
  background: rgba(0,0,0,0.08);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.12);
  z-index: 0;
}

/* クリアアニメーション */
.tile.celebrate {
  animation: tileGlow 0.5s ease forwards;
}
@keyframes tileGlow {
  0% { box-shadow: 0 3px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3); }
  50% { box-shadow: 0 0 20px 6px rgba(255,255,200,0.8), inset 0 1px 0 rgba(255,255,255,0.5); transform: scale(1.08); }
  100% { box-shadow: 0 0 12px 3px rgba(255,255,200,0.4), inset 0 1px 0 rgba(255,255,255,0.3); transform: scale(1.0); }
}

/* 紙吹雪 */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  z-index: 1000;
  pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.overlay.show { display: flex; }

.clear-modal {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 20px;
  padding: 28px 36px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.clear-modal h2 {
  font-size: clamp(22px, 5vw, 32px);
  margin-bottom: 10px;
}
.clear-modal p {
  font-size: clamp(14px, 3vw, 18px);
  margin-bottom: 6px;
  opacity: 0.9;
}
.clear-modal button {
  margin-top: 16px;
  background: #fff;
  color: #764ba2;
  border: none;
  padding: 10px 28px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s;
}
.clear-modal button:hover { transform: scale(1.05); }
</style>

<body>

<div id="lang-switch" style="position:fixed;top:10px;right:10px;z-index:1000;display:flex;gap:4px;">
  <button class="lang-btn active" data-lang="ja" onclick="if(window.SurrealI18n)SurrealI18n.setLang('ja')" style="padding:6px 14px;border:2px solid rgba(255,255,255,0.3);border-radius:6px;background:rgba(0,0,0,0.3);color:rgba(255,255,255,0.7);font-size:13px;font-weight:bold;cursor:pointer;backdrop-filter:blur(4px);">JP</button>
  <button class="lang-btn" data-lang="en" onclick="if(window.SurrealI18n)SurrealI18n.setLang('en')" style="padding:6px 14px;border:2px solid rgba(255,255,255,0.3);border-radius:6px;background:rgba(0,0,0,0.3);color:rgba(255,255,255,0.7);font-size:13px;font-weight:bold;cursor:pointer;backdrop-filter:blur(4px);">EN</button>
</div>

<h1>スライドパズル</h1>

<div class="controls">
  <button class="size-btn active" data-size="3">3x3</button>
  <button class="size-btn" data-size="4">4x4</button>
  <button class="size-btn" data-size="5">5x5</button>
  <button id="shuffleBtn">シャッフル</button>
  <button id="newGameBtn">新しいゲーム</button>
</div>

<div class="info-bar">
  <span>手数: <span id="moveCount">0</span></span>
  <span>時間: <span id="timer">00:00</span></span>
</div>

<div class="board-wrapper" id="boardWrapper">
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="clear-modal">
    <h2>クリア!</h2>
    <p id="clearMoves"></p>
    <p id="clearTime"></p>
    <button id="playAgainBtn">もう一度遊ぶ</button>
  </div>
</div>

<script>
(function() {
  // State
  let gridSize = 3;
  let tiles = [];       // 1D array of values (0 = empty)
  let emptyIdx = 0;
  let moveCount = 0;
  let timerInterval = null;
  let startTime = 0;
  let isPlaying = false;
  let isCelebrating = false;

  // DOM
  const board = document.getElementById('board');
  const boardWrapper = document.getElementById('boardWrapper');
  const moveCountEl = document.getElementById('moveCount');
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const clearMovesEl = document.getElementById('clearMoves');
  const clearTimeEl = document.getElementById('clearTime');

  // Tile colors based on value ratio
  function tileColor(val, total) {
    const ratio = (val - 1) / Math.max(total - 1, 1);
    // HSL: go from 210 (blue) through 140 (green), 30 (orange), 0 (red), to 280 (purple)
    const hue = 210 + ratio * 250; // wraps nicely
    const sat = 70 + ratio * 10;
    const light = 48 + Math.sin(ratio * Math.PI) * 8;
    return `hsl(${hue % 360}, ${sat}%, ${light}%)`;
  }

  function tileColorLight(val, total) {
    const ratio = (val - 1) / Math.max(total - 1, 1);
    const hue = 210 + ratio * 250;
    const sat = 65 + ratio * 10;
    const light = 60 + Math.sin(ratio * Math.PI) * 6;
    return `hsl(${hue % 360}, ${sat}%, ${light}%)`;
  }

  function calcSizes() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // Reserve space for header/controls/info
    const available = Math.min(vw - 24, vh - 180);
    const boardPx = Math.min(available, 420);
    const gap = Math.max(3, Math.round(boardPx * 0.015));
    const tilePx = Math.floor((boardPx - gap * (gridSize + 1)) / gridSize);
    const actualBoard = tilePx * gridSize + gap * (gridSize + 1);
    return { boardPx: actualBoard, tilePx, gap };
  }

  function render() {
    const { boardPx, tilePx, gap } = calcSizes();
    board.style.width = boardPx + 'px';
    board.style.height = boardPx + 'px';
    board.innerHTML = '';

    const fontSize = Math.floor(tilePx * 0.42);
    const total = gridSize * gridSize - 1;

    for (let i = 0; i < tiles.length; i++) {
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;
      const x = gap + col * (tilePx + gap);
      const y = gap + row * (tilePx + gap);

      if (tiles[i] === 0) {
        // empty slot visual
        const slot = document.createElement('div');
        slot.className = 'empty-slot';
        slot.style.width = tilePx + 'px';
        slot.style.height = tilePx + 'px';
        slot.style.left = x + 'px';
        slot.style.top = y + 'px';
        board.appendChild(slot);
        continue;
      }

      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.value = tiles[i];
      tile.dataset.index = i;
      tile.textContent = tiles[i];
      tile.style.width = tilePx + 'px';
      tile.style.height = tilePx + 'px';
      tile.style.left = x + 'px';
      tile.style.top = y + 'px';
      tile.style.fontSize = fontSize + 'px';

      const bg1 = tileColor(tiles[i], total);
      const bg2 = tileColorLight(tiles[i], total);
      tile.style.background = `linear-gradient(145deg, ${bg2}, ${bg1})`;

      tile.addEventListener('click', () => handleTileClick(i));
      board.appendChild(tile);
    }
  }

  function posFromIndex(idx) {
    const { tilePx, gap } = calcSizes();
    const row = Math.floor(idx / gridSize);
    const col = idx % gridSize;
    return {
      x: gap + col * (tilePx + gap),
      y: gap + row * (tilePx + gap)
    };
  }

  // Move tile at idx if adjacent to empty
  function handleTileClick(idx) {
    if (isCelebrating) return;
    if (tiles[idx] === 0) return;

    const eRow = Math.floor(emptyIdx / gridSize);
    const eCol = emptyIdx % gridSize;
    const tRow = Math.floor(idx / gridSize);
    const tCol = idx % gridSize;

    // Must be adjacent (manhattan distance 1)
    if (Math.abs(eRow - tRow) + Math.abs(eCol - tCol) !== 1) return;

    moveTile(idx);
  }

  function moveTile(idx) {
    // Swap in data
    tiles[emptyIdx] = tiles[idx];
    tiles[idx] = 0;

    // Animate: find the tile DOM element and move it
    const tileEl = board.querySelector(`.tile[data-index="${idx}"]`);
    if (tileEl) {
      const pos = posFromIndex(emptyIdx);
      tileEl.style.left = pos.x + 'px';
      tileEl.style.top = pos.y + 'px';
      tileEl.dataset.index = emptyIdx;

      // Move empty slot visual
      const slotEl = board.querySelector('.empty-slot');
      if (slotEl) {
        const slotPos = posFromIndex(idx);
        slotEl.style.left = slotPos.x + 'px';
        slotEl.style.top = slotPos.y + 'px';
      }
    }

    emptyIdx = idx;
    moveCount++;
    moveCountEl.textContent = moveCount;

    if (!isPlaying) {
      isPlaying = true;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 100);
    }

    if (checkWin()) {
      onWin();
    }
  }

  function checkWin() {
    for (let i = 0; i < tiles.length - 1; i++) {
      if (tiles[i] !== i + 1) return false;
    }
    return tiles[tiles.length - 1] === 0;
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = m + ':' + s;
  }

  function getElapsedStr() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    if (m > 0) return m + '分' + s + '秒';
    return s + '秒';
  }

  function onWin() {
    clearInterval(timerInterval);
    isPlaying = false;
    isCelebrating = true;

    // Celebrate tiles one by one
    const tileEls = Array.from(board.querySelectorAll('.tile'));
    tileEls.sort((a, b) => parseInt(a.dataset.value) - parseInt(b.dataset.value));
    tileEls.forEach((el, i) => {
      setTimeout(() => el.classList.add('celebrate'), i * 80);
    });

    // Confetti after tile animation
    setTimeout(() => {
      spawnConfetti();
    }, tileEls.length * 80 + 200);

    // Show modal
    setTimeout(() => {
      clearMovesEl.textContent = '手数: ' + moveCount;
      clearTimeEl.textContent = '時間: ' + getElapsedStr();
      overlay.classList.add('show');
      isCelebrating = false;
    }, tileEls.length * 80 + 800);
  }

  function spawnConfetti() {
    const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ff9f43','#00d2d3'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-10px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (6 + Math.random() * 8) + 'px';
        c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, i * 30);
    }
  }

  // Shuffle: start from solved state and make random legal moves
  function shuffle() {
    // Build solved state
    const total = gridSize * gridSize;
    tiles = [];
    for (let i = 1; i < total; i++) tiles.push(i);
    tiles.push(0);
    emptyIdx = total - 1;

    const moves = Math.max(100, gridSize * gridSize * 20);
    let lastDir = -1;

    for (let m = 0; m < moves; m++) {
      const eRow = Math.floor(emptyIdx / gridSize);
      const eCol = emptyIdx % gridSize;
      // Possible neighbors
      const neighbors = [];
      if (eRow > 0) neighbors.push({ idx: emptyIdx - gridSize, dir: 0 }); // up
      if (eRow < gridSize - 1) neighbors.push({ idx: emptyIdx + gridSize, dir: 1 }); // down
      if (eCol > 0) neighbors.push({ idx: emptyIdx - 1, dir: 2 }); // left
      if (eCol < gridSize - 1) neighbors.push({ idx: emptyIdx + 1, dir: 3 }); // right

      // Avoid undoing last move
      const opposite = [1, 0, 3, 2];
      const filtered = neighbors.filter(n => n.dir !== opposite[lastDir]);
      const pick = (filtered.length > 0 ? filtered : neighbors)[Math.floor(Math.random() * (filtered.length > 0 ? filtered : neighbors).length)];

      tiles[emptyIdx] = tiles[pick.idx];
      tiles[pick.idx] = 0;
      emptyIdx = pick.idx;
      lastDir = pick.dir;
    }

    // Make sure it's not already solved
    if (checkWin()) {
      // Do one more move
      const eRow = Math.floor(emptyIdx / gridSize);
      const eCol = emptyIdx % gridSize;
      let swapIdx = eCol > 0 ? emptyIdx - 1 : emptyIdx + 1;
      tiles[emptyIdx] = tiles[swapIdx];
      tiles[swapIdx] = 0;
      emptyIdx = swapIdx;
    }
  }

  function newGame() {
    clearInterval(timerInterval);
    overlay.classList.remove('show');
    isPlaying = false;
    isCelebrating = false;
    moveCount = 0;
    moveCountEl.textContent = '0';
    timerEl.textContent = '00:00';
    shuffle();
    render();
  }

  // Size buttons
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      gridSize = parseInt(btn.dataset.size);
      newGame();
    });
  });

  document.getElementById('shuffleBtn').addEventListener('click', newGame);
  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);

  // Swipe support
  let touchStartX = 0, touchStartY = 0;
  boardWrapper.addEventListener('touchstart', e => {
    if (isCelebrating) return;
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  boardWrapper.addEventListener('touchend', e => {
    if (isCelebrating) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return; // too short, let click handle it

    const eRow = Math.floor(emptyIdx / gridSize);
    const eCol = emptyIdx % gridSize;
    let targetIdx = -1;

    if (Math.abs(dx) > Math.abs(dy)) {
      // Horizontal swipe: tile slides in swipe direction, so we pick tile opposite
      if (dx > 0 && eCol > 0) {
        targetIdx = emptyIdx - 1; // tile to the left slides right
      } else if (dx < 0 && eCol < gridSize - 1) {
        targetIdx = emptyIdx + 1; // tile to the right slides left
      }
    } else {
      if (dy > 0 && eRow > 0) {
        targetIdx = emptyIdx - gridSize; // tile above slides down
      } else if (dy < 0 && eRow < gridSize - 1) {
        targetIdx = emptyIdx + gridSize; // tile below slides up
      }
    }

    if (targetIdx >= 0 && targetIdx < tiles.length && tiles[targetIdx] !== 0) {
      moveTile(targetIdx);
    }
  }, { passive: true });

  // Handle resize
  window.addEventListener('resize', () => {
    if (!isCelebrating) render();
  });

  // Init
  newGame();
})();
</script>
