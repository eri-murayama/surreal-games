<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K8QFB33PX7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K8QFB33PX7');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ねこカフェ物語 - シュールゲームス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <meta property="og:title" content="ねこカフェ物語 | シュールゲームス">
  <meta property="og:description" content="かわいいねこ店員とおしゃれカフェを経営しよう！お客さまに料理を提供してお店を大きく育てよう。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/surreal-games/games/neko-cafe/index.html">
  <meta property="og:image" content="https://eri-murayama.github.io/surreal-games/assets/images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/surreal-games/games/neko-cafe/">
  <meta name="twitter:site" content="@tadanosyuhuda">
  <link rel="stylesheet" href="../common/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen">
      <div class="title-deco">
        <div class="title-cat">🐱</div>
        <div class="title-cup">☕</div>
        <div class="title-cake">🍰</div>
      </div>
      <h1 class="game-title" data-i18n="gameTitle">ねこカフェ<br>物語</h1>
      <p class="game-sub" data-i18n="gameSub">～小さなお店を大きく育てよう～</p>
      <button id="start-btn" class="big-btn" data-i18n="startBtn">はじめる</button>
      <button id="continue-btn" class="big-btn hidden" data-i18n="continueBtn">つづきから</button>
      <button id="reset-btn" class="link-btn hidden" data-i18n="resetBtn">最初からやり直す</button>
    </div>

    <!-- メインゲーム画面 -->
    <div id="game-screen" class="screen hidden">

      <!-- 上部HUD -->
      <div id="hud">
        <div class="hud-item">
          <span class="hud-label">💰</span>
          <span class="hud-value" id="coins-display">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Lv.<span id="level-display">1</span></span>
          <div class="xp-bar-wrap">
            <div class="xp-bar" id="xp-bar"></div>
          </div>
        </div>
        <div class="hud-item">
          <span class="hud-label">Day</span>
          <span class="hud-value" id="day-display">1</span>
        </div>
      </div>

      <!-- 営業タイマー -->
      <div id="day-timer">
        <span class="timer-label" data-i18n="timerOpen">☀️ 営業中</span>
        <div class="day-timer-wrap">
          <div class="day-timer-fill" id="day-timer-fill"></div>
        </div>
      </div>

      <!-- カフェフロア -->
      <div id="cafe-area">
        <div id="cafe-bg">
          <div class="bg-window">☁️</div>
          <div class="bg-plant">🪴</div>
          <div class="bg-frame">🖼️</div>
        </div>
        <div id="tables-wrap"></div>
      </div>

      <!-- キッチン -->
      <div id="kitchen">
        <div class="kitchen-label" data-i18n="kitchenLabel">🍳 キッチン</div>
        <div id="stations-wrap"></div>
      </div>

      <!-- 下部アクションバー -->
      <div id="action-bar">
        <button class="act-btn" id="btn-shop">
          <span class="act-icon">🛒</span>
          <span class="act-label" data-i18n="shopBtn">ショップ</span>
        </button>
        <button class="act-btn" id="btn-menu">
          <span class="act-icon">📖</span>
          <span class="act-label" data-i18n="menuBtn">メニュー</span>
        </button>
        <button class="act-btn" id="btn-decor">
          <span class="act-icon">🌸</span>
          <span class="act-label" data-i18n="decorBtn">内装</span>
        </button>
        <button class="act-btn" id="btn-endday">
          <span class="act-icon">🌙</span>
          <span class="act-label" data-i18n="enddayBtn">早じまい</span>
        </button>
      </div>

      <!-- 情報メッセージ -->
      <div id="info-toast" class="hidden"></div>
    </div>

    <!-- ショップ画面 -->
    <div id="shop-screen" class="screen hidden">
      <div class="modal-head">
        <h2 data-i18n="shopTitle">🛒 ショップ</h2>
        <button class="close-btn" data-close>✕</button>
      </div>
      <div class="tab-row">
        <button class="tab-btn active" data-tab="menu" data-i18n="tabMenu">メニュー追加</button>
        <button class="tab-btn" data-tab="upgrade" data-i18n="tabUpgrade">お店強化</button>
      </div>
      <div id="shop-coins" class="shop-coins">💰 <span id="shop-coin-val">0</span></div>
      <div id="shop-list"></div>
    </div>

    <!-- メニュー閲覧画面 -->
    <div id="menu-screen" class="screen hidden">
      <div class="modal-head">
        <h2 data-i18n="menuTitle">📖 メニューブック</h2>
        <button class="close-btn" data-close>✕</button>
      </div>
      <div id="menu-list"></div>
    </div>

    <!-- 内装画面 -->
    <div id="decor-screen" class="screen hidden">
      <div class="modal-head">
        <h2 data-i18n="decorTitle">🌸 内装</h2>
        <button class="close-btn" data-close>✕</button>
      </div>
      <p class="modal-sub" data-i18n="decorSub">お店を飾って人気アップ！</p>
      <div id="shop-coins2" class="shop-coins">💰 <span id="shop-coin-val2">0</span></div>
      <div id="decor-list"></div>
    </div>

    <!-- 閉店リザルト -->
    <div id="result-screen" class="screen hidden">
      <div class="modal-head">
        <h2 data-i18n="resultTitle">🌙 本日のご来店ありがとうございました</h2>
      </div>
      <div class="result-stars" id="res-stars"></div>
      <div class="result-comment" id="res-comment"></div>
      <div id="result-body">
        <div class="result-row"><span data-i18n="resServed">接客したお客さま</span> <span id="res-served">0</span> <span data-i18n="resPeople">人</span></div>
        <div class="result-row"><span data-i18n="resSales">売上</span> 💰 <span id="res-coins">0</span></div>
        <div class="result-row"><span data-i18n="resXp">経験値</span> ✨ <span id="res-xp">0</span></div>
        <div class="result-row"><span data-i18n="resRep">評判</span> ⭐ <span id="res-rep">0</span></div>
      </div>
      <button id="next-day-btn" class="big-btn" data-i18n="nextDayBtn">次の日へ</button>
    </div>

  </div>

  <a href="../../index.html" class="back-to-top-link" data-i18n="backToTop">← トップに戻る</a>
  <script src="../common/i18n.js"></script>
  <script src="../common/game-common.js"></script>
  <script src="game.js"></script>
  <script>
    SurrealGames.init('neko-cafe');
  </script>
</body>
</html>
