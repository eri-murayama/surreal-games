<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えいごでGO!｜ゲロゲーロ学園</title>
  <meta name="description" content="英語の単語を楽しく学ぼう！子ども向け無料知育ゲーム">
  <meta property="og:title" content="えいごでGO!｜ゲロゲーロ学園">
  <meta property="og:description" content="英語の単語を楽しく学ぼう！子ども向け無料知育ゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/gerogero-gakuen/games/english-words/index.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/gerogero-gakuen/games/english-words/index.html">
  <script src="../../js/pwa-register.js" defer></script>
  <script src="../../js/game-upgrades.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="game-wrapper">

    <!-- ===== HEADER ===== -->
    <div class="game-header">
      <div class="header-bar">
        <a href="../../index.html" class="back-btn">◀ もどる</a>
        <div class="header-title">🔤 えいごでGO!</div>
        <div class="header-score" id="headerScore" style="display:none;">⭐ <span id="scoreNum">0</span></div>
      </div>
    </div>

    <!-- ===== START SCREEN ===== -->
    <div class="screen active" id="startScreen">
      <div class="start-mascot">🔤</div>
      <h1 class="start-title">えいごでGO!</h1>
      <p class="start-subtitle">えをみて えいごを えらぼう！</p>

      <div class="category-grid">
        <button class="category-btn" data-category="animals" onclick="startGame('animals')">
          <span class="cat-emoji">🐾</span>
          <span class="cat-name">どうぶつ</span>
          <span class="cat-sub">Animals</span>
        </button>
        <button class="category-btn" data-category="food" onclick="startGame('food')">
          <span class="cat-emoji">🍎</span>
          <span class="cat-name">たべもの</span>
          <span class="cat-sub">Food</span>
        </button>
        <button class="category-btn" data-category="colors" onclick="startGame('colors')">
          <span class="cat-emoji">🎨</span>
          <span class="cat-name">いろ</span>
          <span class="cat-sub">Colors</span>
        </button>
        <button class="category-btn all-btn" data-category="all" onclick="startGame('all')">
          <span class="cat-emoji">🌟</span>
          <span class="cat-name">ぜんぶ</span>
          <span class="cat-sub">All Mixed</span>
        </button>
      </div>
    </div>

    <!-- ===== QUIZ SCREEN ===== -->
    <div class="screen" id="quizScreen">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="roundLabel">1 / 10</span>
          <span class="streak-badge" id="streakBadge">🔥 <span id="streakNum">0</span>れんぞく!</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <div class="quiz-card" id="quizCard">
        <div class="question-emoji" id="questionEmoji">🐕</div>
        <div class="question-japanese" id="questionJapanese">いぬ</div>
        <p class="question-prompt">えいごで なんていう？</p>
        <div class="choices-grid" id="choicesGrid">
          <!-- filled by JS -->
        </div>
      </div>
    </div>

    <!-- ===== END SCREEN ===== -->
    <div class="screen" id="endScreen">
      <div class="end-card">
        <span class="end-mascot" id="endMascot">🎉</span>
        <h2 class="end-title" id="endTitle">よくできました！</h2>
        <div class="end-score" id="endScore">10 / 10</div>
        <div class="end-stars" id="endStars">⭐⭐⭐</div>
        <p class="end-message" id="endMessage">すごい！パーフェクト！</p>

        <div class="word-review" id="wordReview">
          <p class="word-review-title">📖 おぼえたことば</p>
          <div class="word-review-list" id="wordReviewList">
            <!-- filled by JS -->
          </div>
        </div>

        <div class="end-buttons">
          <button class="end-btn btn-retry" onclick="retryGame()">🔄 もういちど</button>
          <button class="end-btn btn-home" onclick="goHome()">🏠 カテゴリへ</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Feedback overlay -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-big" id="feedbackText"></div>
  </div>

  <script>
    // ===== WORD DATA =====
    const wordData = {
      animals: [
        { emoji: "🐕", japanese: "いぬ", english: "dog" },
        { emoji: "🐈", japanese: "ねこ", english: "cat" },
        { emoji: "🐦", japanese: "とり", english: "bird" },
        { emoji: "🐟", japanese: "さかな", english: "fish" },
        { emoji: "🐰", japanese: "うさぎ", english: "rabbit" },
        { emoji: "🐻", japanese: "くま", english: "bear" },
        { emoji: "🐘", japanese: "ぞう", english: "elephant" },
        { emoji: "🦁", japanese: "ライオン", english: "lion" },
        { emoji: "🐒", japanese: "さる", english: "monkey" },
        { emoji: "🐸", japanese: "かえる", english: "frog" },
        { emoji: "🐷", japanese: "ぶた", english: "pig" },
        { emoji: "🐴", japanese: "うま", english: "horse" },
        { emoji: "🐑", japanese: "ひつじ", english: "sheep" },
        { emoji: "🐭", japanese: "ねずみ", english: "mouse" },
        { emoji: "🐍", japanese: "へび", english: "snake" },
        { emoji: "🦊", japanese: "きつね", english: "fox" },
        { emoji: "🐢", japanese: "かめ", english: "turtle" },
        { emoji: "🐝", japanese: "はち", english: "bee" },
      ],
      food: [
        { emoji: "🍎", japanese: "りんご", english: "apple" },
        { emoji: "🍌", japanese: "バナナ", english: "banana" },
        { emoji: "🍊", japanese: "オレンジ", english: "orange" },
        { emoji: "🍚", japanese: "ごはん", english: "rice" },
        { emoji: "🍞", japanese: "パン", english: "bread" },
        { emoji: "🥛", japanese: "ぎゅうにゅう", english: "milk" },
        { emoji: "🥚", japanese: "たまご", english: "egg" },
        { emoji: "🎂", japanese: "ケーキ", english: "cake" },
        { emoji: "🍕", japanese: "ピザ", english: "pizza" },
        { emoji: "🍇", japanese: "ぶどう", english: "grape" },
        { emoji: "🍓", japanese: "いちご", english: "strawberry" },
        { emoji: "🍉", japanese: "すいか", english: "watermelon" },
        { emoji: "🍰", japanese: "パイ", english: "pie" },
        { emoji: "🧀", japanese: "チーズ", english: "cheese" },
        { emoji: "🌽", japanese: "とうもろこし", english: "corn" },
        { emoji: "🥕", japanese: "にんじん", english: "carrot" },
        { emoji: "🍅", japanese: "トマト", english: "tomato" },
        { emoji: "🍩", japanese: "ドーナツ", english: "donut" },
      ],
      colors: [
        { emoji: "🔴", japanese: "あか", english: "red" },
        { emoji: "🔵", japanese: "あお", english: "blue" },
        { emoji: "🟢", japanese: "みどり", english: "green" },
        { emoji: "🟡", japanese: "きいろ", english: "yellow" },
        { emoji: "🩷", japanese: "ピンク", english: "pink" },
        { emoji: "🟣", japanese: "むらさき", english: "purple" },
        { emoji: "🟠", japanese: "オレンジ", english: "orange" },
        { emoji: "⚪", japanese: "しろ", english: "white" },
        { emoji: "⚫", japanese: "くろ", english: "black" },
        { emoji: "🟤", japanese: "ちゃいろ", english: "brown" },
        { emoji: "🩶", japanese: "はいいろ", english: "gray" },
        { emoji: "🥇", japanese: "きん", english: "gold" },
        { emoji: "🥈", japanese: "ぎん", english: "silver" },
        { emoji: "🩵", japanese: "みずいろ", english: "sky blue" },
        { emoji: "🫒", japanese: "オリーブ", english: "olive" },
      ]
    };

    // ===== GAME STATE =====
    let currentCategory = '';
    let questions = [];
    let currentRound = 0;
    const TOTAL_ROUNDS = 10;
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let roundResults = []; // { word, correct: bool }
    let isAnswering = false;

    // ===== UTILITY =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getPool(category) {
      if (category === 'all') {
        return [...wordData.animals, ...wordData.food, ...wordData.colors];
      }
      return [...wordData[category]];
    }

    // ===== SPEECH =====
    function speakEnglish(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      utter.pitch = 1.1;
      window.speechSynthesis.speak(utter);
    }

    // ===== SPARKLE EFFECTS =====
    function spawnSparkles(x, y, count) {
      const emojis = ['✨', '⭐', '🌟', '💫'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const dist = 60 + Math.random() * 80;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        el.style.animationDelay = (Math.random() * 0.15) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    function spawnConfetti() {
      const colors = ['#42a5f5', '#ffd600', '#4caf50', '#ff7043', '#ab47bc', '#ef5350'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-10px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
        el.style.animationDelay = (Math.random() * 0.4) + 's';
        el.style.width = (6 + Math.random() * 6) + 'px';
        el.style.height = (6 + Math.random() * 6) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }
    }

    // ===== SCREEN MANAGEMENT =====
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ===== START GAME =====
    function startGame(category) {
      currentCategory = category;
      const pool = getPool(category);
      const shuffled = shuffle(pool);
      questions = shuffled.slice(0, TOTAL_ROUNDS);
      // If pool is smaller than TOTAL_ROUNDS, repeat some
      while (questions.length < TOTAL_ROUNDS) {
        const extra = shuffle(pool);
        questions.push(...extra.slice(0, TOTAL_ROUNDS - questions.length));
      }
      currentRound = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      roundResults = [];
      isAnswering = false;

      document.getElementById('scoreNum').textContent = '0';
      document.getElementById('headerScore').style.display = 'flex';
      showScreen('quizScreen');
      loadRound();
    }

    // ===== LOAD ROUND =====
    function loadRound() {
      if (currentRound >= TOTAL_ROUNDS) {
        showEndScreen();
        return;
      }

      isAnswering = false;
      const q = questions[currentRound];
      const pool = getPool(currentCategory);

      // Update progress
      document.getElementById('roundLabel').textContent = `${currentRound + 1} / ${TOTAL_ROUNDS}`;
      document.getElementById('progressFill').style.width = ((currentRound) / TOTAL_ROUNDS * 100) + '%';

      // Update streak badge
      const streakBadge = document.getElementById('streakBadge');
      if (streak >= 2) {
        streakBadge.classList.add('show');
        document.getElementById('streakNum').textContent = streak;
      } else {
        streakBadge.classList.remove('show');
      }

      // Set question
      const emojiEl = document.getElementById('questionEmoji');
      emojiEl.textContent = q.emoji;
      // Retrigger animation
      emojiEl.style.animation = 'none';
      emojiEl.offsetHeight; // force reflow
      emojiEl.style.animation = '';

      document.getElementById('questionJapanese').textContent = q.japanese;

      // Reset quiz card styling
      const card = document.getElementById('quizCard');
      card.classList.remove('correct-flash', 'wrong-flash');

      // Generate 4 choices (1 correct + 3 distractors)
      let distractors = pool.filter(w => w.english !== q.english);
      distractors = shuffle(distractors).slice(0, 3);
      let choices = shuffle([q, ...distractors]);

      const grid = document.getElementById('choicesGrid');
      grid.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.english;
        btn.dataset.english = c.english;
        btn.onclick = () => handleAnswer(btn, c.english, q.english);
        grid.appendChild(btn);
      });
    }

    // ===== HANDLE ANSWER =====
    function handleAnswer(btn, selected, correct) {
      if (isAnswering) return;
      isAnswering = true;

      const card = document.getElementById('quizCard');
      const allBtns = document.querySelectorAll('.choice-btn');
      const isCorrect = selected === correct;
      const q = questions[currentRound];

      // Disable all buttons
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        // Correct answer
        btn.classList.add('correct');
        card.classList.add('correct-flash');
        allBtns.forEach(b => { if (b !== btn) b.classList.add('dim'); });

        score++;
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        document.getElementById('scoreNum').textContent = score;

        // Speak the word
        speakEnglish(correct);

        // Sparkle at button position
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        spawnSparkles(cx, cy, streak >= 3 ? 16 : 8);

        // Streak bonus sparkles
        if (streak >= 3) {
          spawnConfetti();
        }

        // Show feedback
        showFeedback(true, q);

        roundResults.push({ word: q, correct: true });

        setTimeout(() => {
          hideFeedback();
          currentRound++;
          loadRound();
        }, 1800);

      } else {
        // Wrong answer
        btn.classList.add('wrong');
        card.classList.add('wrong-flash');
        streak = 0;

        // Highlight correct answer
        allBtns.forEach(b => {
          if (b.dataset.english === correct) {
            b.classList.add('correct');
          } else if (b !== btn) {
            b.classList.add('dim');
          }
        });

        // Speak the correct word anyway
        setTimeout(() => speakEnglish(correct), 400);

        showFeedback(false, q);

        roundResults.push({ word: q, correct: false });

        setTimeout(() => {
          hideFeedback();
          currentRound++;
          loadRound();
        }, 2200);
      }

      // Update streak badge
      const streakBadge = document.getElementById('streakBadge');
      if (streak >= 2) {
        streakBadge.classList.add('show');
        document.getElementById('streakNum').textContent = streak;
      } else {
        streakBadge.classList.remove('show');
      }
    }

    // ===== FEEDBACK =====
    function showFeedback(correct, q) {
      const overlay = document.getElementById('feedbackOverlay');
      const text = document.getElementById('feedbackText');

      if (correct) {
        text.className = 'feedback-big correct-text';
        text.innerHTML = `⭕ せいかい！<span class="english-reveal">${q.emoji} ${q.english}</span>`;
      } else {
        text.className = 'feedback-big wrong-text';
        text.innerHTML = `❌ ざんねん…<span class="english-reveal">こたえ: ${q.emoji} ${q.english}</span>`;
      }

      overlay.classList.add('show');
    }

    function hideFeedback() {
      document.getElementById('feedbackOverlay').classList.remove('show');
    }

    // ===== END SCREEN =====
    function showEndScreen() {
      document.getElementById('headerScore').style.display = 'none';
      document.getElementById('progressFill').style.width = '100%';

      showScreen('endScreen');

      // Stars
      let stars, mascot, title, message;
      if (score === TOTAL_ROUNDS) {
        stars = '⭐⭐⭐';
        mascot = '🏆';
        title = 'パーフェクト！';
        message = 'すごい！ぜんぶ せいかい！えいごの てんさい！';
        spawnConfetti();
        setTimeout(spawnConfetti, 500);
      } else if (score >= TOTAL_ROUNDS * 0.8) {
        stars = '⭐⭐⭐';
        mascot = '🎉';
        title = 'よくできました！';
        message = 'とっても じょうずだね！';
        spawnConfetti();
      } else if (score >= TOTAL_ROUNDS * 0.6) {
        stars = '⭐⭐';
        mascot = '😊';
        title = 'がんばったね！';
        message = 'もうすこしで パーフェクト！';
      } else if (score >= TOTAL_ROUNDS * 0.3) {
        stars = '⭐';
        mascot = '💪';
        title = 'おしい！';
        message = 'もういちど チャレンジしよう！';
      } else {
        stars = '☆';
        mascot = '📖';
        title = 'ドンマイ！';
        message = 'れんしゅうすれば できるよ！';
      }

      document.getElementById('endMascot').textContent = mascot;
      document.getElementById('endTitle').textContent = title;
      document.getElementById('endScore').textContent = `${score} / ${TOTAL_ROUNDS}`;
      document.getElementById('endStars').textContent = stars;
      document.getElementById('endMessage').textContent = message;

      // Word review list
      const list = document.getElementById('wordReviewList');
      list.innerHTML = '';
      roundResults.forEach(r => {
        const item = document.createElement('div');
        item.className = 'word-review-item' + (r.correct ? '' : ' missed');
        item.innerHTML = `
          <span class="wr-emoji">${r.word.emoji}</span>
          <span>
            <span class="wr-english">${r.word.english}</span><br>
            <span class="wr-japanese">${r.word.japanese}</span>
          </span>
        `;
        // Tap to hear pronunciation
        item.style.cursor = 'pointer';
        item.onclick = () => speakEnglish(r.word.english);
        list.appendChild(item);
      });

      geroShare('#endScreen', {
        gameTitle: 'えいごでGO!',
        resultText: 'ランク' + title,
        age: 'kid'
      });
    }

    // ===== RETRY & HOME =====
    function retryGame() {
      startGame(currentCategory);
    }

    function goHome() {
      document.getElementById('headerScore').style.display = 'none';
      showScreen('startScreen');
    }
  </script>
<script src="../../js/gero-utils.js"></script>
<script src="../../js/share-gate.js"></script>
</body>
</html>
