<script>
/* ============================================================
   脳トレ計算 - Game Logic
   ============================================================ */

// ===== Audio Context =====
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, type, duration, vol, startDelay) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + (startDelay || 0));
    gain.gain.setValueAtTime(0, ctx.currentTime + (startDelay || 0));
    gain.gain.linearRampToValueAtTime(vol || 0.18, ctx.currentTime + (startDelay || 0) + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (startDelay || 0) + duration);
    osc.start(ctx.currentTime + (startDelay || 0));
    osc.stop(ctx.currentTime + (startDelay || 0) + duration);
  } catch(e) {}
}

function sfxCorrect() {
  playTone(660, 'sine', 0.12, 0.18);
  playTone(880, 'sine', 0.18, 0.18, 0.08);
}

function sfxWrong() {
  playTone(220, 'sawtooth', 0.2, 0.15);
  playTone(180, 'sawtooth', 0.2, 0.12, 0.1);
}

function sfxCountdown() {
  playTone(440, 'triangle', 0.2, 0.2);
}

function sfxCountdownGo() {
  playTone(660, 'triangle', 0.12, 0.25);
  playTone(880, 'triangle', 0.2, 0.25, 0.1);
}

function sfxComplete() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => playTone(f, 'sine', 0.25, 0.2, i * 0.1));
}

function sfxCombo() {
  playTone(880, 'sine', 0.1, 0.14);
  playTone(1100, 'sine', 0.15, 0.14, 0.06);
}

// ===== State =====
const TOTAL_QUESTIONS = 20;
let difficulty = 'normal';
let questions = [];
let currentQ = 0;
let correctCount = 0;
let combo = 0;
let maxCombo = 0;
let timerInterval = null;
let startTime = 0;
let elapsedMs = 0;
let answerLocked = false;
let flashCount = 0;
let rushStreak = 0;
let questionStartedAt = 0;
let bestRecord = null;
let isNewBest = false;

const flashThresholds = {
  easy: 2200,
  normal: 2600,
  hard: 3200
};

function getBestKey(diff) {
  return 'gero-speed-calc-best-' + diff;
}

function loadBestRecord(diff) {
  try {
    const raw = localStorage.getItem(getBestKey(diff));
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function saveBestRecord(diff, record) {
  try {
    localStorage.setItem(getBestKey(diff), JSON.stringify(record));
  } catch (error) {
    // Ignore storage failures so the game remains playable.
  }
}

function rankValue(rank) {
  if (rank === 'S') return 4;
  if (rank === 'A') return 3;
  if (rank === 'B') return 2;
  return 1;
}

function isBetterRecord(record, currentBest) {
  if (!currentBest) return true;
  if (rankValue(record.rank) !== rankValue(currentBest.rank)) {
    return rankValue(record.rank) > rankValue(currentBest.rank);
  }
  if (record.accuracy !== currentBest.accuracy) {
    return record.accuracy > currentBest.accuracy;
  }
  return record.totalSec < currentBest.totalSec;
}

function formatBestRecord(record) {
  if (!record) return 'ベスト: まだないよ';
  return `ベスト ${record.rank} / ${record.totalSec.toFixed(1)}秒 / ${record.accuracy}%`;
}

// ===== Difficulty descriptions =====
const diffDescs = {
  easy:   '2桁の足し算・引き算（例: 34 + 27）',
  normal: '2桁の四則演算（＋ − ×）',
  hard:   '3桁または掛け算2桁×2桁'
};

// ===== Particles =====
function initParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const colors = ['#9b7cff', '#4ecca3', '#ff6b8a', '#ffd166', '#60a5fa'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:0;
      background:${colors[i % colors.length]};
      animation-duration:${5 + Math.random()*8}s;
      animation-delay:${-Math.random()*10}s;
    `;
    container.appendChild(p);
  }
}

// ===== Problem generation =====
function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateProblem() {
  const ops = {
    easy:   ['+', '-'],
    normal: ['+', '-', '×'],
    hard:   ['+', '-', '×']
  };
  const pool = ops[difficulty];
  const op = pool[rnd(0, pool.length - 1)];

  let a, b, answer;

  if (difficulty === 'easy') {
    a = rnd(10, 99);
    b = rnd(10, 99);
    if (op === '-') {
      if (a < b) [a, b] = [b, a];  // keep positive
    }
  } else if (difficulty === 'normal') {
    if (op === '×') {
      a = rnd(11, 29);
      b = rnd(3, 12);
    } else {
      a = rnd(20, 99);
      b = rnd(10, 99);
      if (op === '-' && a < b) [a, b] = [b, a];
    }
  } else { // hard
    if (op === '×') {
      a = rnd(12, 49);
      b = rnd(11, 29);
    } else {
      a = rnd(100, 499);
      b = rnd(100, 399);
      if (op === '-' && a < b) [a, b] = [b, a];
    }
  }

  if (op === '+') answer = a + b;
  else if (op === '-') answer = a - b;
  else answer = a * b;

  return { text: `${a} ${op} ${b}`, answer };
}

function generateChoices(correct) {
  const choices = [correct];
  const spread = Math.max(4, Math.floor(Math.abs(correct) * 0.15) + 3);

  const attempts = [];
  while (choices.length < 4) {
    let wrong;
    const strategy = rnd(0, 2);
    if (strategy === 0) {
      wrong = correct + rnd(-spread, spread);
    } else if (strategy === 1) {
      wrong = correct + (rnd(0,1) === 0 ? -1 : 1) * rnd(1, Math.max(2, Math.floor(Math.abs(correct) * 0.08) + 1));
    } else {
      wrong = correct + (rnd(0,1) === 0 ? -1 : 1) * rnd(spread + 1, spread * 3);
    }
    if (wrong !== correct && wrong > 0 && !choices.includes(wrong)) {
      choices.push(wrong);
    }
    attempts.push(1);
    if (attempts.length > 60) {
      // fallback: just offset
      let fb = correct + choices.length * (rnd(0,1) === 0 ? -1 : 1) * (spread + choices.length);
      while (choices.includes(fb) || fb <= 0) fb += 1;
      choices.push(fb);
    }
  }

  // Fisher-Yates shuffle
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  return choices;
}

function buildQuestions() {
  questions = [];
  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const prob = generateProblem();
    const choices = generateChoices(prob.answer);
    const correctIdx = choices.indexOf(prob.answer);
    questions.push({ ...prob, choices, correctIdx });
  }
}

// ===== Difficulty select =====
function selectDiff(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.diff === d);
  });
  document.getElementById('diffDesc').textContent = diffDescs[d];
  bestRecord = loadBestRecord(d);
  document.getElementById('bestRecordText').textContent = formatBestRecord(bestRecord);
}

// ===== Countdown =====
function startCountdown() {
  const overlay = document.getElementById('countdownOverlay');
  const num = document.getElementById('countdownNumber');
  overlay.classList.remove('hidden');

  let count = 3;
  num.textContent = count;
  sfxCountdown();

  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      num.textContent = count;
      // re-trigger animation
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = '';
      sfxCountdown();
    } else {
      num.textContent = 'GO！';
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = '';
      sfxCountdownGo();
      clearInterval(interval);
      setTimeout(() => {
        overlay.classList.add('hidden');
        startGame();
      }, 700);
    }
  }, 800);
}

// ===== Game start =====
function startGame() {
  buildQuestions();
  currentQ = 0;
  correctCount = 0;
  combo = 0;
  maxCombo = 0;
  elapsedMs = 0;
  answerLocked = false;
  flashCount = 0;
  rushStreak = 0;
  bestRecord = loadBestRecord(difficulty);
  isNewBest = false;

  showScreen('gameScreen');
  document.querySelector('.game-container').classList.remove('rush-mode');

  startTime = performance.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 100);

  updateChallengeHUD(0, 0);
  loadQuestion();
}

function updateTimer() {
  elapsedMs = performance.now() - startTime;
  document.getElementById('timerDisplay').textContent = (elapsedMs / 1000).toFixed(1);
}

function loadQuestion() {
  answerLocked = false;
  const q = questions[currentQ];
  questionStartedAt = performance.now();

  // Update HUD
  document.getElementById('questionCounter').textContent = `${currentQ + 1} / ${TOTAL_QUESTIONS}`;
  document.getElementById('progressBar').style.width = `${(currentQ / TOTAL_QUESTIONS) * 100}%`;
  updateChallengeHUD(currentQ, performance.now() - startTime);

  // Problem
  const pt = document.getElementById('problemText');
  pt.textContent = q.text;
  pt.classList.remove('flash');
  void pt.offsetWidth;
  pt.classList.add('flash');

  // Choices
  const btns = ['choiceA', 'choiceB', 'choiceC', 'choiceD'];
  btns.forEach((id, i) => {
    const btn = document.getElementById(id);
    btn.textContent = q.choices[i];
    btn.className = 'choice-btn';
    btn.disabled = false;
  });
}

// ===== Answer check =====
function checkAnswer(idx) {
  if (answerLocked) return;
  answerLocked = true;

  const q = questions[currentQ];
  const btns = ['choiceA', 'choiceB', 'choiceC', 'choiceD'];
  const responseMs = performance.now() - questionStartedAt;
  btns.forEach(id => document.getElementById(id).disabled = true);

  if (idx === q.correctIdx) {
    // Correct
    document.getElementById(btns[idx]).classList.add('correct');
    correctCount++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const isFlash = responseMs <= flashThresholds[difficulty];
    if (isFlash) {
      flashCount++;
      rushStreak++;
    } else {
      rushStreak = 0;
    }
    updateComboHUD();
    updateChallengeHUD(currentQ + 1, performance.now() - startTime);
    showFeedback('correct', { isFlash, responseMs, rushStreak });
    if (combo >= 3 || rushStreak >= 2) sfxCombo();
    else sfxCorrect();
  } else {
    // Wrong — show correct in green, wrong in red
    document.getElementById(btns[idx]).classList.add('wrong');
    document.getElementById(btns[q.correctIdx]).classList.add('correct');
    combo = 0;
    rushStreak = 0;
    updateComboHUD();
    updateChallengeHUD(currentQ + 1, performance.now() - startTime);
    showFeedback('wrong');
    sfxWrong();
  }

  setTimeout(nextQuestion, 550);
}

function updateComboHUD() {
  document.getElementById('comboDisplay').childNodes[0].nodeValue = combo + ' ';
  const badge = document.getElementById('comboBadge');
  badge.classList.toggle('visible', combo >= 3);
}

function updateChallengeHUD(answeredCount, elapsedSoFarMs) {
  const flashPill = document.getElementById('flashPill');
  const pacePill = document.getElementById('pacePill');
  flashPill.textContent = `FLASH ${flashCount}`;
  flashPill.classList.toggle('hot', rushStreak >= 2);

  if (answeredCount > 0) {
    const projectedSec = (elapsedSoFarMs / answeredCount) * TOTAL_QUESTIONS / 1000;
    pacePill.textContent = `PACE ${projectedSec.toFixed(1)}s`;
    pacePill.classList.toggle('good', !!bestRecord && projectedSec <= bestRecord.totalSec);
  } else if (bestRecord) {
    pacePill.textContent = `BEST ${bestRecord.totalSec.toFixed(1)}s`;
    pacePill.classList.add('good');
  } else {
    pacePill.textContent = 'PACE --';
    pacePill.classList.remove('good');
  }

  document.querySelector('.game-container').classList.toggle('rush-mode', rushStreak >= 3);
}

function showFeedback(type, detail) {
  const el = document.getElementById('feedbackOverlay');
  el.className = 'feedback-overlay';
  void el.offsetWidth;
  if (type === 'correct') {
    const msgs = ['正解！', 'その調子！', 'ナイス！', 'パーフェクト！'];
    if (detail && detail.isFlash) {
      el.textContent = detail.rushStreak >= 3
        ? `⚡ RUSH x${detail.rushStreak}`
        : `⚡ FLASH ${(detail.responseMs / 1000).toFixed(1)}s`;
    } else {
      el.textContent = combo >= 5 ? `🔥 ${combo}連続！` : msgs[Math.floor(Math.random() * msgs.length)];
    }
    el.classList.add('show-correct');
  } else {
    const msgs = ['不正解…', 'ざんねん！', 'もう一息！'];
    el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    el.classList.add('show-wrong');
  }
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= TOTAL_QUESTIONS) {
    endGame();
  } else {
    loadQuestion();
  }
}

// ===== Game end =====
function endGame() {
  clearInterval(timerInterval);
  const totalMs = performance.now() - startTime;
  elapsedMs = totalMs;

  sfxComplete();

  const totalSec = totalMs / 1000;
  const accuracy = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
  const avgSec = totalSec / TOTAL_QUESTIONS;

  // Rank calculation: based on accuracy + speed
  // S: >=95% accuracy AND avgTime <= 4s
  // A: >=80% accuracy AND avgTime <= 6s
  // B: >=60% accuracy
  // C: otherwise
  let rank, rankClass;
  if (accuracy >= 95 && avgSec <= 4) {
    rank = 'S'; rankClass = 'rank-S';
  } else if (accuracy >= 80 && avgSec <= 6) {
    rank = 'A'; rankClass = 'rank-A';
  } else if (accuracy >= 60) {
    rank = 'B'; rankClass = 'rank-B';
  } else {
    rank = 'C'; rankClass = 'rank-C';
  }

  const previousBest = bestRecord;
  const record = {
    rank,
    accuracy,
    totalSec,
    avgSec,
    maxCombo,
    flashCount
  };
  if (isBetterRecord(record, previousBest)) {
    bestRecord = record;
    isNewBest = true;
    saveBestRecord(difficulty, record);
  }

  // Populate result
  document.getElementById('resultTime').innerHTML = `${totalSec.toFixed(1)}<span class="stat-unit">秒</span>`;
  document.getElementById('resultAccuracy').innerHTML = `${accuracy}<span class="stat-unit">%</span>`;
  document.getElementById('resultAvg').innerHTML = `${avgSec.toFixed(1)}<span class="stat-unit">秒</span>`;
  document.getElementById('resultCombo').innerHTML = `${maxCombo}<span class="stat-unit">連続</span>`;
  document.getElementById('resultFlash').innerHTML = `${flashCount}<span class="stat-unit">回</span>`;
  document.getElementById('resultBest').innerHTML = bestRecord
    ? `${bestRecord.totalSec.toFixed(1)}<span class="stat-unit">秒</span>`
    : '--';

  const rankEl = document.getElementById('rankDisplay');
  rankEl.textContent = rank;
  rankEl.className = `rank-display ${rankClass}`;

  const resultRecordText = document.getElementById('resultRecordText');
  if (isNewBest) {
    resultRecordText.textContent = 'NEW BEST! さいこうきろく こうしん';
    resultRecordText.classList.remove('hidden');
  } else if (previousBest) {
    const diff = Math.max(totalSec - previousBest.totalSec, 0);
    resultRecordText.textContent = `ベストまで あと ${diff.toFixed(1)}秒`;
    resultRecordText.classList.remove('hidden');
  } else {
    resultRecordText.classList.add('hidden');
  }
  document.getElementById('bestRecordText').textContent = formatBestRecord(bestRecord);

  setTimeout(() => showScreen('resultScreen'), 300);

  geroShare('#resultScreen', {
    gameTitle: '脳トレ計算',
    resultText: 'ランク' + rank,
    age: 'adult'
  });
}

// ===== Replay =====
function replayGame() {
  document.querySelector('.game-container').classList.remove('rush-mode');
  showScreen('titleScreen');
}

// ===== Screen management =====
function showScreen(id) {
  ['titleScreen', 'gameScreen', 'resultScreen'].forEach(sid => {
    document.getElementById(sid).classList.toggle('hidden', sid !== id);
  });
  // Show back btn only on title/result, hide on game (to avoid misclick)
  document.getElementById('backBtn').style.opacity = (id === 'gameScreen') ? '0.35' : '1';
  document.getElementById('backBtn').style.pointerEvents = (id === 'gameScreen') ? 'none' : 'auto';
  if (id !== 'gameScreen') {
    document.querySelector('.game-container').classList.remove('rush-mode');
  }
}

// ===== Init =====
initParticles();
selectDiff('normal');
</script>
