<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字クイズ｜ゲロゲーロ学園</title>
  <meta name="description" content="漢字の読み方をクイズで学ぼう！小学生向け無料知育ゲーム">
  <meta property="og:title" content="漢字クイズ｜ゲロゲーロ学園">
  <meta property="og:description" content="漢字の読み方をクイズで学ぼう！小学生向け無料知育ゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/gerogero-gakuen/games/kanji-quiz/index.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/gerogero-gakuen/games/kanji-quiz/index.html">
  <script src="../../js/pwa-register.js" defer></script>
  <script src="../../js/game-upgrades.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="game-container">
      <!-- Floating decorations -->
      <span class="deco">📖</span>
      <span class="deco">✏️</span>
      <span class="deco">🌟</span>
      <span class="deco">🎌</span>
      <span class="deco">🍀</span>
      <span class="deco">🔤</span>

      <!-- Back button -->
      <a href="../../index.html" class="back-btn" aria-label="もどる">🐸 もどる</a>

      <!-- Confetti layer -->
      <div class="confetti-wrap" id="confettiWrap"></div>

      <!-- Feedback overlay -->
      <div class="feedback-overlay" id="feedbackOverlay">
        <span class="feedback-text" id="feedbackText"></span>
      </div>

      <!-- ====== TITLE SCREEN ====== -->
      <div class="screen" id="titleScreen">
        <span class="title-mascot">🐸</span>
        <div class="title-label">漢字クイズ</div>
        <div class="title-sub">かんじのよみかたをえらぼう！</div>
        <button class="play-btn" id="playBtn">あそぶ</button>
      </div>

      <!-- ====== GAME SCREEN ====== -->
      <div class="screen hidden" id="gameScreen">
        <div class="game-header">
          <div class="question-counter" id="questionCounter">1 / 10</div>
          <div class="score-display" id="scoreDisplay">⭐ 0</div>
        </div>
        <div class="timer-wrap">
          <div class="timer-bar" id="timerBar"></div>
        </div>
        <div class="kanji-card">
          <div class="kanji-char" id="kanjiChar">山</div>
          <div class="grade-badge" id="gradeBadge">小学1年生</div>
        </div>
        <div class="answers-grid" id="answersGrid">
          <!-- Dynamically filled -->
        </div>
      </div>

      <!-- ====== RESULT SCREEN ====== -->
      <div class="screen hidden" id="resultScreen">
        <div class="result-title">けっか発表！</div>
        <div class="result-rank" id="resultRank">S</div>
        <div class="result-score" id="resultScore">10 / 10もん せいかい！</div>
        <div class="result-msg" id="resultMsg">すごい！ぜんもんせいかい！<br>かんじはかせだ！</div>
        <div class="result-buttons">
          <button class="replay-btn" id="replayBtn">もういちど</button>
          <a href="../../index.html" class="home-link">🏠 ゲームいちらんへ</a>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    /* ===================================================
       QUESTION BANK  (30+ questions, grades 1-3)
    =================================================== */
    const QUESTIONS = [
      // --- Grade 1 ---
      { kanji: '山', correct: 'やま',   options: ['やま','かわ','うみ','そら'],   grade: 1 },
      { kanji: '川', correct: 'かわ',   options: ['かわ','はな','やま','いけ'],   grade: 1 },
      { kanji: '火', correct: 'ひ',     options: ['ひ','みず','かぜ','つち'],     grade: 1 },
      { kanji: '水', correct: 'みず',   options: ['みず','ひ','き','つち'],       grade: 1 },
      { kanji: '木', correct: 'き',     options: ['き','はな','くさ','いし'],     grade: 1 },
      { kanji: '花', correct: 'はな',   options: ['はな','き','くさ','みき'],     grade: 1 },
      { kanji: '犬', correct: 'いぬ',   options: ['いぬ','ねこ','とり','さかな'], grade: 1 },
      { kanji: '空', correct: 'そら',   options: ['そら','うみ','やま','かわ'],   grade: 1 },
      { kanji: '日', correct: 'ひ',     options: ['ひ','つき','ほし','くも'],     grade: 1 },
      { kanji: '月', correct: 'つき',   options: ['つき','ひ','ほし','かぜ'],     grade: 1 },
      { kanji: '人', correct: 'ひと',   options: ['ひと','こ','おとこ','おんな'], grade: 1 },
      { kanji: '子', correct: 'こ',     options: ['こ','おや','ひと','ちち'],     grade: 1 },
      { kanji: '手', correct: 'て',     options: ['て','あし','め','みみ'],       grade: 1 },
      { kanji: '目', correct: 'め',     options: ['め','て','はな','くち'],       grade: 1 },
      { kanji: '耳', correct: 'みみ',   options: ['みみ','め','て','くち'],       grade: 1 },

      // --- Grade 2 ---
      { kanji: '海', correct: 'うみ',   options: ['うみ','やま','かわ','みずうみ'], grade: 2 },
      { kanji: '星', correct: 'ほし',   options: ['ほし','つき','ひ','くも'],       grade: 2 },
      { kanji: '魚', correct: 'さかな', options: ['さかな','とり','むし','いぬ'],   grade: 2 },
      { kanji: '鳥', correct: 'とり',   options: ['とり','さかな','むし','うさぎ'], grade: 2 },
      { kanji: '虫', correct: 'むし',   options: ['むし','とり','さかな','はな'],   grade: 2 },
      { kanji: '草', correct: 'くさ',   options: ['くさ','き','はな','みき'],       grade: 2 },
      { kanji: '雨', correct: 'あめ',   options: ['あめ','ゆき','かぜ','くも'],     grade: 2 },
      { kanji: '雪', correct: 'ゆき',   options: ['ゆき','あめ','こおり','かぜ'],   grade: 2 },
      { kanji: '風', correct: 'かぜ',   options: ['かぜ','くも','あめ','ゆき'],     grade: 2 },
      { kanji: '石', correct: 'いし',   options: ['いし','つち','すな','みず'],     grade: 2 },

      // --- Grade 3 ---
      { kanji: '島', correct: 'しま',   options: ['しま','うみ','はま','みなと'],   grade: 3 },
      { kanji: '池', correct: 'いけ',   options: ['いけ','かわ','うみ','ぬま'],     grade: 3 },
      { kanji: '谷', correct: 'たに',   options: ['たに','やま','おか','もり'],     grade: 3 },
      { kanji: '森', correct: 'もり',   options: ['もり','はやし','き','くさ'],     grade: 3 },
      { kanji: '林', correct: 'はやし', options: ['はやし','もり','き','くさ'],     grade: 3 },
      { kanji: '岩', correct: 'いわ',   options: ['いわ','いし','つち','すな'],     grade: 3 },
      { kanji: '波', correct: 'なみ',   options: ['なみ','みず','かわ','うみ'],     grade: 3 },
      { kanji: '橋', correct: 'はし',   options: ['はし','みち','かわ','みなと'],   grade: 3 },
    ];

    const ROUND_SIZE = 10;
    const TIMER_MAX = 15;
    const GRADE_LABELS = { 1: '小学1年生', 2: '小学2年生', 3: '小学3年生' };

    /* ===================================================
       AUDIO  (Web Audio API synthesized)
    =================================================== */
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone(frequency, type, duration, gainVal = 0.35, startTime = 0) {
      try {
        const ctx = getAudioCtx();
        const t = ctx.currentTime + startTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.start(t);
        osc.stop(t + duration + 0.05);
      } catch (_) {}
    }

    function sfxCorrect() {
      playTone(523.25, 'sine', 0.12, 0.3, 0);
      playTone(659.25, 'sine', 0.12, 0.3, 0.1);
      playTone(783.99, 'sine', 0.2, 0.35, 0.2);
    }

    function sfxWrong() {
      playTone(220, 'sawtooth', 0.08, 0.25, 0);
      playTone(180, 'sawtooth', 0.12, 0.25, 0.07);
    }

    function sfxTick() {
      playTone(880, 'square', 0.04, 0.08, 0);
    }

    function sfxTimeUp() {
      playTone(300, 'sawtooth', 0.06, 0.2, 0);
      playTone(250, 'sawtooth', 0.06, 0.2, 0.08);
      playTone(200, 'sawtooth', 0.1,  0.2, 0.16);
    }

    function sfxCelebration() {
      const melody = [523.25, 659.25, 783.99, 1046.5, 987.77, 880, 1046.5];
      melody.forEach((f, i) => playTone(f, 'sine', 0.18, 0.3, i * 0.12));
    }

    /* ===================================================
       STATE
    =================================================== */
    let roundQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = TIMER_MAX;
    let answered = false;

    /* ===================================================
       DOM
    =================================================== */
    const titleScreen     = document.getElementById('titleScreen');
    const gameScreen      = document.getElementById('gameScreen');
    const resultScreen    = document.getElementById('resultScreen');
    const playBtn         = document.getElementById('playBtn');
    const replayBtn       = document.getElementById('replayBtn');
    const questionCounter = document.getElementById('questionCounter');
    const scoreDisplay    = document.getElementById('scoreDisplay');
    const timerBar        = document.getElementById('timerBar');
    const kanjiChar       = document.getElementById('kanjiChar');
    const gradeBadge      = document.getElementById('gradeBadge');
    const answersGrid     = document.getElementById('answersGrid');
    const resultRank      = document.getElementById('resultRank');
    const resultScore     = document.getElementById('resultScore');
    const resultMsg       = document.getElementById('resultMsg');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    const feedbackText    = document.getElementById('feedbackText');
    const confettiWrap    = document.getElementById('confettiWrap');

    /* ===================================================
       SCREEN TRANSITIONS
    =================================================== */
    function showScreen(el) {
      [titleScreen, gameScreen, resultScreen].forEach(s => {
        if (s === el) {
          s.classList.remove('hidden');
        } else {
          s.classList.add('hidden');
        }
      });
    }

    /* ===================================================
       SHUFFLE
    =================================================== */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ===================================================
       GAME LOGIC
    =================================================== */
    function startGame() {
      roundQuestions = shuffle(QUESTIONS).slice(0, ROUND_SIZE);
      currentIndex = 0;
      score = 0;
      showScreen(gameScreen);
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      const q = roundQuestions[currentIndex];

      // Update counter & score
      questionCounter.textContent = `${currentIndex + 1} / ${ROUND_SIZE}`;
      scoreDisplay.textContent = `⭐ ${score}`;

      // Kanji display with pop animation
      kanjiChar.classList.remove('pop');
      void kanjiChar.offsetWidth; // reflow
      kanjiChar.textContent = q.kanji;
      kanjiChar.classList.add('pop');
      gradeBadge.textContent = GRADE_LABELS[q.grade];

      // Shuffle answer options
      const shuffledOptions = shuffle(q.options);

      // Build answer buttons
      answersGrid.innerHTML = '';
      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleAnswer(btn, opt, q.correct));
        answersGrid.appendChild(btn);
      });

      // Start timer
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIMER_MAX;
      updateTimerBar();
      let lastSecond = TIMER_MAX;

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;

        // Tick sound on each whole second under 5 seconds
        const curSecond = Math.ceil(timeLeft);
        if (curSecond !== lastSecond && curSecond <= 5 && curSecond > 0) {
          sfxTick();
        }
        lastSecond = curSecond;

        updateTimerBar();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timeUp();
        }
      }, 100);
    }

    function updateTimerBar() {
      const pct = Math.max(0, (timeLeft / TIMER_MAX)) * 100;
      timerBar.style.width = pct + '%';
      if (pct < 35) {
        timerBar.classList.add('warning');
      } else {
        timerBar.classList.remove('warning');
      }
    }

    function timeUp() {
      if (answered) return;
      answered = true;
      sfxTimeUp();
      // Show correct answer
      const q = roundQuestions[currentIndex];
      const buttons = answersGrid.querySelectorAll('.answer-btn');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correct) {
          btn.classList.add('correct');
        }
      });
      showFeedback('時間切れ！', false);
      scheduleNext();
    }

    function handleAnswer(btn, chosen, correct) {
      if (answered) return;
      answered = true;
      clearInterval(timerInterval);

      // Disable all buttons
      const buttons = answersGrid.querySelectorAll('.answer-btn');
      buttons.forEach(b => b.disabled = true);

      if (chosen === correct) {
        btn.classList.add('correct');
        score++;
        sfxCorrect();
        showFeedback('せいかい！', true);
      } else {
        btn.classList.add('wrong');
        // Highlight correct
        buttons.forEach(b => {
          if (b.textContent === correct) b.classList.add('correct');
        });
        sfxWrong();
        showFeedback('ざんねん…', false);
      }

      scoreDisplay.textContent = `⭐ ${score}`;
      scheduleNext();
    }

    function showFeedback(msg, isCorrect) {
      feedbackText.textContent = msg;
      feedbackText.className = 'feedback-text ' + (isCorrect ? 'correct' : 'wrong');
      feedbackOverlay.classList.add('show');
      setTimeout(() => feedbackOverlay.classList.remove('show'), 700);
    }

    function scheduleNext() {
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= ROUND_SIZE) {
          showResult();
        } else {
          loadQuestion();
        }
      }, 1000);
    }

    /* ===================================================
       RESULT
    =================================================== */
    function showResult() {
      showScreen(resultScreen);

      const pct = score / ROUND_SIZE;
      let rank, rankClass, msg;

      if (pct === 1) {
        rank = 'S'; rankClass = 'rank-s';
        msg = 'すごい！ぜんもんせいかい！\nかんじはかせだ！';
      } else if (pct >= 0.8) {
        rank = 'A'; rankClass = 'rank-a';
        msg = 'とってもよくできました！\nあともうすこしでぜんもんせいかい！';
      } else if (pct >= 0.6) {
        rank = 'B'; rankClass = 'rank-b';
        msg = 'よくできました！\nもっとれんしゅうしてみよう！';
      } else {
        rank = 'C'; rankClass = 'rank-c';
        msg = 'ファイト！\nまたちょうせんしてみよう！';
      }

      resultRank.textContent = rank;
      resultRank.className = 'result-rank ' + rankClass;
      resultScore.textContent = `${score} / ${ROUND_SIZE} もん せいかい！`;
      resultMsg.innerHTML = msg.replace('\n', '<br>');

      // Trigger rank animation by re-adding the element
      void resultRank.offsetWidth;

      if (pct >= 0.8) {
        sfxCelebration();
        spawnConfetti();
      }

      geroShare('#resultScreen', {
        gameTitle: '漢字クイズ',
        resultText: 'ランク' + rank,
        age: 'kid'
      });
    }

    /* ===================================================
       CONFETTI
    =================================================== */
    function spawnConfetti() {
      confettiWrap.innerHTML = '';
      const colors = ['#ff6f00','#ffd54f','#66bb6a','#42a5f5','#ec407a','#ab47bc','#26c6da'];
      for (let i = 0; i < 55; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (8 + Math.random() * 8) + 'px';
        el.style.height = (10 + Math.random() * 10) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
        const duration = 1.8 + Math.random() * 2.2;
        const delay = Math.random() * 1.5;
        el.style.animation = `confettiFall ${duration}s ${delay}s linear forwards`;
        confettiWrap.appendChild(el);
      }
    }

    /* ===================================================
       EVENT LISTENERS
    =================================================== */
    playBtn.addEventListener('click', () => {
      try { getAudioCtx().resume(); } catch (_) {}
      startGame();
    });

    replayBtn.addEventListener('click', () => {
      confettiWrap.innerHTML = '';
      startGame();
    });

    // Start on title screen
    showScreen(titleScreen);
  })();
  </script>
<script src="../../js/gero-utils.js"></script>
<script src="../../js/share-gate.js"></script>
</body>
</html>
