<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おとであそぼ｜ゲロゲーロ学園</title>
  <meta name="description" content="楽器をタッチして音を鳴らそう！赤ちゃんから遊べる無料知育ゲーム">
  <meta property="og:title" content="おとであそぼ｜ゲロゲーロ学園">
  <meta property="og:description" content="楽器をタッチして音を鳴らそう！赤ちゃんから遊べる無料知育ゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/gerogero-gakuen/games/music-maker/index.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/gerogero-gakuen/games/music-maker/index.html">
  <meta name="baby-game" content="true">
  <script src="../../js/baby-launcher.js" defer></script>
  <script src="../../js/pwa-register.js" defer></script>
  <script src="../../js/game-upgrades.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="music-app">
    <!-- Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="piano" aria-label="ピアノ">
        <span>🎹</span>
        <span class="mode-label">ピアノ</span>
      </button>
      <button class="mode-btn" data-mode="drums" aria-label="たいこ">
        <span>🥁</span>
        <span class="mode-label">たいこ</span>
      </button>
      <button class="mode-btn" data-mode="forest" aria-label="もりのおと">
        <span>🌳</span>
        <span class="mode-label">もりのおと</span>
      </button>
    </div>

    <!-- Play Area -->
    <div class="play-area">
      <!-- Piano Mode -->
      <div class="mode-panel piano-panel active" id="panel-piano">
        <div class="piano-key" data-note="C4"><span class="key-label">ど</span></div>
        <div class="piano-key" data-note="D4"><span class="key-label">れ</span></div>
        <div class="piano-key" data-note="E4"><span class="key-label">み</span></div>
        <div class="piano-key" data-note="F4"><span class="key-label">ふぁ</span></div>
        <div class="piano-key" data-note="G4"><span class="key-label">そ</span></div>
        <div class="piano-key" data-note="A4"><span class="key-label">ら</span></div>
        <div class="piano-key" data-note="B4"><span class="key-label">し</span></div>
        <div class="piano-key" data-note="C5"><span class="key-label">ど</span></div>
      </div>

      <!-- Drums Mode -->
      <div class="mode-panel drum-panel" id="panel-drums">
        <div class="drum-pad red" data-drum="low">どん</div>
        <div class="drum-pad blue" data-drum="mid">ぽん</div>
        <div class="drum-pad yellow" data-drum="high">しゃん</div>
        <div class="drum-pad green" data-drum="click">たっ</div>
      </div>

      <!-- Forest Mode -->
      <div class="mode-panel forest-panel" id="panel-forest">
        <div class="forest-element idle" data-sound="tree" style="left:12%;top:25%;">🌳<span class="element-label">き</span></div>
        <div class="forest-element idle" data-sound="bird" style="right:18%;top:12%;">🐦<span class="element-label">とり</span></div>
        <div class="forest-element idle" data-sound="water" style="left:50%;top:55%;">💧<span class="element-label">みず</span></div>
        <div class="forest-element idle" data-sound="frog" style="left:22%;bottom:18%;">🐸<span class="element-label">かえる</span></div>
        <div class="forest-element idle" data-sound="flower" style="right:25%;bottom:22%;">🌸<span class="element-label">はな</span></div>
        <div class="forest-element idle" data-sound="cloud" style="left:42%;top:5%;">☁️<span class="element-label">くも</span></div>
      </div>
    </div>
  </div>

  <!-- Parent Exit -->
  <button class="parent-exit" id="parentExit" aria-label="おやよう">🐸</button>

  <!-- Back Overlay -->
  <div class="back-overlay" id="backOverlay">
    <div class="back-card">
      <p>おわりにする？</p>
      <a href="../../index.html">うん</a>
      <button onclick="document.getElementById('backOverlay').classList.remove('show')">まだあそぶ</button>
    </div>
  </div>

  <script src="../../js/gero-utils.js"></script>
  <script src="../../js/audio.js"></script>
  <script>
    /* ============================================
       おとであそぼ - Music Maker Game
       ============================================ */

    // Initialize audio on first interaction
    let audioReady = false;
    function ensureAudio() {
      if (!audioReady) {
        geroAudio.init();
        geroAudio.resume();
        audioReady = true;
      }
    }

    // ===== MODE SWITCHING =====
    const modeBtns = document.querySelectorAll('.mode-btn');
    const panels = document.querySelectorAll('.mode-panel');

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        ensureAudio();
        geroAudio.playPop();
        const mode = btn.dataset.mode;
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panels.forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + mode).classList.add('active');
      });
    });

    // ===== SPARKLE HELPER =====
    function spawnSparkle(x, y) {
      const chars = ['✨', '⭐', '🌟', '💫', '✧'];
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = chars[Math.floor(Math.random() * chars.length)];
      el.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
      el.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function spawnSparkles(x, y, count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => spawnSparkle(x, y), i * 50);
      }
    }

    // ===== STAR FLOAT HELPER (for piano) =====
    function spawnStar(parent) {
      const star = document.createElement('div');
      star.className = 'star-float';
      star.textContent = '⭐';
      star.style.left = (Math.random() * 60 + 20) + '%';
      star.style.bottom = '30%';
      parent.appendChild(star);
      setTimeout(() => star.remove(), 1000);
    }

    // ===== MODE 1: PIANO =====
    const pianoKeys = document.querySelectorAll('.piano-key');
    const activePointers = new Map();

    function pianoDown(key, e) {
      ensureAudio();
      e.preventDefault();
      const note = key.dataset.note;
      key.classList.add('pressed');
      geroAudio.playNote(note, 0.5, 'sine');
      spawnStar(key);

      // Sparkles at touch point
      const rect = key.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.3;
      spawnSparkles(cx, cy, 3);
    }

    function pianoUp(key) {
      key.classList.remove('pressed');
    }

    pianoKeys.forEach(key => {
      // Pointer events for multi-touch support
      key.addEventListener('pointerdown', (e) => {
        activePointers.set(e.pointerId, key);
        key.setPointerCapture(e.pointerId);
        pianoDown(key, e);
      });

      key.addEventListener('pointerup', (e) => {
        activePointers.delete(e.pointerId);
        pianoUp(key);
      });

      key.addEventListener('pointercancel', (e) => {
        activePointers.delete(e.pointerId);
        pianoUp(key);
      });

      // Handle pointer moving to a different key
      key.addEventListener('pointerenter', (e) => {
        if (e.pressure > 0 || e.buttons > 0) {
          pianoDown(key, e);
        }
      });

      key.addEventListener('pointerleave', (e) => {
        pianoUp(key);
      });
    });

    // ===== MODE 2: DRUMS =====
    const drumPads = document.querySelectorAll('.drum-pad');

    const drumSounds = {
      low: () => geroAudio.playTone(100, 0.4, 'triangle', 0.4),
      mid: () => geroAudio.playTone(200, 0.3, 'triangle', 0.35),
      high: () => geroAudio.playTone(800, 0.15, 'square', 0.2),
      click: () => geroAudio.playTone(1200, 0.06, 'square', 0.25),
    };

    function drumHit(pad, e) {
      ensureAudio();
      e.preventDefault();
      const drum = pad.dataset.drum;
      pad.classList.add('hit');
      drumSounds[drum]();

      // Ripple effect
      const ripple = document.createElement('div');
      ripple.className = 'drum-ripple';
      ripple.style.left = '50%';
      ripple.style.top = '50%';
      ripple.style.transform = 'translate(-50%,-50%)';
      pad.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // Sparkles
      const rect = pad.getBoundingClientRect();
      spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 4);

      setTimeout(() => pad.classList.remove('hit'), 100);
    }

    drumPads.forEach(pad => {
      pad.addEventListener('pointerdown', (e) => drumHit(pad, e));
    });

    // ===== MODE 3: FOREST =====
    const forestElements = document.querySelectorAll('.forest-element');

    const forestSounds = {
      tree: () => {
        // White noise burst for rustling leaves
        if (!geroAudio.ctx) return;
        const bufferSize = geroAudio.ctx.sampleRate * 0.3;
        const buffer = geroAudio.ctx.createBuffer(1, bufferSize, geroAudio.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.15;
        }
        const source = geroAudio.ctx.createBufferSource();
        source.buffer = buffer;
        const gain = geroAudio.ctx.createGain();
        gain.gain.value = 0.3;
        gain.gain.exponentialRampToValueAtTime(0.001, geroAudio.ctx.currentTime + 0.3);
        const filter = geroAudio.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 3000;
        filter.Q.value = 0.5;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(geroAudio.seGain);
        source.start();
      },
      bird: () => geroAudio.playAnimalSound('bird'),
      water: () => {
        // High ping drip
        geroAudio.playTone(1400, 0.08, 'sine', 0.25);
        setTimeout(() => geroAudio.playTone(1800, 0.06, 'sine', 0.15), 80);
      },
      frog: () => geroAudio.playAnimalSound('frog'),
      flower: () => {
        // Gentle chime
        [1047, 1319, 1568].forEach((f, i) => {
          setTimeout(() => geroAudio.playTone(f, 0.4, 'sine', 0.12), i * 100);
        });
      },
      cloud: () => {
        // Soft whoosh with filtered noise
        if (!geroAudio.ctx) return;
        const bufferSize = geroAudio.ctx.sampleRate * 0.5;
        const buffer = geroAudio.ctx.createBuffer(1, bufferSize, geroAudio.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.1;
        }
        const source = geroAudio.ctx.createBufferSource();
        source.buffer = buffer;
        const gain = geroAudio.ctx.createGain();
        gain.gain.setValueAtTime(0.001, geroAudio.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, geroAudio.ctx.currentTime + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, geroAudio.ctx.currentTime + 0.5);
        const filter = geroAudio.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(geroAudio.seGain);
        source.start();
      },
    };

    forestElements.forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        ensureAudio();
        e.preventDefault();
        const sound = el.dataset.sound;

        // Remove idle, play tap anim
        el.classList.remove('idle');
        el.classList.remove('tapped');
        // Force reflow
        void el.offsetWidth;
        el.classList.add('tapped');

        forestSounds[sound]();

        // Sparkles
        const rect = el.getBoundingClientRect();
        spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 4);

        // Restore idle after animation
        setTimeout(() => {
          el.classList.remove('tapped');
          el.classList.add('idle');
        }, 400);
      });
    });

    // ===== PARENT CONTROLS =====
    let parentTaps = [];
    const parentBtn = document.getElementById('parentExit');
    const backOverlay = document.getElementById('backOverlay');

    parentBtn.addEventListener('click', () => {
      const now = Date.now();
      parentTaps.push(now);
      // Keep only taps within last 2 seconds
      parentTaps = parentTaps.filter(t => now - t < 2000);
      if (parentTaps.length >= 3) {
        backOverlay.classList.add('show');
        parentTaps = [];
      }
    });

    // Prevent default touch behaviors for smoother experience
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.play-area')) {
        e.preventDefault();
      }
    }, { passive: false });

  </script>
</body>
</html>
