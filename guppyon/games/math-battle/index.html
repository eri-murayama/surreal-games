<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さんすうバトル｜ゲロゲーロ学園</title>
  <meta name="description" content="計算力を鍛えるバトル形式の算数ゲーム！子ども向け無料知育ゲーム">
  <meta property="og:title" content="さんすうバトル｜ゲロゲーロ学園">
  <meta property="og:description" content="計算力を鍛えるバトル形式の算数ゲーム！子ども向け無料知育ゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/gerogero-gakuen/games/math-battle/index.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/gerogero-gakuen/games/math-battle/index.html">
  <script src="../../js/pwa-register.js" defer></script>
  <script src="../../js/game-upgrades.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>

<div class="game-wrapper">
  <div class="game-container" id="game-container">

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Flash overlay -->
    <div class="flash-overlay" id="flash-overlay"></div>

    <!-- ===== START SCREEN ===== -->
    <div class="screen" id="start-screen">
      <span class="title-emoji">&#x2694;&#xFE0F;</span>
      <h1 class="title">さんすうバトル</h1>
      <p class="subtitle">もんだいを とって モンスターを たおそう！</p>
      <p class="difficulty-label">むずかしさを えらんでね</p>
      <div class="difficulty-buttons">
        <button class="diff-btn diff-easy" onclick="startGame('easy')">
          &#x2B50; かんたん
          <span class="diff-desc">たしざん・ひきざん（10まで）</span>
        </button>
        <button class="diff-btn diff-normal" onclick="startGame('normal')">
          &#x1F525; ふつう
          <span class="diff-desc">たしざん・ひきざん（20まで）＋かけざん</span>
        </button>
        <button class="diff-btn diff-hard" onclick="startGame('hard')">
          &#x1F4A5; むずかしい
          <span class="diff-desc">＋−×÷（100まで）</span>
        </button>
      </div>
      <a href="../../index.html" class="back-link">&#x2190; もどる</a>
    </div>

    <!-- ===== BATTLE SCREEN ===== -->
    <div class="screen hidden" id="battle-screen">
      <!-- HUD -->
      <div class="hud">
        <div class="hud-left">
          <span class="wave-badge" id="wave-badge">WAVE 1/5</span>
          <div class="fever-meter" id="fever-meter">
            <span class="fever-label" id="fever-label">FEVER</span>
            <div class="fever-bar">
              <div class="fever-fill" id="fever-fill" style="width:0%"></div>
            </div>
          </div>
        </div>
        <div class="hud-right">
          <span class="score-display" id="score-display">&#x1F4AB; 0</span>
          <span class="combo-display" id="combo-display"></span>
        </div>
      </div>

      <!-- Player HP -->
      <div class="player-hp">
        <span class="player-label">じぶん</span>
        <div class="hearts" id="player-hearts">
          <span class="heart">&#x2764;&#xFE0F;</span>
          <span class="heart">&#x2764;&#xFE0F;</span>
          <span class="heart">&#x2764;&#xFE0F;</span>
        </div>
      </div>

      <!-- Monster Area -->
      <div class="monster-area" id="monster-area">
        <p class="monster-name" id="monster-name">スライムん</p>
        <div class="monster-hp-bar">
          <div class="monster-hp-fill" id="monster-hp-fill" style="width:100%"></div>
        </div>
        <div class="monster-emoji" id="monster-emoji">&#x1F47E;</div>
      </div>

      <!-- Timer -->
      <div class="timer-area">
        <div class="timer-bar-bg">
          <div class="timer-bar-fill" id="timer-fill" style="width:100%"></div>
        </div>
      </div>

      <!-- Question -->
      <div class="question-area">
        <div class="question-text" id="question-text">3 + 5 = ?</div>
      </div>

      <!-- Answers -->
      <div class="answers-grid" id="answers-grid">
        <button class="answer-btn" onclick="selectAnswer(0)">8</button>
        <button class="answer-btn" onclick="selectAnswer(1)">6</button>
        <button class="answer-btn" onclick="selectAnswer(2)">9</button>
        <button class="answer-btn" onclick="selectAnswer(3)">7</button>
      </div>

      <!-- Feedback -->
      <div class="feedback-overlay">
        <div class="feedback-text" id="feedback-text"></div>
      </div>

      <!-- Wave announce -->
      <div class="wave-announce" id="wave-announce">
        <div class="wave-announce-text" id="wave-announce-text"></div>
        <div class="wave-announce-sub" id="wave-announce-sub"></div>
      </div>
    </div>

    <!-- ===== RESULT SCREEN ===== -->
    <div class="screen hidden" id="result-screen">
      <div class="result-emoji" id="result-emoji">&#x1F389;</div>
      <h2 class="result-title" id="result-title">すごい！</h2>
      <p class="result-message" id="result-message"></p>
      <div class="result-banner hidden" id="result-banner"></div>
      <div class="result-stats">
        <div class="stat-row">
          <span class="stat-label">スコア</span>
          <span class="stat-value" id="stat-score">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">せいかいりつ</span>
          <span class="stat-value" id="stat-accuracy">0%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">じかん</span>
          <span class="stat-value" id="stat-time">0びょう</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">さいこうコンボ</span>
          <span class="stat-value" id="stat-combo">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">FEVER</span>
          <span class="stat-value" id="stat-fever">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">BEST</span>
          <span class="stat-value" id="stat-best">0</span>
        </div>
      </div>
      <div class="result-buttons">
        <button class="result-btn btn-retry" onclick="goToStart()">&#x1F504; もういちど</button>
        <a href="../../index.html" class="result-btn btn-back" style="text-align:center;text-decoration:none;">&#x2190; もどる</a>
      </div>
    </div>

  </div>
</div>

<script>
// ===== GAME STATE =====
const state = {
  difficulty: 'easy',
  wave: 1,
  maxWaves: 5,
  score: 0,
  combo: 0,
  maxCombo: 0,
  playerHP: 3,
  maxPlayerHP: 3,
  monsterHP: 0,
  monsterMaxHP: 0,
  totalQuestions: 0,
  correctAnswers: 0,
  startTime: 0,
  timerInterval: null,
  timeLeft: 10,
  maxTime: 10,
  currentAnswer: 0,
  isAnswering: false,
  currentMonster: null,
  feverCharge: 0,
  maxFeverCharge: 5,
  feverActive: false,
  feverHitsLeft: 0,
  feverActivations: 0,
  bestRecord: null,
  isNewBest: false,
};

function getBestKey(difficulty) {
  return 'gero-math-battle-best-' + difficulty;
}

function loadBestRecord(difficulty) {
  try {
    const raw = localStorage.getItem(getBestKey(difficulty));
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function saveBestRecord(difficulty, record) {
  try {
    localStorage.setItem(getBestKey(difficulty), JSON.stringify(record));
  } catch (error) {
    // Ignore storage failures so the battle can continue.
  }
}

function isBetterRecord(record, bestRecord) {
  if (!bestRecord) return true;
  if (record.score !== bestRecord.score) return record.score > bestRecord.score;
  if (record.maxCombo !== bestRecord.maxCombo) return record.maxCombo > bestRecord.maxCombo;
  return record.elapsed < bestRecord.elapsed;
}

// ===== MONSTERS =====
const monsters = [
  { emoji: '\u{1F47E}', name: 'スライムん', baseHP: 3 },
  { emoji: '\u{1F47B}', name: 'たしざんオバケ', baseHP: 3 },
  { emoji: '\u{1F916}', name: 'カズモンスター', baseHP: 4 },
  { emoji: '\u{1F479}', name: 'ひきざんオニ', baseHP: 4 },
  { emoji: '\u{1F409}', name: 'ドラゴすう', baseHP: 5 },
  { emoji: '\u{1F47E}', name: 'ナンバーキング', baseHP: 5 },
  { emoji: '\u{1F47B}', name: 'わりざんゴースト', baseHP: 4 },
  { emoji: '\u{1F916}', name: 'けいさんロボ', baseHP: 4 },
  { emoji: '\u{1F479}', name: 'かけざんデーモン', baseHP: 5 },
  { emoji: '\u{1F409}', name: 'すうじリュウ', baseHP: 6 },
];

// ===== INIT STARS =====
function initStars() {
  const container = document.getElementById('stars');
  container.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = (1 + Math.random() * 3) + 'px';
    star.style.height = star.style.width;
    star.style.animationDelay = (Math.random() * 3) + 's';
    star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    container.appendChild(star);
  }
}

// ===== SCREEN MANAGEMENT =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goToStart() {
  clearInterval(state.timerInterval);
  clearFever(true);
  showScreen('start-screen');
}

// ===== START GAME =====
function startGame(difficulty) {
  state.difficulty = difficulty;
  state.wave = 1;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.playerHP = 3;
  state.totalQuestions = 0;
  state.correctAnswers = 0;
  state.startTime = Date.now();
  state.feverCharge = 0;
  state.feverActive = false;
  state.feverHitsLeft = 0;
  state.feverActivations = 0;
  state.bestRecord = loadBestRecord(difficulty);
  state.isNewBest = false;

  showScreen('battle-screen');
  document.getElementById('game-container').classList.remove('fever-mode');
  updateHUD();
  updateHearts();
  spawnMonster();
}

// ===== SPAWN MONSTER =====
function spawnMonster() {
  const pool = monsters.filter((_, i) => {
    if (state.difficulty === 'easy') return i < 4;
    if (state.difficulty === 'normal') return i < 7;
    return true;
  });

  const m = pool[Math.floor(Math.random() * pool.length)];
  const hpBonus = state.wave - 1;
  state.currentMonster = m;
  state.monsterMaxHP = m.baseHP + hpBonus;
  state.monsterHP = state.monsterMaxHP;

  document.getElementById('monster-name').textContent = m.name;
  document.getElementById('monster-emoji').textContent = m.emoji;
  document.getElementById('monster-emoji').className = 'monster-emoji';
  updateMonsterHP();

  // Show wave announcement
  const wa = document.getElementById('wave-announce');
  document.getElementById('wave-announce-text').textContent = 'WAVE ' + state.wave;
  document.getElementById('wave-announce-sub').textContent = m.name + ' があらわれた！';
  wa.classList.add('show');

  setTimeout(() => {
    wa.classList.remove('show');
    generateQuestion();
  }, 1500);
}

// ===== GENERATE QUESTION =====
function generateQuestion() {
  if (state.playerHP <= 0) return;
  state.isAnswering = true;

  let a, b, op, answer;
  const diff = state.difficulty;

  if (diff === 'easy') {
    op = Math.random() < 0.5 ? '+' : '-';
    if (op === '+') {
      a = Math.floor(Math.random() * 10) + 1;
      b = Math.floor(Math.random() * (10 - a)) + 1;
      answer = a + b;
    } else {
      a = Math.floor(Math.random() * 9) + 2;
      b = Math.floor(Math.random() * a) + 1;
      answer = a - b;
    }
  } else if (diff === 'normal') {
    const r = Math.random();
    if (r < 0.4) { op = '+'; }
    else if (r < 0.8) { op = '-'; }
    else { op = '\u00d7'; }

    if (op === '+') {
      a = Math.floor(Math.random() * 18) + 2;
      b = Math.floor(Math.random() * (20 - a)) + 1;
      answer = a + b;
    } else if (op === '-') {
      a = Math.floor(Math.random() * 18) + 3;
      b = Math.floor(Math.random() * a) + 1;
      answer = a - b;
    } else {
      a = Math.floor(Math.random() * 9) + 1;
      b = Math.floor(Math.random() * 9) + 1;
      answer = a * b;
    }
  } else {
    const r = Math.random();
    if (r < 0.3) { op = '+'; }
    else if (r < 0.55) { op = '-'; }
    else if (r < 0.8) { op = '\u00d7'; }
    else { op = '\u00f7'; }

    if (op === '+') {
      a = Math.floor(Math.random() * 90) + 5;
      b = Math.floor(Math.random() * (100 - a)) + 1;
      answer = a + b;
    } else if (op === '-') {
      a = Math.floor(Math.random() * 90) + 10;
      b = Math.floor(Math.random() * a) + 1;
      answer = a - b;
    } else if (op === '\u00d7') {
      a = Math.floor(Math.random() * 12) + 1;
      b = Math.floor(Math.random() * 12) + 1;
      answer = a * b;
    } else {
      b = Math.floor(Math.random() * 11) + 2;
      answer = Math.floor(Math.random() * 12) + 1;
      a = b * answer;
    }
  }

  state.currentAnswer = answer;
  document.getElementById('question-text').textContent = a + ' ' + op + ' ' + b + ' = ?';

  // Generate answer choices
  const choices = [answer];
  while (choices.length < 4) {
    let wrong;
    const offset = Math.floor(Math.random() * 10) + 1;
    wrong = answer + (Math.random() < 0.5 ? offset : -offset);
    if (wrong < 0) wrong = answer + offset + Math.floor(Math.random() * 5);
    if (!choices.includes(wrong)) {
      choices.push(wrong);
    }
  }

  // Shuffle
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  const grid = document.getElementById('answers-grid');
  const btns = grid.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    btn.textContent = choices[i];
    btn.className = 'answer-btn';
    btn.disabled = false;
    btn.dataset.value = choices[i];
  });

  startTimer();
}

// ===== TIMER =====
function startTimer() {
  state.timeLeft = state.maxTime;
  clearInterval(state.timerInterval);
  updateTimerBar();

  state.timerInterval = setInterval(() => {
    state.timeLeft -= 0.1;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      clearInterval(state.timerInterval);
      handleTimeout();
    }
    updateTimerBar();
  }, 100);
}

function updateTimerBar() {
  const fill = document.getElementById('timer-fill');
  const pct = (state.timeLeft / state.maxTime) * 100;
  fill.style.width = pct + '%';
  fill.className = 'timer-bar-fill';
  if (pct <= 20) fill.classList.add('danger');
  else if (pct <= 50) fill.classList.add('warning');
}

function handleTimeout() {
  state.isAnswering = false;
  state.totalQuestions++;
  state.combo = 0;
  clearFever();

  // Highlight correct answer
  const grid = document.getElementById('answers-grid');
  const btns = grid.querySelectorAll('.answer-btn');
  btns.forEach(btn => {
    btn.disabled = true;
    if (parseInt(btn.dataset.value) === state.currentAnswer) {
      btn.classList.add('correct');
    }
  });

  playerTakeDamage();
  updateHUD();
  showFeedback('じかんぎれ！', false);

  setTimeout(() => {
    if (state.playerHP > 0) generateQuestion();
  }, 1200);
}

// ===== SELECT ANSWER =====
function selectAnswer(index) {
  if (!state.isAnswering) return;
  state.isAnswering = false;
  clearInterval(state.timerInterval);
  state.totalQuestions++;

  const grid = document.getElementById('answers-grid');
  const btns = grid.querySelectorAll('.answer-btn');
  const selected = btns[index];
  const value = parseInt(selected.dataset.value);
  const isCorrect = value === state.currentAnswer;

  btns.forEach(btn => {
    btn.disabled = true;
    if (parseInt(btn.dataset.value) === state.currentAnswer) {
      btn.classList.add('correct');
    }
  });

  if (isCorrect) {
    handleCorrect(selected);
  } else {
    selected.classList.add('wrong');
    handleWrong();
  }
}

// ===== CORRECT =====
function handleCorrect(btn) {
  state.correctAnswers++;
  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  const comboBonus = Math.min(state.combo - 1, 5) * 5;
  const feverTriggered = chargeFever();
  const feverBonus = state.feverActive ? 15 : 0;
  const scoreGain = 10 + comboBonus + feverBonus;
  const attackPower = state.feverActive ? 2 : 1;
  state.score += scoreGain;

  // Visual feedback
  let feedbackText = state.combo >= 3 ? state.combo + 'コンボ！すごい！' : 'せいかい！';
  if (feverTriggered) {
    feedbackText = 'FEVER!';
  } else if (state.feverActive) {
    feedbackText = 'FEVER HIT!';
  }
  showFeedback(feedbackText, true);
  flashScreen(state.feverActive ? 'gold' : 'green');
  spawnParticles(true);
  shakeScreen();

  // Monster takes damage
  const me = document.getElementById('monster-emoji');
  me.classList.add('hit');
  setTimeout(() => me.classList.remove('hit'), 500);

  showDamageNumber(scoreGain, state.feverActive ? 'CRIT' : '');

  state.monsterHP -= attackPower;
  if (state.feverActive) {
    state.feverHitsLeft--;
    if (state.feverHitsLeft <= 0) {
      clearFever();
    }
  }
  updateMonsterHP();
  updateHUD();

  if (state.monsterHP <= 0) {
    // Monster defeated
    me.classList.add('dying');
    setTimeout(() => {
      if (state.wave >= state.maxWaves) {
        endGame(true);
      } else {
        state.wave++;
        spawnMonster();
      }
    }, 1200);
  } else {
    setTimeout(() => {
      if (state.playerHP > 0) generateQuestion();
    }, 1000);
  }
}

// ===== WRONG =====
function handleWrong() {
  state.combo = 0;
  clearFever();
  showFeedback('ざんねん...', false);
  flashScreen('red');
  playerTakeDamage();
  updateHUD();

  setTimeout(() => {
    if (state.playerHP > 0) generateQuestion();
  }, 1200);
}

// ===== PLAYER DAMAGE =====
function playerTakeDamage() {
  state.playerHP--;
  updateHearts();

  if (state.playerHP <= 0) {
    setTimeout(() => endGame(false), 800);
  }
}

// ===== UPDATE FUNCTIONS =====
function updateHUD() {
  document.getElementById('wave-badge').textContent = 'WAVE ' + state.wave + '/' + state.maxWaves;
  document.getElementById('score-display').textContent = '\u{1F4AB} ' + state.score;

  const cd = document.getElementById('combo-display');
  if (state.combo >= 2) {
    cd.textContent = state.combo + ' COMBO';
    cd.classList.remove('active');
    void cd.offsetWidth;
    cd.classList.add('active');
  } else {
    cd.textContent = '';
  }

  const feverMeter = document.getElementById('fever-meter');
  const feverFill = document.getElementById('fever-fill');
  const feverLabel = document.getElementById('fever-label');
  const feverPercent = state.feverActive
    ? 100
    : (state.feverCharge / state.maxFeverCharge) * 100;

  feverFill.style.width = feverPercent + '%';
  feverMeter.classList.toggle('ready', !state.feverActive && state.feverCharge >= state.maxFeverCharge - 1);
  feverMeter.classList.toggle('active', state.feverActive);
  feverLabel.textContent = state.feverActive
    ? 'FEVER x' + Math.max(state.feverHitsLeft, 0)
    : 'FEVER';
}

function updateHearts() {
  const container = document.getElementById('player-hearts');
  container.innerHTML = '';
  for (let i = 0; i < state.maxPlayerHP; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= state.playerHP ? ' lost' : '');
    h.textContent = '\u2764\uFE0F';
    if (i === state.playerHP && state.playerHP < state.maxPlayerHP) {
      h.classList.add('damage');
    }
    container.appendChild(h);
  }
}

function updateMonsterHP() {
  const pct = (state.monsterHP / state.monsterMaxHP) * 100;
  document.getElementById('monster-hp-fill').style.width = Math.max(0, pct) + '%';
}

function chargeFever() {
  if (state.feverActive) return false;
  const gain = state.combo >= 3 ? 2 : 1;
  state.feverCharge = Math.min(state.maxFeverCharge, state.feverCharge + gain);
  if (state.feverCharge >= state.maxFeverCharge) {
    state.feverActive = true;
    state.feverHitsLeft = 3;
    state.feverActivations++;
    document.getElementById('game-container').classList.add('fever-mode');
    return true;
  }
  return false;
}

function clearFever(resetCharge) {
  state.feverActive = false;
  state.feverHitsLeft = 0;
  state.feverCharge = resetCharge ? 0 : Math.min(state.feverCharge, state.maxFeverCharge - 2);
  document.getElementById('game-container').classList.remove('fever-mode');
}

// ===== VISUAL EFFECTS =====
function showFeedback(text, isCorrect) {
  const el = document.getElementById('feedback-text');
  el.textContent = text;
  el.className = 'feedback-text';
  void el.offsetWidth;
  el.classList.add(isCorrect ? 'show-correct' : 'show-wrong');
}

function flashScreen(color) {
  const el = document.getElementById('flash-overlay');
  el.className = 'flash-overlay';
  void el.offsetWidth;
  if (color === 'green') {
    el.classList.add('flash-green');
  } else if (color === 'gold') {
    el.classList.add('flash-gold');
  } else {
    el.classList.add('flash-red');
  }
}

function shakeScreen() {
  const gc = document.getElementById('game-container');
  gc.classList.remove('shake');
  void gc.offsetWidth;
  gc.classList.add('shake');
  setTimeout(() => gc.classList.remove('shake'), 400);
}

function showDamageNumber(amount, suffix) {
  const ma = document.getElementById('monster-area');
  const dn = document.createElement('div');
  dn.className = 'damage-number';
  dn.textContent = '-' + amount + (suffix ? ' ' + suffix : '');
  dn.style.left = (40 + Math.random() * 20) + '%';
  dn.style.top = '30%';
  ma.appendChild(dn);
  setTimeout(() => dn.remove(), 1000);
}

function spawnParticles(isCorrect) {
  const container = document.getElementById('game-container');
  const emojis = isCorrect
    ? ['\u2B50', '\u2728', '\u{1F31F}', '\u{1F4AB}', '\u{1F389}']
    : ['\u{1F4A2}', '\u2757', '\u{1F4A5}'];
  const count = isCorrect ? 12 : 5;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = (30 + Math.random() * 40) + '%';
    p.style.top = (30 + Math.random() * 20) + '%';
    p.style.setProperty('--px', (Math.random() * 200 - 100) + 'px');
    p.style.setProperty('--py', (Math.random() * -150 - 50) + 'px');
    p.style.setProperty('--pr', (Math.random() * 720 - 360) + 'deg');
    p.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

// ===== END GAME =====
function endGame(won) {
  clearInterval(state.timerInterval);
  document.getElementById('game-container').classList.remove('fever-mode');
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const accuracy = state.totalQuestions > 0
    ? Math.round((state.correctAnswers / state.totalQuestions) * 100) : 0;
  const resultRecord = {
    score: state.score,
    maxCombo: state.maxCombo,
    accuracy,
    elapsed
  };

  if (isBetterRecord(resultRecord, state.bestRecord)) {
    state.bestRecord = resultRecord;
    state.isNewBest = true;
    saveBestRecord(state.difficulty, resultRecord);
  }

  document.getElementById('stat-score').textContent = state.score;
  document.getElementById('stat-accuracy').textContent = accuracy + '%';
  document.getElementById('stat-time').textContent = elapsed + 'びょう';
  document.getElementById('stat-combo').textContent = state.maxCombo;
  document.getElementById('stat-fever').textContent = state.feverActivations + 'かい';
  document.getElementById('stat-best').textContent = state.bestRecord ? state.bestRecord.score : state.score;

  let title, emoji, message;

  if (won) {
    if (accuracy >= 90) {
      title = 'かんぺき！';
      emoji = '\u{1F3C6}';
      message = 'すべてのモンスターを たおした！\nきみは さんすうマスターだ！';
    } else if (accuracy >= 70) {
      title = 'やったね！';
      emoji = '\u{1F389}';
      message = 'モンスターを ぜんぶ たおしたよ！\nとっても がんばったね！';
    } else {
      title = 'クリア！';
      emoji = '\u{1F60A}';
      message = 'よく がんばったね！\nもっと れんしゅうすると\nもっと つよくなれるよ！';
    }
  } else {
    if (accuracy >= 50) {
      title = 'おしい！';
      emoji = '\u{1F4AA}';
      message = 'いい せんいってたよ！\nもういちど ちょうせんしよう！';
    } else {
      title = 'ドンマイ！';
      emoji = '\u{1F60A}';
      message = 'さんすうは れんしゅうが たいせつ！\nまた ちょうせんしてね！';
    }
  }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-message').textContent = message;

  const resultBanner = document.getElementById('result-banner');
  if (state.isNewBest) {
    resultBanner.textContent = 'NEW BEST! スコアこうしん';
    resultBanner.classList.remove('hidden');
  } else if (won && state.feverActivations > 0) {
    resultBanner.textContent = 'FEVER ' + state.feverActivations + 'かい';
    resultBanner.classList.remove('hidden');
  } else {
    resultBanner.textContent = '';
    resultBanner.classList.add('hidden');
  }

  showScreen('result-screen');
  geroShare('#result-screen', {
    gameTitle: 'さんすうバトル',
    resultText: title,
    age: 'kid'
  });

  // Victory particles
  if (won) {
    for (let i = 0; i < 20; i++) {
      setTimeout(() => spawnParticles(true), i * 100);
    }
  }
}

// ===== INIT =====
initStars();
</script>
