<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きおくカード｜ゲロゲーロ学園</title>
  <meta name="description" content="神経衰弱で記憶力を鍛えよう！子ども向け無料知育ゲーム">
  <meta property="og:title" content="きおくカード｜ゲロゲーロ学園">
  <meta property="og:description" content="神経衰弱で記憶力を鍛えよう！子ども向け無料知育ゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eri-murayama.github.io/gerogero-gakuen/games/memory-cards/index.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://eri-murayama.github.io/gerogero-gakuen/games/memory-cards/index.html">
  <script src="../../js/pwa-register.js" defer></script>
  <script src="../../js/game-upgrades.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
      <span class="header-icon">🧠</span>
      <h1>きおくカード</h1>
      <p class="subtitle">カードをめくって おなじペアを みつけよう！</p>
    </header>

    <!-- ===== Start Screen ===== -->
    <div id="start-screen" class="screen start-screen active">
      <p class="difficulty-title">むずかしさを えらんでね</p>
      <div class="difficulty-cards">
        <div class="difficulty-card" data-difficulty="easy" role="button" tabindex="0">
          <span class="diff-emoji">🌟</span>
          <span class="diff-label">かんたん</span>
          <span class="diff-desc">3×4 マス（6ペア）</span>
        </div>
        <div class="difficulty-card" data-difficulty="normal" role="button" tabindex="0">
          <span class="diff-emoji">🌙</span>
          <span class="diff-label">ふつう</span>
          <span class="diff-desc">4×4 マス（8ペア）</span>
        </div>
        <div class="difficulty-card" data-difficulty="hard" role="button" tabindex="0">
          <span class="diff-emoji">🔥</span>
          <span class="diff-label">むずかしい</span>
          <span class="diff-desc">4×5 マス（10ペア）</span>
        </div>
      </div>
      <div class="best-memory" id="best-memory-text">ベスト: カードをえらぶと きろくが みえるよ</div>
      <div class="btn-group" style="margin-top: 12px;">
        <a href="../../index.html" class="game-btn btn-secondary">🏠 もどる</a>
      </div>
    </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="screen game-screen">
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-icon">🃏</span>
          <span>ペア</span>
          <span class="stat-value" id="pairs-found">0</span>
          <span>/</span>
          <span class="stat-value" id="pairs-total">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">👆</span>
          <span>かいすう</span>
          <span class="stat-value" id="move-count">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">⏱️</span>
          <span class="stat-value" id="timer">0:00</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">✨</span>
          <span>れんぞく</span>
          <span class="stat-value" id="streak-count">0</span>
        </div>
      </div>
      <div class="status-banner" id="status-banner">よーくみて ぴったり そろえよう！</div>
      <div id="card-grid" class="card-grid"></div>
      <div class="btn-group">
        <button class="game-btn btn-secondary" id="btn-back-to-start">🏠 やめる</button>
      </div>
    </div>

    <!-- ===== Result Screen ===== -->
    <div id="result-screen" class="screen result-screen">
      <div class="result-card">
        <div class="result-title">🎉 おめでとう！</div>
        <div class="result-stars" id="result-stars"></div>
        <div class="result-stats">
          <div class="result-stat-row">
            <span>🃏 ペアすう</span>
            <span class="rs-value" id="rs-pairs"></span>
          </div>
          <div class="result-stat-row">
            <span>👆 かいすう</span>
            <span class="rs-value" id="rs-moves"></span>
          </div>
          <div class="result-stat-row">
            <span>⏱️ じかん</span>
            <span class="rs-value" id="rs-time"></span>
          </div>
          <div class="result-stat-row">
            <span>✨ れんぞく</span>
            <span class="rs-value" id="rs-streak"></span>
          </div>
          <div class="result-stat-row">
            <span>🏆 ベスト</span>
            <span class="rs-value" id="rs-best"></span>
          </div>
        </div>
        <p class="result-message" id="result-message"></p>
        <div class="result-stickers" id="result-stickers"></div>
      </div>
      <div class="btn-group">
        <button class="game-btn btn-primary" id="btn-retry">🔄 もういちど</button>
        <a href="../../index.html" class="game-btn btn-secondary">🏠 もどる</a>
      </div>
    </div>
  </div>

  <script>
    /* ============================================
       きおくカード (Memory Cards) Game Logic
       ============================================ */

    const ALL_EMOJIS = ['🐸','🌸','🚀','🍰','⭐','🎵','🌈','🦄','🍕','🎀'];

    const DIFFICULTY = {
      easy:   { cols: 3, rows: 4, pairs: 6  },
      normal: { cols: 4, rows: 4, pairs: 8  },
      hard:   { cols: 4, rows: 5, pairs: 10 },
    };

    // State
    let currentDifficulty = null;
    let cards = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let pairsFound = 0;
    let totalPairs = 0;
    let timerInterval = null;
    let elapsedSeconds = 0;
    let matchStreak = 0;
    let bestStreak = 0;
    let previewTimeout = null;
    let bestRecord = null;
    let previewActive = false;

    function getBestKey(difficulty) {
      return 'gero-memory-cards-best-' + difficulty;
    }

    function loadBestRecord(difficulty) {
      try {
        const raw = localStorage.getItem(getBestKey(difficulty));
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function saveBestRecord(difficulty, record) {
      try {
        localStorage.setItem(getBestKey(difficulty), JSON.stringify(record));
      } catch (error) {
        // Ignore storage failures and keep the game running.
      }
    }

    function isBetterRecord(record, currentBest) {
      if (!currentBest) return true;
      if (record.stars !== currentBest.stars) return record.stars > currentBest.stars;
      if (record.moves !== currentBest.moves) return record.moves < currentBest.moves;
      return record.elapsedSeconds < currentBest.elapsedSeconds;
    }

    function formatBestRecord(record) {
      if (!record) return 'ベスト: まだないよ';
      return `ベスト ${record.stars}つぼし / ${record.moves}かい / ${formatTime(record.elapsedSeconds)}`;
    }

    // DOM refs
    const startScreen  = document.getElementById('start-screen');
    const gameScreen   = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const cardGrid     = document.getElementById('card-grid');
    const pairsFoundEl = document.getElementById('pairs-found');
    const pairsTotalEl = document.getElementById('pairs-total');
    const moveCountEl  = document.getElementById('move-count');
    const timerEl      = document.getElementById('timer');
    const streakCountEl = document.getElementById('streak-count');
    const statusBannerEl = document.getElementById('status-banner');
    const bestMemoryTextEl = document.getElementById('best-memory-text');

    // ===== Screen Management =====
    function showScreen(screen) {
      [startScreen, gameScreen, resultScreen].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    // ===== Difficulty Selection =====
    document.querySelectorAll('.difficulty-card').forEach(card => {
      const handler = () => startGame(card.dataset.difficulty);
      card.addEventListener('click', handler);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); }});
      const previewRecord = () => {
        bestMemoryTextEl.textContent = formatBestRecord(loadBestRecord(card.dataset.difficulty));
      };
      card.addEventListener('mouseenter', previewRecord);
      card.addEventListener('focus', previewRecord);
    });

    document.getElementById('btn-back-to-start').addEventListener('click', () => {
      stopTimer();
      clearTimeout(previewTimeout);
      previewActive = false;
      showScreen(startScreen);
    });

    document.getElementById('btn-retry').addEventListener('click', () => {
      startGame(currentDifficulty);
    });

    // ===== Start Game =====
    function startGame(difficulty) {
      currentDifficulty = difficulty;
      const cfg = DIFFICULTY[difficulty];
      totalPairs = cfg.pairs;
      pairsFound = 0;
      moves = 0;
      elapsedSeconds = 0;
      matchStreak = 0;
      bestStreak = 0;
      firstCard = null;
      secondCard = null;
      lockBoard = true;
      bestRecord = loadBestRecord(difficulty);
      previewActive = true;

      // Update UI
      pairsFoundEl.textContent = '0';
      pairsTotalEl.textContent = totalPairs;
      moveCountEl.textContent = '0';
      timerEl.textContent = '0:00';
      streakCountEl.textContent = '0';
      statusBannerEl.textContent = 'よーくみて きおえてね';
      bestMemoryTextEl.textContent = formatBestRecord(bestRecord);

      // Build cards array
      const emojis = ALL_EMOJIS.slice(0, cfg.pairs);
      const deck = [...emojis, ...emojis];
      shuffle(deck);

      // Set grid class
      cardGrid.className = 'card-grid cols-' + cfg.cols;

      // Create card elements
      cardGrid.innerHTML = '';
      cards = [];
      deck.forEach((emoji, i) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'memory-card';
        cardEl.dataset.emoji = emoji;
        cardEl.dataset.index = i;
        cardEl.setAttribute('role', 'button');
        cardEl.setAttribute('tabindex', '0');
        cardEl.setAttribute('aria-label', 'カード ' + (i + 1));

        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">${emoji}</div>
          </div>
        `;

        cardEl.addEventListener('click', () => flipCard(cardEl));
        cardEl.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(cardEl); }
        });

        cardGrid.appendChild(cardEl);
        cards.push(cardEl);
      });

      showScreen(gameScreen);
      startPreview();
    }

    function startPreview() {
      clearTimeout(previewTimeout);
      cards.forEach(card => card.classList.add('flipped'));
      statusBannerEl.textContent = 'チラみせちゅう... よーくみてね！';

      previewTimeout = setTimeout(() => {
        statusBannerEl.textContent = 'スタート！ おなじカードを さがそう';
        cards.forEach(card => card.classList.remove('flipped'));
        previewTimeout = setTimeout(() => {
          previewActive = false;
          lockBoard = false;
          statusBannerEl.textContent = 'ぴったりそろえると キラキラだよ';
          startTimer();
        }, 450);
      }, 2200);
    }

    // ===== Card Flip Logic =====
    function flipCard(cardEl) {
      if (lockBoard) return;
      if (previewActive) return;
      if (cardEl.classList.contains('flipped')) return;
      if (cardEl.classList.contains('matched')) return;

      cardEl.classList.add('flipped');

      if (!firstCard) {
        firstCard = cardEl;
        return;
      }

      secondCard = cardEl;
      moves++;
      moveCountEl.textContent = moves;
      lockBoard = true;

      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

      if (isMatch) {
        handleMatch();
      } else {
        handleMismatch();
      }
    }

    function handleMatch() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      pairsFound++;
      matchStreak++;
      if (matchStreak > bestStreak) bestStreak = matchStreak;
      pairsFoundEl.textContent = pairsFound;
      streakCountEl.textContent = matchStreak;
      statusBannerEl.textContent = matchStreak >= 2
        ? `すごい！ ${matchStreak}れんぞく！`
        : 'ぴったり！ つぎも いけるよ';

      resetSelection();

      if (pairsFound === totalPairs) {
        setTimeout(endGame, 600);
      }
    }

    function handleMismatch() {
      matchStreak = 0;
      streakCountEl.textContent = '0';
      statusBannerEl.textContent = 'つぎで とりかえそう！';
      firstCard.classList.add('shake');
      secondCard.classList.add('shake');

      setTimeout(() => {
        firstCard.classList.remove('flipped', 'shake');
        secondCard.classList.remove('flipped', 'shake');
        resetSelection();
      }, 1000);
    }

    function resetSelection() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    // ===== Timer =====
    function startTimer() {
      stopTimer();
      elapsedSeconds = 0;
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const m = Math.floor(elapsedSeconds / 60);
        const s = elapsedSeconds % 60;
        timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // ===== End Game =====
    function endGame() {
      stopTimer();

      const stars = calcStars(moves, totalPairs);
      const timeStr = formatTime(elapsedSeconds);
      const previousBest = bestRecord;
      const record = {
        stars,
        moves,
        elapsedSeconds,
        bestStreak
      };
      const isNewBest = isBetterRecord(record, previousBest);
      if (isNewBest) {
        bestRecord = record;
        saveBestRecord(currentDifficulty, record);
      }

      // Fill result UI
      document.getElementById('rs-pairs').textContent = totalPairs + 'ペア';
      document.getElementById('rs-moves').textContent = moves + 'かい';
      document.getElementById('rs-time').textContent = timeStr;
      document.getElementById('rs-streak').textContent = bestStreak + 'れんぞく';
      document.getElementById('rs-best').textContent = bestRecord
        ? `${bestRecord.moves}かい / ${formatTime(bestRecord.elapsedSeconds)}`
        : '-';

      const starsEl = document.getElementById('result-stars');
      starsEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const span = document.createElement('span');
        span.className = 'star' + (i < stars ? ' earned' : '');
        span.textContent = i < stars ? '⭐' : '☆';
        starsEl.appendChild(span);
      }

      const msgEl = document.getElementById('result-message');
      if (stars === 3) {
        msgEl.textContent = 'すごい！ きおくの てんさい！🎉';
      } else if (stars === 2) {
        msgEl.textContent = 'やったね！ とてもじょうず！😊';
      } else {
        msgEl.textContent = 'がんばったね！ またちょうせんしよう！💪';
      }

      const stickers = [];
      if (stars === 3) stickers.push('👑 てんさいシール');
      if (bestStreak >= 3) stickers.push('⚡ れんぞくシール');
      if (isNewBest) stickers.push('🏆 ベストこうしん');
      if (elapsedSeconds <= totalPairs * 6) stickers.push('🌈 すばやいシール');
      if (stickers.length === 0) stickers.push('💖 がんばりシール');

      const stickersEl = document.getElementById('result-stickers');
      stickersEl.innerHTML = '';
      stickers.forEach(label => {
        const chip = document.createElement('span');
        chip.className = 'sticker-chip';
        chip.textContent = label;
        stickersEl.appendChild(chip);
      });

      bestMemoryTextEl.textContent = formatBestRecord(bestRecord);

      showScreen(resultScreen);
      geroShare('#result-screen', {
        gameTitle: 'きおくカード',
        resultText: stars + 'つぼし',
        age: 'toddler'
      });
      launchConfetti();
    }

    function calcStars(moves, pairs) {
      // Perfect = pairs moves. 3 stars if close to perfect, 2 if reasonable, 1 otherwise.
      const ratio = moves / pairs;
      if (ratio <= 1.5) return 3;
      if (ratio <= 2.5) return 2;
      return 1;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ===== Shuffle (Fisher-Yates) =====
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ===== Confetti =====
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ab47bc','#7b1fa2','#ffd600','#ff8a80','#64b5f6','#4ecdc4','#ffb74d','#e1bee7'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 10 + 5,
          h: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 3 + 2,
          rot: Math.random() * 360,
          rotV: (Math.random() - 0.5) * 10,
          opacity: 1,
        });
      }

      let frame = 0;
      const maxFrames = 180;

      function animate() {
        if (frame > maxFrames) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const fade = frame > maxFrames - 40 ? (maxFrames - frame) / 40 : 1;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotV;
          p.vy += 0.04;
          p.opacity = fade;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    // Handle window resize for confetti canvas
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    bestMemoryTextEl.textContent = formatBestRecord(loadBestRecord('normal'));
  </script>
<script src="../../js/gero-utils.js"></script>
<script src="../../js/share-gate.js"></script>
</body>
</html>
