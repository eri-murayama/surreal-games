<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OGP画像生成ツール - シュールゲームス</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; font-family: 'Zen Kaku Gothic New', sans-serif; color: #fff; }
    h1 { font-size: 1.3rem; margin-bottom: 8px; color: #ff6ec7; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; align-items: center; justify-content: center; }
    label { font-size: 0.85rem; color: #b0a8c8; }
    select, input[type="text"], input[type="file"] { padding: 6px 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a4a; color: #fff; font-size: 0.9rem; }
    select { cursor: pointer; }
    canvas { border: 2px solid #444; margin: 16px 0; max-width: 90vw; height: auto; border-radius: 8px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { padding: 10px 28px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; background: #6c5ce7; color: #fff; transition: background 0.2s; }
    button:hover { background: #5a4bd1; }
    button.batch { background: #e17055; }
    button.batch:hover { background: #d63031; }
    .info { font-size: 0.8rem; color: #666; margin-top: 8px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .batch-log { margin-top: 16px; font-size: 0.85rem; color: #b0a8c8; max-height: 200px; overflow-y: auto; width: 100%; max-width: 600px; }
    .batch-log div { padding: 2px 0; }
    .batch-log .ok { color: #00b894; }
    .batch-log .err { color: #e17055; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Kaku+Gothic+New:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
</head>

    </div>
    <div class="field-group">
      <label>キャラ画像（差し替え）</label>
      <input type="file" id="charaFile" accept="image/*">
    </div>
  </div>
  <canvas id="canvas" width="1200" height="630"></canvas>
  <div class="btn-row">
    <button id="redraw">再描画</button>
    <button id="download">PNGダウンロード</button>
    <button id="batchAll" class="batch">全ゲーム一括ダウンロード</button>
  </div>
  <p class="info">ダウンロード後、各ゲームフォルダに ogp.png として配置してください</p>
  <div class="batch-log" id="batchLog"></div>

      'dress-up': { title: 'びじん\nメーカー', subtitle: 'あなただけのびじんを作ろう\nシュールゲームス', emoji: '👗', bgColors: ['#880e4f','#e91e63','#f8bbd0'], glowColor1: 'rgba(233,30,99,0.25)', glowColor2: 'rgba(248,187,208,0.15)', filename: 'ogp.png', destDir: 'dress-up', label: 'びじんメーカー' },
      'elite-english': { title: 'エリート\nイングリッシュ！', subtitle: 'エリートな英語力を見せつけろ\nシュールゲームス', emoji: '🎓', bgColors: ['#1b5e20','#2e7d32','#4caf50'], glowColor1: 'rgba(46,125,50,0.25)', glowColor2: 'rgba(76,175,80,0.15)', filename: 'ogp.png', destDir: 'elite-english', label: 'エリートイングリッシュ！' },
      fortune: { title: 'シュール\n前世占い', subtitle: 'あなたの前世は何だった？\nシュールゲームス', emoji: '🔮', bgColors: ['#1a0a3e','#4a148c','#9c27b0'], glowColor1: 'rgba(156,39,176,0.25)', glowColor2: 'rgba(74,20,140,0.15)', filename: 'ogp.png', destDir: 'fortune', label: 'シュール前世占い' },
      'holo-analysis': { title: 'ホロメン\n経営分析', subtitle: '鼻毛たちの戯れ\nシュールゲームス', emoji: '📈', bgColors: ['#0d0221','#1a0533','#4fc3f7'], glowColor1: 'rgba(79,195,247,0.25)', glowColor2: 'rgba(3,169,244,0.15)', filename: 'ogp.png', destDir: 'holo-analysis', label: 'ホロメン経営分析' },
      'holo-memory': { title: 'ホロメン\nおぼえてますか？', subtitle: '神経衰弱でホロメンを覚えろ\nシュールゲームス', emoji: '🃏', bgColors: ['#0d0221','#1a0a3e','#00bcd4'], glowColor1: 'rgba(0,188,212,0.25)', glowColor2: 'rgba(0,151,167,0.15)', filename: 'ogp.png', destDir: 'holo-memory', label: 'ホロメンおぼえてますか？' },
      'magic-trick': { title: '協力者', subtitle: 'テーブル下からイカサマを手伝え！\nシュールゲームス', emoji: '🤝', bgColors: ['#263238','#37474f','#546e7a'], glowColor1: 'rgba(55,71,79,0.25)', glowColor2: 'rgba(84,110,122,0.15)', filename: 'ogp.png', destDir: 'magic-trick', label: '協力者' },
      'party-game': { title: 'ぱーてぃー\nげーむ', subtitle: '連打バトルで友達と対戦\nシュールゲームス', emoji: '🎉', bgColors: ['#e65100','#ff6d00','#ffab40'], glowColor1: 'rgba(255,109,0,0.25)', glowColor2: 'rgba(255,171,64,0.15)', filename: 'ogp.png', destDir: 'party-game', label: 'ぱーてぃーげーむ' },
      pet: { title: 'シュール\nペット', subtitle: 'ナゾの生きもの育成記\nシュールゲームス', emoji: '🐣', bgColors: ['#33691e','#558b2f','#aed581'], glowColor1: 'rgba(85,139,47,0.25)', glowColor2: 'rgba(174,213,129,0.15)', filename: 'ogp.png', destDir: 'pet', label: 'シュールペット' },
      rpg: { title: 'チート商材で\n無敵モテ男RPG', subtitle: 'チー牛が転生！？\nシュールゲームス', emoji: '⚔️', bgColors: ['#1b5e20','#2e7d32','#43a047'], glowColor1: 'rgba(46,125,50,0.25)', glowColor2: 'rgba(67,160,71,0.15)', filename: 'ogp.png', destDir: 'rpg', label: 'RPG' },
      'suisei-puzzle': { title: 'すいすい\nパズル', subtitle: '彗星のごとくブロックを消せ\nシュールゲームス', emoji: '☄️', bgColors: ['#0d0221','#1a0a3e','#5c6bc0'], glowColor1: 'rgba(92,107,192,0.25)', glowColor2: 'rgba(63,81,181,0.15)', filename: 'ogp.png', destDir: 'suisei-puzzle', label: 'すいすいパズル' },
      tower: { title: 'シュールの塔', subtitle: '終わりなき階段の先へ\nシュールゲームス', emoji: '🏰', bgColors: ['#263238','#37474f','#607d8b'], glowColor1: 'rgba(55,71,79,0.25)', glowColor2: 'rgba(96,125,139,0.15)', filename: 'ogp.png', destDir: 'tower', label: 'シュールの塔' },
      'trivia-king': { title: '雑学キング\n決定戦', subtitle: '無駄な知識で天下を取れ！\nシュールゲームス', emoji: '👑', bgColors: ['#4a3800','#f9a825','#fdd835'], glowColor1: 'rgba(249,168,37,0.25)', glowColor2: 'rgba(253,216,53,0.15)', filename: 'ogp.png', destDir: 'trivia-king', label: '雑学キング決定戦' },
      shooting: { title: 'シュール\nシューティング', subtitle: 'シュールな敵を撃ちまくれ！\nシュールゲームス', emoji: '🚀', bgColors: ['#0d0221','#1a0a3e','#283593'], glowColor1: 'rgba(40,53,147,0.25)', glowColor2: 'rgba(48,63,159,0.15)', filename: 'ogp.png', destDir: 'shooting', label: 'シュールシューティング' },
      'drawing-board': { title: 'お絵かき\nボード', subtitle: '自由にお絵かき！\nシュールゲームス', emoji: '🎨', bgColors: ['#4a148c','#7b1fa2','#ab47bc'], glowColor1: 'rgba(123,31,162,0.25)', glowColor2: 'rgba(171,71,188,0.15)', filename: 'ogp.png', destDir: 'drawing-board', label: 'お絵かきボード' },
      'typing-game': { title: 'シュール\nタイピング', subtitle: 'シュールなお題をタイピング！\nシュールゲームス', emoji: '⌨️', bgColors: ['#1a237e','#283593','#3949ab'], glowColor1: 'rgba(40,53,147,0.25)', glowColor2: 'rgba(57,73,171,0.15)', filename: 'ogp.png', destDir: 'typing-game', label: 'シュールタイピング' }
    };

    // プリセットのselectを生成
    const presetSelect = document.getElementById('preset');
    Object.keys(presets).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = presets[key].label || key;
      presetSelect.appendChild(opt);
    });

    let currentChara = new Image();
    let customChara = null;

    function getPreset(key) { return presets[key] || presets.site; }

    function getConfig() {
      const preset = getPreset(presetSelect.value);
      return {
        bgColors: preset.bgColors, glowColor1: preset.glowColor1, glowColor2: preset.glowColor2,
        filename: preset.filename || 'ogp.png', emoji: preset.emoji || null
      };
    }

    function drawWithConfig(cfg, img) {
      // 背景グラデーション
      const bg = ctx.createLinearGradient(0, 0, W, H);
      cfg.bgColors.forEach((c, i) => bg.addColorStop(i / (cfg.bgColors.length - 1), c));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 光の演出
      const g1 = ctx.createRadialGradient(W*0.2, H*0.3, 0, W*0.2, H*0.3, 350);
      g1.addColorStop(0, cfg.glowColor1); g1.addColorStop(1, 'transparent');
      ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
      const g2 = ctx.createRadialGradient(W*0.8, H*0.7, 0, W*0.8, H*0.7, 350);
      g2.addColorStop(0, cfg.glowColor2); g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

      // キャラクター画像（中央に大きく配置、文字なし）
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.save();
        // 高さ基準で最大サイズを決定（上下に少し余白）
        const maxH = H * 0.85;
        const maxW = W * 0.7;
        let ch = maxH;
        let cw = ch * (img.naturalWidth / img.naturalHeight);
        if (cw > maxW) { cw = maxW; ch = cw * (img.naturalHeight / img.naturalWidth); }
        const cx = (W - cw) / 2;
        const cy = (H - ch) / 2;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 10;
        ctx.drawImage(img, cx, cy, cw, ch);
        ctx.restore();
      } else if (cfg.emoji) {
        ctx.save();
        ctx.font = '420px "Noto Color Emoji","Segoe UI Emoji","Apple Color Emoji",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 10;
        ctx.fillText(cfg.emoji, W / 2, H / 2);
        ctx.restore();
      }
    }

    function draw() {
      drawWithConfig(getConfig(), customChara || currentChara);
    }

    // プリセット変更
    presetSelect.addEventListener('change', function() {
      const preset = presets[this.value];
      if (!preset) return;
      customChara = null;
      if (preset.charaPath) {
        currentChara = new Image();
        currentChara.onload = draw; currentChara.onerror = draw;
        currentChara.src = preset.charaPath;
      } else {
        currentChara = new Image();
        draw();
      }
    });

    // カスタム画像
    document.getElementById('charaFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        customChara = new Image();
        customChara.onload = draw;
        customChara.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('redraw').addEventListener('click', draw);

    document.getElementById('download').addEventListener('click', () => {
      const preset = getPreset(presetSelect.value);
      const a = document.createElement('a');
      a.download = preset.destDir ? preset.destDir + '-ogp.png' : preset.filename;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    // ===== 一括ダウンロード =====
    document.getElementById('batchAll').addEventListener('click', async () => {
      const log = document.getElementById('batchLog');
      log.innerHTML = '<div>一括生成を開始...</div>';
      const keys = Object.keys(presets);
      for (let i = 0; i < keys.length; i++) {
        const key = keys[i], preset = presets[key];
        const cfg = { bgColors: preset.bgColors, glowColor1: preset.glowColor1, glowColor2: preset.glowColor2, emoji: preset.emoji || null };
        let img = null;
        if (preset.charaPath) {
          img = await new Promise(resolve => {
            const im = new Image();
            im.onload = () => resolve(im);
            im.onerror = () => resolve(null);
            im.src = preset.charaPath;
          });
        }
        drawWithConfig(cfg, img);
        const fname = preset.destDir ? preset.destDir + '-ogp.png' : preset.filename;
        const a = document.createElement('a');
        a.download = fname; a.href = canvas.toDataURL('image/png'); a.click();
        const status = (img && img.naturalWidth > 0) || cfg.emoji ? 'ok' : 'err';
        log.innerHTML += `<div class="${status}">${i+1}/${keys.length} ${preset.label||key} → ${fname}</div>`;
        await new Promise(r => setTimeout(r, 300));
      }
      log.innerHTML += '<div class="ok">完了！ダウンロードしたファイルを各ゲームフォルダに ogp.png として配置してください。</div>';
    });

    // 初期描画
    currentChara.onload = draw; currentChara.onerror = draw;
    currentChara.src = '../assets/images/illust9.png';
  </script>
</body>
</html>
