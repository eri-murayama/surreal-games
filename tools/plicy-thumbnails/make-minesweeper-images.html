<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>かいだんマインスイーパー サムネ・背景ジェネレーター</title>
<style>
  body { margin:0; background:#222; display:flex; flex-direction:column; align-items:center; padding:20px; font-family:sans-serif; color:#fff; gap:20px; }
  canvas { border:2px solid #fff; }
  button { padding:12px 32px; font-size:16px; background:#8866bb; color:#fff; border:none; border-radius:8px; cursor:pointer; margin:6px; }
  button:hover { background:#6644aa; }
  p { color:#aaa; margin-top:4px; }
  .block { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<h1>かいだんマインスイーパー 画像ジェネレーター</h1>

<div class="block">
  <h2>サムネ（640x480）</h2>
  <canvas id="thumb" width="640" height="480"></canvas>
  <p>こわくてのほほん系。紫の霧と、ふんわり浮かぶかわいいおばけ。</p>
  <button onclick="download('thumb','minesweeper-thumbnail.png')">サムネDL</button>
</div>

<div class="block">
  <h2>背景（2000x2000）</h2>
  <canvas id="bg" width="2000" height="2000"></canvas>
  <p>タイル状のマス目がうっすら浮かぶ、紫ベースの背景。</p>
  <button onclick="download('bg','minesweeper-background.png')">背景DL</button>
</div>

<script>
// ===== 共通: ふわふわ可愛いおばけを描く =====
function drawGhost(ctx, x, y, size, alpha=1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;

  // うっすら光るハロー
  const halo = ctx.createRadialGradient(0, 0, size*0.2, 0, 0, size*1.3);
  halo.addColorStop(0, 'rgba(200,160,240,0.5)');
  halo.addColorStop(1, 'rgba(200,160,240,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, size*1.3, 0, Math.PI*2);
  ctx.fill();

  // おばけ本体（白〜薄紫のグラデ）
  const body = ctx.createLinearGradient(0, -size, 0, size);
  body.addColorStop(0, '#ffffff');
  body.addColorStop(1, '#e8d8ff');
  ctx.fillStyle = body;
  ctx.strokeStyle = 'rgba(120,80,180,0.4)';
  ctx.lineWidth = size*0.04;

  ctx.beginPath();
  // 頭のドーム
  ctx.arc(0, -size*0.1, size*0.7, Math.PI, 0);
  // 右下のなみなみ
  ctx.lineTo(size*0.7, size*0.6);
  const waves = 4;
  for (let i = 0; i < waves; i++) {
    const x1 = size*0.7 - (size*1.4/waves) * (i + 0.5);
    const x2 = size*0.7 - (size*1.4/waves) * (i + 1);
    ctx.quadraticCurveTo(x1, size*0.9, x2, size*0.6);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 目（黒くて丸い、かわいい系）
  ctx.fillStyle = '#2a1a3a';
  ctx.beginPath();
  ctx.arc(-size*0.25, -size*0.1, size*0.11, 0, Math.PI*2);
  ctx.arc(size*0.25, -size*0.1, size*0.11, 0, Math.PI*2);
  ctx.fill();

  // 目のハイライト
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-size*0.22, -size*0.14, size*0.035, 0, Math.PI*2);
  ctx.arc(size*0.28, -size*0.14, size*0.035, 0, Math.PI*2);
  ctx.fill();

  // ほっぺ（ピンク）
  ctx.fillStyle = 'rgba(255,150,200,0.6)';
  ctx.beginPath();
  ctx.arc(-size*0.38, size*0.05, size*0.09, 0, Math.PI*2);
  ctx.arc(size*0.38, size*0.05, size*0.09, 0, Math.PI*2);
  ctx.fill();

  // お口（小さい丸)
  ctx.fillStyle = '#5a2a4a';
  ctx.beginPath();
  ctx.ellipse(0, size*0.1, size*0.06, size*0.08, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ===== サムネ描画 =====
function drawThumb() {
  const c = document.getElementById('thumb');
  const ctx = c.getContext('2d');
  const W = 640, H = 480;

  // 背景グラデ: 夜の紫
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0830');
  bg.addColorStop(0.6, '#2a1050');
  bg.addColorStop(1, '#0a0520');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 霧のぼかし
  for (let i = 0; i < 5; i++) {
    const g = ctx.createRadialGradient(
      W*Math.random(), H*Math.random(), 20,
      W*Math.random(), H*Math.random(), 260
    );
    g.addColorStop(0, 'rgba(150,100,200,0.25)');
    g.addColorStop(1, 'rgba(150,100,200,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // マス目（マインスイーパーの雰囲気）
  ctx.save();
  ctx.globalAlpha = 0.18;
  const cellSize = 40;
  const cols = 9, rows = 7;
  const gridW = cols * cellSize;
  const gridH = rows * cellSize;
  const gx = (W - gridW) / 2;
  const gy = H - gridH - 30;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const x = gx + col*cellSize;
      const y = gy + r*cellSize;
      ctx.fillStyle = (r + col) % 2 ? '#2a2a40' : '#1e1e35';
      ctx.fillRect(x, y, cellSize - 2, cellSize - 2);
      ctx.strokeStyle = '#3a3a50';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, cellSize - 2, cellSize - 2);
    }
  }
  // 旗のアクセント
  ctx.globalAlpha = 0.9;
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🚩', gx + 2.5*cellSize, gy + 1.5*cellSize);
  ctx.fillText('💣', gx + 6.5*cellSize, gy + 4.5*cellSize);
  ctx.fillText('1', gx + 4.5*cellSize, gy + 2.5*cellSize);
  ctx.fillStyle = '#5577cc';
  ctx.fillText('2', gx + 5.5*cellSize, gy + 3.5*cellSize);
  ctx.fillStyle = '#cc4444';
  ctx.fillText('3', gx + 3.5*cellSize, gy + 3.5*cellSize);
  ctx.restore();

  // 真ん中にでっかいかわいいおばけ
  drawGhost(ctx, W/2, H/2 - 40, 110, 0.95);

  // ちいさいおばけ
  drawGhost(ctx, W*0.15, H*0.25, 36, 0.7);
  drawGhost(ctx, W*0.85, H*0.30, 40, 0.8);
  drawGhost(ctx, W*0.10, H*0.70, 30, 0.6);

  // タイトル文字
  ctx.save();
  ctx.font = 'bold 44px "Hiragino Mincho ProN","Yu Mincho",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(180,120,240,0.9)';
  ctx.shadowBlur = 20;

  // 縁取り
  ctx.strokeStyle = '#2a0a3a';
  ctx.lineWidth = 8;
  ctx.strokeText('かいだんマインスイーパー', W/2, 60);

  // 本文
  const grad = ctx.createLinearGradient(0, 30, 0, 90);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#c8a0e8');
  ctx.fillStyle = grad;
  ctx.fillText('かいだんマインスイーパー', W/2, 60);

  // サブ
  ctx.shadowBlur = 10;
  ctx.font = '17px "Hiragino Mincho ProN",serif';
  ctx.fillStyle = '#e0c8ff';
  ctx.fillText('〜こわくてのほほん、地雷さがし〜', W/2, 105);
  ctx.restore();
}

// ===== 背景描画 =====
function drawBG() {
  const c = document.getElementById('bg');
  const ctx = c.getContext('2d');
  const W = 2000, H = 2000;

  // ベース: 紫のグラデ
  const bg = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W*0.8);
  bg.addColorStop(0, '#2a1050');
  bg.addColorStop(0.6, '#1a0830');
  bg.addColorStop(1, '#0a0418');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // うっすらマス目（マインスイーパー風）
  ctx.save();
  ctx.globalAlpha = 0.08;
  const cs = 80;
  for (let y = 0; y < H; y += cs) {
    for (let x = 0; x < W; x += cs) {
      ctx.fillStyle = ((x/cs + y/cs) % 2 === 0) ? '#6644aa' : '#3a1a5a';
      ctx.fillRect(x, y, cs - 2, cs - 2);
    }
  }
  ctx.restore();

  // 霧のぼかし
  for (let i = 0; i < 14; i++) {
    const g = ctx.createRadialGradient(
      W*Math.random(), H*Math.random(), 50,
      W*Math.random(), H*Math.random(), 500
    );
    g.addColorStop(0, 'rgba(160,100,220,0.22)');
    g.addColorStop(1, 'rgba(160,100,220,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ふわふわ散らばる可愛いおばけ
  const rng = (min, max) => min + Math.random() * (max - min);
  for (let i = 0; i < 22; i++) {
    drawGhost(ctx, rng(80, W-80), rng(80, H-80), rng(40, 130), rng(0.25, 0.65));
  }

  // うっすら星
  ctx.save();
  for (let i = 0; i < 120; i++) {
    ctx.globalAlpha = 0.15 + Math.random()*0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(rng(0, W), rng(0, H), rng(1, 4), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // 装飾記号（数字・旗・爆弾）
  ctx.save();
  const marks = ['🚩','💣','👻','✦'];
  for (let i = 0; i < 28; i++) {
    ctx.globalAlpha = 0.08 + Math.random()*0.08;
    ctx.font = `${rng(60, 130)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(marks[Math.floor(Math.random()*marks.length)], rng(0, W), rng(0, H));
  }
  ctx.restore();

  // 中央にうっすらタイトル
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.font = 'bold 180px "Hiragino Mincho ProN",serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('かいだん', W/2, H/2 - 110);
  ctx.fillText('マインスイーパー', W/2, H/2 + 110);
  ctx.restore();
}

function download(id, name) {
  const link = document.createElement('a');
  link.download = name;
  link.href = document.getElementById(id).toDataURL('image/png');
  link.click();
}

drawThumb();
drawBG();
</script>
</body>
</html>
