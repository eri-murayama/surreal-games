<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サムネイル - 経営分析ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: 'Zen Maru Gothic', sans-serif;
}

.thumbnail {
  width: 1280px;
  height: 720px;
  position: relative;
  background: linear-gradient(135deg, #0d0221 0%, #1a0a3e 30%, #2d1b69 60%, #0d0221 100%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 背景の放射状ライン */
.radial-bg {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1600px;
  height: 1600px;
  transform: translate(-50%, -50%);
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255, 215, 0, 0.08) 0deg 10deg,
    transparent 10deg 20deg
  );
  z-index: 1;
}

/* 金色のフレーム */
.gold-frame {
  position: absolute;
  inset: 12px;
  border: 4px solid;
  border-image: linear-gradient(135deg, #ffd700, #fff4a3, #ffd700, #b8860b, #ffd700) 1;
  z-index: 10;
  pointer-events: none;
}

.gold-frame-inner {
  position: absolute;
  inset: 20px;
  border: 2px solid rgba(255, 215, 0, 0.4);
  z-index: 10;
  pointer-events: none;
}

/* キャラクター */
.character {
  position: absolute;
  right: -20px;
  bottom: -10px;
  z-index: 5;
  filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
}

.character img {
  height: 680px;
  object-fit: contain;
}

/* メインテキストエリア */
.text-area {
  position: absolute;
  left: 40px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  max-width: 700px;
}

/* タイトル */
.main-title {
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  text-shadow:
    0 0 20px rgba(255, 215, 0, 0.8),
    0 0 40px rgba(255, 215, 0, 0.4),
    3px 3px 0 #1a0a3e,
    -1px -1px 0 #1a0a3e;
  line-height: 1.2;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}

.main-title .highlight {
  color: #ffd700;
  text-shadow:
    0 0 20px rgba(255, 215, 0, 0.9),
    0 0 40px rgba(255, 215, 0, 0.6),
    3px 3px 0 #8B6914;
}

/* サブテキスト（セリフ風） */
.subtitle {
  font-size: 36px;
  font-weight: 700;
  color: #ff6b6b;
  text-shadow:
    2px 2px 0 #0d0221,
    0 0 15px rgba(255, 107, 107, 0.6);
  margin-bottom: 24px;
  letter-spacing: 0.02em;
}

/* キャッチコピー吹き出し */
.speech-bubble {
  background: rgba(255, 255, 255, 0.95);
  color: #1a0a3e;
  font-size: 30px;
  font-weight: 900;
  padding: 14px 28px;
  border-radius: 16px;
  display: inline-block;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  margin-bottom: 20px;
}

.speech-bubble::after {
  content: '';
  position: absolute;
  right: 30px;
  bottom: -16px;
  border: 10px solid transparent;
  border-top-color: rgba(255, 255, 255, 0.95);
}

/* ロゴ */
.logo {
  font-size: 22px;
  font-weight: 700;
  color: rgba(255, 215, 0, 0.8);
  letter-spacing: 0.15em;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
}

/* キラキラ装飾 */
.sparkle {
  position: absolute;
  color: #ffd700;
  font-size: 28px;
  z-index: 15;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
}

/* 漫画風効果音 */
.sfx {
  position: absolute;
  font-size: 64px;
  font-weight: 900;
  color: #ff4444;
  text-shadow:
    3px 3px 0 #fff,
    -1px -1px 0 #fff,
    1px -1px 0 #fff,
    -1px 1px 0 #fff;
  z-index: 15;
  transform: rotate(-15deg);
}

/* 💴 装飾 */
.money {
  position: absolute;
  font-size: 48px;
  z-index: 3;
  opacity: 0.7;
}
</style>
</head>
<body>
<div class="thumbnail">
  <!-- 背景効果 -->
  <div class="radial-bg"></div>

  <!-- フレーム -->
  <div class="gold-frame"></div>
  <div class="gold-frame-inner"></div>

  <!-- キラキラ -->
  <span class="sparkle" style="top: 60px; left: 100px;">✦</span>
  <span class="sparkle" style="top: 150px; left: 750px; font-size: 20px;">✧</span>
  <span class="sparkle" style="top: 400px; left: 650px;">⋆</span>
  <span class="sparkle" style="bottom: 80px; left: 180px; font-size: 22px;">★</span>
  <span class="sparkle" style="top: 80px; left: 500px; font-size: 18px;">✦</span>

  <!-- お金の装飾 -->
  <span class="money" style="top: 50px; left: 620px; transform: rotate(-20deg);">💴</span>
  <span class="money" style="bottom: 100px; left: 60px; transform: rotate(15deg);">💸</span>
  <span class="money" style="top: 300px; left: 30px; transform: rotate(-10deg); font-size: 36px;">💰</span>

  <!-- 効果音 -->
  <span class="sfx" style="top: 40px; right: 200px; transform: rotate(12deg);">！？</span>

  <!-- テキストエリア -->
  <div class="text-area">
    <div class="speech-bubble">「客に金を配れば繁盛する」</div>
    <div class="main-title">
      <span class="highlight">天才</span>アナリストの<br>
      経営分析が<span class="highlight">ヤバい</span>
    </div>
    <div class="subtitle">～天才たちの戯れ～</div>
    <div class="logo">SURREAL GAMES ／ シュールゲームス</div>
  </div>

  <!-- キャラクター -->
  <div class="character">
    <img src="../../games/business-analysis/atsushi-pose.png" alt="篤">
  </div>
</div>
</body>
</html>
