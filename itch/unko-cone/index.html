<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Poopsicle Catcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating poop decoration -->
  <div class="bg-poops" aria-hidden="true">
    <span class="float-poop" style="--x:8%;--y:15%;--delay:0s;--dur:5s">💩</span>
    <span class="float-poop" style="--x:22%;--y:60%;--delay:1.5s;--dur:6s">💩</span>
    <span class="float-poop" style="--x:75%;--y:20%;--delay:0.8s;--dur:4.5s">💩</span>
    <span class="float-poop" style="--x:88%;--y:70%;--delay:2.2s;--dur:5.5s">💩</span>
    <span class="float-poop" style="--x:45%;--y:80%;--delay:3s;--dur:7s">💩</span>
    <span class="float-poop" style="--x:60%;--y:10%;--delay:1s;--dur:4s">🍦</span>
  </div>

  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <div class="title-container">
      <div class="title-icon">💩🍦</div>
      <h1 class="game-title">Poopsicle<br>Catcher</h1>
      <div class="character-preview" aria-hidden="true">
        <div class="character-preview-frame">
          <img src="unko-char.png" alt="Chocolate Soft Serve" class="character-img">
        </div>
      </div>
      <div id="highscore-display" class="highscore-display"></div>
      <button id="start-btn" class="btn-primary">💩 START GAME 💩</button>
      <div class="controls-help">
        <p class="help-title">Controls</p>
        <p>PC: ← → arrow keys to move</p>
        <p>Mobile: Touch left/right half of screen</p>
      </div>
    </div>
  </div>

  <!-- Story Screen -->
  <div id="story-screen" class="screen">
    <div class="story-container">
      <div class="story-poop-icon"><img src="unko-char.png" alt="Chocolate Soft Serve" class="story-poop-img"></div>
      <div class="story-bubble" id="story-bubble">
        <p id="story-text"></p>
      </div>
      <p class="story-tap-hint" id="story-tap-hint">Tap to continue</p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Stack</span>
        <span id="stack-count" class="hud-value">0</span>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="combo-text" class="combo-text" aria-hidden="true"></div>
    <div id="nishida-comment" class="nishida-comment" aria-hidden="true"></div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="result-container">
      <div class="result-icon">💩</div>
      <h2 class="result-title">Game Over</h2>
      <div class="result-stats">
        <div class="result-row">
          <span class="result-label">Score</span>
          <span id="final-score" class="result-value">0</span>
        </div>
        <div class="result-row">
          <span class="result-label">Max Stack</span>
          <span id="final-stack" class="result-value">0</span>
        </div>
      </div>
      <div class="result-rank" id="result-rank"></div>
      <div class="character-comment-box">
        <div class="character-face">
          <img src="unko-char.png" alt="Chocolate Soft Serve" class="character-result-img">
        </div>
        <div class="character-speech">
          <p class="character-name">Chocolate Soft Serve</p>
          <p id="character-text" class="character-text"></p>
        </div>
      </div>
      <button id="retry-btn" class="btn-primary">💩 Play Again 💩</button>
      <button id="title-btn" class="btn-secondary">Back to Title</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
